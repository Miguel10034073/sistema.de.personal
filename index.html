}

/* Ids de los documentos que usan la copia abierta, su papelera o algún punto del historial; null si no se pudo leer
   algún punto del historial (entonces no se borra nada). */
async function idsEnUso() {
  const usados = new Set(S.idx.archivos.concat(S.datos.papelera || []).map(a => a.id));
  for (const e of HIST.estados) {
    const f = await histLeer(e.seq);
    if (!f) return null;
    const { datos, idx } = JSON.parse(f);
    for (const a of (idx.archivos || []).concat((datos && datos.papelera) || [])) usados.add(a.id);
  }
  return usados;
}
/* Los documentos eliminados o reemplazados se quedan en el navegador para poder deshacer y en la papelera. Al abrir se
   borran los que ya no usa ni la copia abierta, ni su papelera, ni ningún punto del historial. */
async function limpiarHuerfanos() {
  try {
    const claves = await idb('docs', 'readonly', st => st.getAllKeys()); // primero las claves: lo que se agregue después no se toca
    const usados = await idsEnUso(); if (!usados) return;
    for (const k of claves) if (!usados.has(k)) await docBorrar(k);
  } catch (err) { console.error(err); }
}
/* Borra de «Documentos» los archivos que ya no usa nadie: ni lo abierto (con su papelera y su historial de deshacer), ni
   ninguna copia .json de la carpeta (las 7 diarias y las que tengan otro nombre). Si alguna copia no se puede leer, no borra nada. */
async function podarDocumentos() {
  const dir = await carpetaDocs(false); if (!dir) return;
  const usados = await idsEnUso(); if (!usados) return;
  for (const c of await listarCopiasJson()) {
    const cab = await cabeceraDeCopia(c.file).catch(() => null);
    if (!cab) return;
    if ((cab.version || 0) < VERSION_COPIA) continue; // las antiguas traen sus documentos dentro
    for (const a of (cab.archivos || []).concat((cab.datos && cab.datos.papelera) || [])) usados.add(a.id);
  }
  for (const [id, n] of [...S.docsCarpeta]) {
    if (usados.has(id)) continue;
    await dir.removeEntry(n).catch(() => {});
    S.docsCarpeta.delete(id);
  }
}

/* paso -1 deshace el último cambio; +1 rehace el que se deshizo. */
async function histIr(paso) {
  const i = HIST.pos + paso;
  if (HIST.ocupado || !S.datos || i < 0 || i >= HIST.estados.length) return;
  HIST.ocupado = true;
  try {
    const desc = HIST.estados[paso < 0 ? HIST.pos : i].desc;
    const foto = await histLeer(HIST.estados[i].seq);
    if (!foto) return aviso('Ese punto del historial ya no está en el navegador. Use «Abrir otra copia» en Ajustes para volver a una copia anterior.', true);
    const { datos, idx } = JSON.parse(foto);
    cerrarModal();
    document.querySelectorAll('.aviso button').forEach(b => b.parentElement.remove()); // los «Deshacer» de avisos anteriores ya no aplican
    S.datos = normalizarDatos(datos); S.idx = idx; HIST.pos = i;
    histEncolar(histMeta);
    S.sucio = true; S.cambios++;
    guardarSesion(); programarCopia();
    await cargar();
    const [v, id, tab] = ruta();
    if (v === 't' && !S.porId.has(id)) { // el trabajador cambió de carpeta (Activos / Retirados) o ya no existe
      const mismo = S.ws.find(x => x.nombre === ultimoSeg(id));
      location.hash = mismo ? linkT(mismo, tab) : '#/personal';
    } else rerender();
    aviso((paso < 0 ? 'Se deshizo: ' : 'Se rehízo: ') + desc);
  } catch (err) { console.error(err); aviso('No se pudo ' + (paso < 0 ? 'deshacer' : 'rehacer') + ': ' + err.message, true); }
  finally { HIST.ocupado = false; actualizarEstadoCopia(); actualizarBotonesHist(); }
}

function actualizarBotonesHist() {
  const d = $('[data-accion="deshacer"]'), r = $('[data-accion="rehacer"]');
  if (!d || !r) return;
  const atras = HIST.pos > 0 ? HIST.estados[HIST.pos] : null, adelante = HIST.estados[HIST.pos + 1];
  d.disabled = !S.datos || !atras; r.disabled = !S.datos || !adelante;
  d.title = atras ? `Deshacer: ${atras.desc} (${TECLA}Z)` : 'No hay cambios para deshacer';
  r.title = adelante ? `Rehacer: ${adelante.desc} (${TECLA}Y)` : 'No hay cambios para rehacer';
}

/* Aviso con botón para deshacer enseguida lo que se acaba de hacer (si después no hubo otro cambio). */
function avisoDeshacer(texto) {
  const seq = HIST.estados[HIST.pos] && HIST.estados[HIST.pos].seq;
  aviso(texto, false, { texto: 'Deshacer', fn: () => {
    if (!HIST.estados[HIST.pos] || HIST.estados[HIST.pos].seq !== seq) return aviso('Después hubo otros cambios: use «Deshacer» en la barra lateral, que va paso a paso.', true);
    histIr(-1);
  } });

/* ---------- Documentos: viven dentro de la copia (en el navegador mientras se trabaja) ---------- */

function asegurarCarpeta(ruta) {
  const seg = ruta.split('/');
  for (let i = 1; i <= seg.length; i++) {
    const p = seg.slice(0, i).join('/');
    if (!S.carpetasSet.has(p)) { S.carpetasSet.add(p); S.idx.carpetas.push(p); }
  }
}
async function agregarDocumento(carpeta, nombre, file) {
  nombre = nombre.replace(/[\\/:*?"<>|]/g, '-').trim();
  const ext = (nombre.match(/\.[^.]+$/) || [''])[0], base = ext ? nombre.slice(0, -ext.length) : nombre;
  let ruta = carpeta + '/' + nombre, i = 2;
  while (S.porRuta.has(ruta)) ruta = `${carpeta}/${base} (${i++})${ext}`;
  const id = 'd' + nuevoId() + Math.random().toString(36).slice(2, 6);
  const tipo = file.type || tipoPorNombre(nombre);
  await docPut(id, new Blob([file], { type: tipo }));
  asegurarCarpeta(carpeta);
  const a = { id, ruta, size: file.size, mtime: Date.now(), tipo };
  S.idx.archivos.push(a); S.porRuta.set(ruta, a);
  return ruta;
}
/* Mueve la carpeta de un trabajador (por ejemplo de Activos a Retirados) con todos sus documentos.
   Los registros de vacaciones siguen apuntando a su soporte con la ruta nueva. */
function moverRuta(de, a) {
  if (S.carpetasSet.has(a) || S.porRuta.has(a)) throw new Error('Ya existe una carpeta con ese nombre en el destino.');
  const cambia = r => r === de ? a : r.startsWith(de + '/') ? a + r.slice(de.length) : r;
  S.idx.carpetas = S.idx.carpetas.map(cambia);
  S.idx.archivos.forEach(x => { x.ruta = cambia(x.ruta); });
  for (const d of Object.values(S.datos.trabajadores)) for (const r of d.vacaciones || []) if (r.soporte) r.soporte = cambia(r.soporte);
  (S.datos.papelera || []).forEach(p => { p.ruta = cambia(p.ruta); }); // al restaurar vuelven a la carpeta nueva
  S.carpetasSet = new Set(S.idx.carpetas);
  asegurarCarpeta(padreDe(a));
}
/* ---------- Papelera ----------
   Lo eliminado y la versión anterior de lo reemplazado quedan en S.datos.papelera ({ id, ruta, size, mtime, tipo, trabajador,
   motivo, fecha }) durante DIAS_PAPELERA días: se pueden ver y restaurar sin deshacer los cambios posteriores. El archivo sigue
   con el mismo id en el navegador o en «Documentos». Pasados los días se quita solo al abrir la página. */
const DIAS_PAPELERA = 30;
function alPapelera(a, motivo) {
  const w = S.ws.find(x => a.ruta.startsWith(x.id + '/'));
  (S.datos.papelera ||= []).unshift({ id: a.id, ruta: a.ruta, size: a.size, mtime: a.mtime, tipo: a.tipo, trabajador: w ? w.nombre : '', motivo, fecha: new Date().toISOString() });
}
const entradaPapelera = id => (S.datos.papelera || []).find(p => p.id === id);
/* Vuelve a poner el documento en su carpeta original; si ya hay otro con ese nombre, queda como «(2)». */
async function restaurarDePapelera(id) {
  const p = entradaPapelera(id); if (!p) throw new Error('Ese documento ya no está en la papelera.');
  if (!await docGet(p.id)) throw new Error(`El archivo ya no está ni en este navegador ni en la carpeta «${CARPETA_DOCS}».`);
  const carpeta = padreDe(p.ruta), nombre = ultimoSeg(p.ruta);
  const ext = (nombre.match(/\.[^.]+$/) || [''])[0], base = ext ? nombre.slice(0, -ext.length) : nombre;
  let ruta = p.ruta;
  for (let i = 2; S.porRuta.has(ruta); i++) ruta = `${carpeta}/${base} (${i})${ext}`;
  asegurarCarpeta(carpeta);
  const a = { id: p.id, ruta, size: p.size, mtime: p.mtime, tipo: p.tipo };
  S.idx.archivos.push(a); S.porRuta.set(ruta, a);
  S.datos.papelera = S.datos.papelera.filter(x => x !== p);
  return ruta;
}
/* Quita de la papelera lo de más de DIAS_PAPELERA días (al abrir). También se puede deshacer. */
function podarPapelera() {
  const limite = Date.now() - DIAS_PAPELERA * 86400000, lista = S.datos.papelera || [];
  const quedan = lista.filter(p => Date.parse(p.fecha) >= limite);
  if (quedan.length === lista.length) return;
  S.datos.papelera = quedan;
  guardar(`Quitar de la papelera ${lista.length - quedan.length} documento(s) de más de ${DIAS_PAPELERA} días`);
}

/* Eliminar quita el documento del expediente y lo deja en la papelera (y en las copias de los días anteriores).
   El archivo se queda en el navegador para poder deshacer o restaurar (se borra al abrir, cuando ya no está ni en la papelera ni en el historial). */
async function borrarDocumento(ruta) {
  const a = S.porRuta.get(ruta); if (!a) return;
  alPapelera(a, 'eliminado');
  S.idx.archivos = S.idx.archivos.filter(x => x !== a);
  S.fotos.delete(a.id);
}
/* Cambia el contenido de un documento por otro archivo, con el mismo nombre y en la misma carpeta.
   Si el archivo nuevo es de otro tipo (por ejemplo .jpg en lugar de .pdf), conserva el nombre y cambia la extensión.
   El archivo nuevo se guarda aparte: el anterior queda en la papelera y se conserva para poder deshacer. */
async function reemplazarDocumento(ruta, file) {
  const a = S.porRuta.get(ruta); if (!a) throw new Error('No se encontró el documento.');
  const extVieja = (ruta.match(/\.[^./]+$/) || [''])[0], extNueva = (file.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
  const nueva = extNueva && extNueva !== extVieja.toLowerCase() ? ruta.slice(0, ruta.length - extVieja.length) + extNueva : ruta;
  if (nueva !== ruta && S.porRuta.has(nueva)) throw new Error(`Ya existe otro documento llamado «${ultimoSeg(nueva)}» en esa carpeta.`);
  const tipo = file.type || tipoPorNombre(nueva), id = 'd' + nuevoId() + Math.random().toString(36).slice(2, 6);
  await docPut(id, new Blob([file], { type: tipo }));
  alPapelera(a, 'reemplazado');
  S.fotos.delete(a.id);
  S.porRuta.delete(ruta);
  Object.assign(a, { id, ruta: nueva, size: file.size, mtime: Date.now(), tipo });
  S.porRuta.set(nueva, a);
  return nueva;
}

/* Visor: el documento se abre en una ventana emergente dentro de la página. */
async function verArchivo(ruta, descargar) {
  const a = S.porRuta.get(ruta); if (!a) return aviso('No se encontró el documento.', true);
  return mostrarDocumento(a, descargar);
}
async function verPapelera(id, descargar) {
  const p = entradaPapelera(id); if (!p) return aviso('Ese documento ya no está en la papelera.', true);
  return mostrarDocumento(p, descargar, true);
}
async function mostrarDocumento(a, descargar, enPapelera) {
  const blob = await docGet(a.id);

  if (descargar) {

    setTimeout(() => URL.revokeObjectURL(url), 60000);

    : /^(application\/pdf|text\/)/.test(tipo) ? `<iframe class="visor-marco" src="${url}" title="${h(nombre)}"></iframe>`
    : `<div class="vacio" style="flex:1">Los archivos ${h(ext || 'de este tipo')} no se pueden ver aquí. Use «Descargar» para abrirlo con su programa.</div>`;
  const donde = padreDe(a.ruta).split('/').map(sinNumero).join(' › ');
  const acciones = enPapelera
    ? `<button class="btn btn-chico" data-accion="descargar-papelera" data-id="${h(a.id)}">Descargar</button><button class="btn btn-chico btn-primario" data-accion="restaurar-papelera" data-id="${h(a.id)}">Restaurar</button>`
    : `<button class="btn btn-chico" data-accion="descargar-archivo" data-ruta="${h(a.ruta)}">Descargar</button><button class="btn btn-chico" data-accion="renombrar-archivo" data-ruta="${h(a.ruta)}">Renombrar</button><button class="btn btn-chico" data-accion="reemplazar-archivo" data-ruta="${h(a.ruta)}">Reemplazar</button><button class="btn btn-chico" data-accion="mover-archivo" data-ruta="${h(a.ruta)}">Mover</button><button class="btn btn-chico btn-peligro" data-accion="borrar-archivo" data-ruta="${h(a.ruta)}">Eliminar</button>`;
  abrirModal(`<div class="modal-cab"><div><h2>${enPapelera ? 'Papelera · ' : ''}${h(nombre)}</h2><p>${h(donde)} · ${tamano(a.size)}${enPapelera ? ' · ' + h(a.motivo === 'reemplazado' ? 'versión anterior, reemplazada' : 'eliminado') + ' el ' + h(fechaCorta(new Date(a.fecha))) : ''}</p></div>
      <div class="acciones"><button class="btn btn-chico" data-accion="visor-pestana">Abrir en otra pestaña</button>${acciones}<button class="cerrar" data-accion="cerrar-modal" aria-label="Cerrar">×</button></div></div>

/* Los registros de vacaciones que usan un documento como soporte lo siguen encontrando si cambia de nombre o de carpeta. */
function actualizarReferencias(vieja, nueva) {
  if (vieja === nueva) return;
  for (const d of Object.values(S.datos.trabajadores)) for (const r of d.vacaciones || []) if (r.soporte === vieja) r.soporte = nueva;
}
/* Lleva un documento a otra carpeta o le cambia el nombre (otro tipo de soporte u otro periodo) dentro del mismo expediente. */
async function moverDocumento(ruta, carpeta, nombre) {
  const a = S.porRuta.get(ruta); if (!a) throw new Error('No se encontró el documento.');
  nombre = nombre.replace(/[\\/:*?"<>|]/g, '-').trim();
  const ext = (nombre.match(/\.[^.]+$/) || [''])[0], base = ext ? nombre.slice(0, -ext.length) : nombre;
  let nueva = carpeta + '/' + nombre;
  for (let i = 2; nueva !== ruta && S.porRuta.has(nueva); i++) nueva = `${carpeta}/${base} (${i})${ext}`;
  if (nueva === ruta) return ruta;
  asegurarCarpeta(carpeta);
  S.porRuta.delete(ruta);
  Object.assign(a, { ruta: nueva, mtime: Date.now() });
  S.porRuta.set(nueva, a);
  return nueva;
}
/* Abre la ventana de soportes en modo "mover", con el tipo y el periodo que se deducen del nombre actual. */
function abrirMoverSoporte(ruta) {
  const w = S.ws.find(x => x.archivos.some(a => a.ruta === ruta)), a = w && w.archivos.find(x => x.ruta === ruta);
  if (!a) return aviso('No se encontró el documento.', true);
  const n = sinTildes(a.nombre), mes = MESES.findIndex(m => n.includes(m));
  const f = n.match(/(\d{1,2}) de ([a-z]+) de (\d{4})/), fm = f && MESES.indexOf(f[2]) >= 0 ? iso(new Date(+f[3], MESES.indexOf(f[2]), +f[1])) : '';
  abrirSubir(w, {
    tipo: TIPO_POR_CAT[a.cat] || 'otro', anio: anioDe(a.nombre) || undefined, mes: mes >= 0 ? mes + 1 : undefined,
    semestre: /segundo/.test(n) ? 2 : /primer/.test(n) ? 1 : undefined, fecha: fm || undefined,
    categoria: a.carpeta || undefined, texto: a.nombre.replace(/\.[^.]+$/, ''),
  });

  pintarSubir();

/* Cambiar el nombre de un documento: sigue en la misma carpeta y conserva su extensión. */
function abrirRenombrar(ruta) {
  const a = S.porRuta.get(ruta); if (!a) return aviso('No se encontró el documento.', true);
  const volver = !!(S.modal && S.modal.tipo === 'visor');
  const nombre = ultimoSeg(ruta), ext = (nombre.match(/\.[^.]+$/) || [''])[0], base = ext ? nombre.slice(0, -ext.length) : nombre;
  cerrarModal();

  abrirModal(`${cabModal('Cambiar el nombre', padreDe(ruta).split('/').map(sinNumero).join(' › '))}
    <div class="modal-cuerpo">
      <label class="campo">Nombre del documento<span style="display:flex;gap:6px;align-items:center"><input id="rNombre" value="${h(base)}">${ext ? `<span class="sutil">${h(ext)}</span>` : ''}</span></label>
      <p class="sutil" style="margin:0">El sistema reconoce los soportes por su nombre (por ejemplo «Prima de 2026 - primer semestre»): si cambia el tipo, el año o el mes, el documento puede pasar a otra casilla de los controles. Para llevarlo a otro tipo de soporte o a otra carpeta, use «Mover».</p>
    </div>

  $('#rNombre').select();
}
async function guardarRenombre() {
  const m = S.modal;
  let base = $('#rNombre').value.replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim();
  if (m.ext && base.toLowerCase().endsWith(m.ext.toLowerCase())) base = base.slice(0, -m.ext.length).trim(); // si escribieron también la extensión
  base = base.replace(/\.+$/, '');
  if (!base) return aviso('Escriba el nombre del documento.', true);
  const nueva = padreDe(m.ruta) + '/' + base + m.ext;
  if (nueva === m.ruta) return cerrarModal();
  if (S.porRuta.has(nueva)) return aviso(`Ya hay otro documento llamado «${base + m.ext}» en esa carpeta.`, true);
  await moverDocumento(m.ruta, padreDe(m.ruta), base + m.ext);
  actualizarReferencias(m.ruta, nueva);
  cerrarModal();
  guardar(`Renombrar «${ultimoSeg(m.ruta)}» a «${ultimoSeg(nueva)}»`); await cargar(); rerender();
  avisoDeshacer(`Ahora se llama «${ultimoSeg(nueva)}».`);
  if (m.volver) await verArchivo(nueva);
}

async function confirmarReemplazo(ruta, file) {
  if (!confirm(`¿Reemplazar «${ultimoSeg(ruta)}» por «${file.name}»?\n\nEl documento conserva su nombre y su carpeta. La versión anterior queda en la papelera por ${DIAS_PAPELERA} días, por si hay que recuperarla.`)) return;
  const enVisor = S.modal && S.modal.tipo === 'visor';
  try {
    const nueva = await reemplazarDocumento(ruta, file);
    actualizarReferencias(ruta, nueva);
    guardar(`Reemplazar «${ultimoSeg(ruta)}»`); await cargar(); rerender();
    avisoDeshacer(nueva === ruta ? 'Documento reemplazado.' : `Documento reemplazado (ahora es «${ultimoSeg(nueva)}»).`);
    if (enVisor) await verArchivo(nueva);
  } catch (err) { aviso('No se pudo reemplazar: ' + err.message, true); }
}
/* ---------- Exportar la carpeta de un trabajador en un .zip ----------
   Se arma aquí mismo (sin compresión: los PDF y fotos ya vienen comprimidos), con las subcarpetas del trabajador y sus
   documentos tal como se ven en la página. Primero pregunta dónde guardarlo y escribe el .zip directo en ese archivo. */
const CRC_TABLA = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLA[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function fechaDos(ms) {
  const d = new Date(ms || Date.now()), y = Math.max(1980, d.getFullYear());
  return { hora: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dia: ((y - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate() };
}
async function exportarZip(w) {
  const prefijo = w.id + '/', raiz = ultimoSeg(w.id);
  const nombreZip = `${raiz} - expediente ${iso(hoy())}.zip`.replace(/[\\/:*?"<>|]/g, '-');
  const carpetas = S.idx.carpetas.filter(c => c.startsWith(prefijo)).sort();
  const archivos = S.idx.archivos.filter(a => a.ruta.startsWith(prefijo)).sort((a, b) => a.ruta.localeCompare(b.ruta, 'es'));
  let destino = null;
  if (window.showSaveFilePicker) {
    try {
      const hd = await window.showSaveFilePicker({ suggestedName: nombreZip, types: [{ description: 'Archivo ZIP', accept: { 'application/zip': ['.zip'] } }] });
      destino = await hd.createWritable();
    } catch (e) { if (e.name === 'AbortError') return; throw e; }
  }
  cerrarModal();
  abrirModal(`<div class="modal-cab"><div><h2>Exportando a ZIP</h2><p>${h(nombreBonito(w.nombre))} · ${archivos.length} documento(s)</p></div></div>
    <div class="modal-cuerpo"><div class="barra" style="height:10px"><div id="zipBarra" style="width:0%"></div></div><div class="sutil" id="zipTexto">Preparando…</div></div>`);
  S.modal = { tipo: 'zip' };
  const partes = [], enc = new TextEncoder(), central = [], faltan = [];
  let offset = 0;
  const escribir = async x => { if (destino) await destino.write(x); else partes.push(x); offset += x.byteLength; };
  const agregar = async (nombre, bytes, mtime, carpeta) => {
    const n = enc.encode(nombre), { hora, dia } = fechaDos(mtime), crc = carpeta ? 0 : crc32(bytes), tam = bytes.length, inicio = offset;
    const loc = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, hora, 2], [12, dia, 2], [14, crc, 4], [18, tam, 4], [22, tam, 4], [26, n.length, 2], [28, 0, 2]]
      .forEach(([o, v, l]) => l === 4 ? loc.setUint32(o, v, true) : loc.setUint16(o, v, true));
    await escribir(new Uint8Array(loc.buffer)); await escribir(n); if (tam) await escribir(bytes);
    const cen = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, hora, 2], [14, dia, 2], [16, crc, 4], [20, tam, 4], [24, tam, 4], [28, n.length, 2],
      [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, carpeta ? 0x10 : 0, 4], [42, inicio, 4]]
      .forEach(([o, v, l]) => l === 4 ? cen.setUint32(o, v, true) : cen.setUint16(o, v, true));
    central.push(new Uint8Array(cen.buffer), n);
  };
  try {
    await agregar(raiz + '/', new Uint8Array(0), Date.now(), true);
    for (const c of carpetas) await agregar(raiz + c.slice(w.id.length) + '/', new Uint8Array(0), Date.now(), true);
    for (let i = 0; i < archivos.length; i++) {
      const a = archivos[i], blob = await docGet(a.id);
      if (blob) await agregar(raiz + a.ruta.slice(w.id.length), new Uint8Array(await blob.arrayBuffer()), a.mtime, false);
      else faltan.push(a.ruta.slice(prefijo.length));
      const b = $('#zipBarra'), t = $('#zipTexto');
      if (b) b.style.width = Math.round((i + 1) / archivos.length * 100) + '%';
      if (t) t.textContent = `${i + 1} de ${archivos.length} documentos · ${tamano(offset)}`;
    }
    if (faltan.length) await agregar(raiz + '/DOCUMENTOS QUE NO SE ENCONTRARON.txt', enc.encode('Estos documentos están en el índice del expediente pero no se encontraron al exportar:\r\n\r\n' + faltan.join('\r\n') + '\r\n'), Date.now(), false);
    const inicioCentral = offset;
    for (const x of central) await escribir(x);
    const fin = new DataView(new ArrayBuffer(22)), total = central.length / 2;
    [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, total, 2], [10, total, 2], [12, offset - inicioCentral, 4], [16, inicioCentral, 4], [20, 0, 2]]
      .forEach(([o, v, l]) => l === 4 ? fin.setUint32(o, v, true) : fin.setUint16(o, v, true));
    await escribir(new Uint8Array(fin.buffer));
    if (destino) await destino.close();
    else {
      const url = URL.createObjectURL(new Blob(partes, { type: 'application/zip' }));
      const l = document.createElement('a'); l.href = url; l.download = nombreZip; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    cerrarModal();
    aviso(`ZIP listo: «${nombreZip}» con ${archivos.length - faltan.length} documento(s) (${tamano(offset)}).` + (faltan.length ? ` ${faltan.length} no se encontraron (ver el .txt dentro del ZIP).` : ''), !!faltan.length);
  } catch (err) {
    if (destino) await destino.abort().catch(() => {});
    cerrarModal();
    throw err;
  }
}

async function cargarFotos() {
  for (const w of S.ws) {
    const f = w.det.foto;
    if (f && !S.fotos.has(f.id)) { const b = await docGet(f.id); if (b) S.fotos.set(f.id, URL.createObjectURL(b)); }
  }
}

/* accion (opcional): { texto, fn } agrega un botón al aviso, por ejemplo «Deshacer». */
function aviso(texto, error, accion) {
  const d = document.createElement('div');
  d.className = 'aviso' + (error ? ' error' : '');
  d.textContent = texto;
  if (accion) {
    const b = document.createElement('button');
    b.textContent = accion.texto;
    b.onclick = () => { d.remove(); accion.fn(); };
    d.appendChild(b);
  }
  $('#avisos').appendChild(d);
  setTimeout(() => d.remove(), error ? 7000 : accion ? 9000 : 3800);
}

function normalizarDatos(d) {
  d = d && typeof d === 'object' ? d : {};
  d.version = d.version || 1;
  d.ajustes = { ...AJUSTES_BASE, ...(d.ajustes || {}) };
  d.ajustes.smmlv = { ...AJUSTES_BASE.smmlv, ...((d.ajustes && d.ajustes.smmlv) || {}) };
  d.ajustes.auxTransporte = { ...AJUSTES_BASE.auxTransporte, ...((d.ajustes && d.ajustes.auxTransporte) || {}) };
  if (!d.ajustes.empresa) d.ajustes.empresa = COMPANIA.nombre; // compañía nueva: su nombre, que se cambia en Ajustes
  d.trabajadores = d.trabajadores || {};
  return d;
}

/* Reconstruye los expedientes a partir del índice de carpetas y documentos de la sesión. */
async function cargar() {
  S.carpetasSet = new Set(S.idx.carpetas);
  S.porRuta = new Map(S.idx.archivos.map(a => [a.ruta, a]));
  S.totalArchivos = S.idx.archivos.length;
  const items = S.idx.carpetas.map(c => [c, 1]).concat(S.idx.archivos.map(a => [a.ruta, 0, a.size, a.mtime, a.id]));
  const r = construirTrabajadores(items);
  S.ws = r.trabajadores; S.grupos = r.grupos; S.generales = r.generales;
  await cargarFotos();
  aplicar();
}

function aplicar() {
  S.porId = new Map(S.ws.map(w => [w.id, w]));
  const porNombre = {};
  for (const w of S.ws) {
    w.d = S.datos.trabajadores[w.id] || {};
    w.estado = w.d.estado || w.estadoCarpeta || (liquidado(w) ? 'Retirado' : 'Activo');
    (porNombre[sinTildes(w.nombre)] ||= []).push(w);
  }
  for (const w of S.ws) { w.otros = porNombre[sinTildes(w.nombre)].filter(x => x !== w); calcularTodo(w); }
  pintarCompania();
}

function datosDe(w) {
  if (!S.datos.trabajadores[w.id]) S.datos.trabajadores[w.id] = {};
  w.d = S.datos.trabajadores[w.id];
  return w.d;
}
function recalcular(w) {
  w.estado = w.d.estado || w.estadoCarpeta || (liquidado(w) ? 'Retirado' : 'Activo');
  calcularTodo(w);
}

/* ---------- Enrutador ---------- */

function ruta() { return location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent); }

function render() {
  const [v, a, b] = ruta();
  const nav = v === 'control' ? 'control/' + (a || 'vacaciones') : v === 't' ? 'personal' : (v || 'panel');
  document.querySelectorAll('#menu a').forEach(x => x.classList.toggle('activo', x.dataset.nav === nav));
  S.csv = null;
  actualizarMigas(v, a, b); actualizarCuentasMenu();
  let html;
  try {
    if (v === 't') html = vFicha(S.porId.get(a), b || 'resumen');
    else if (v === 'personal') html = vPersonal();
    else if (v === 'control') html = vControl(a || 'vacaciones');
    else if (v === 'ajustes') html = vAjustes();
    else html = vPanel();
  } catch (err) { console.error(err); html = `<div class="nota">Error al mostrar la vista: ${h(err.message)}</div>`; }
  $('#principal').innerHTML = html;
}

function rerender() {
  const act = document.activeElement, clave = act && act.dataset ? act.dataset.campo || act.dataset.ajuste : null, y = window.scrollY;
  render();
  window.scrollTo(0, y);
  if (clave) { const el = document.querySelector(`[data-campo="${CSS.escape(clave)}"], [data-ajuste="${CSS.escape(clave)}"]`); if (el) el.focus(); }
}

/* ---------- Piezas comunes ---------- */

function avatar(w, grande) {
  const cls = 'avatar ' + tonoAvatar(w.nombre) + (grande ? ' grande' : '');
  return w.det.foto && S.fotos.get(w.det.foto.id) ? `<span class="${cls}"><img src="${S.fotos.get(w.det.foto.id)}" alt=""></span>` : `<span class="${cls}">${h(iniciales(w.nombre))}</span>`;
}
function persona(w, extra) {
  const nc = numeroContrato(w), otroNumero = nc && soloDigitos(nc) !== soloDigitos(w.d.documento);
  return `<div class="persona">${avatar(w)}<div><strong>${h(nombreBonito(w.nombre))}</strong><span class="sutil">${h(extra ?? (w.d.documento ? 'C.C. ' + w.d.documento + (otroNumero ? ' · contrato ' + nc : '') : 'Sin documento registrado'))}</span></div></div>`;
}
function contadorAlertas(w) {
  const alta = w.alertas.filter(a => a.nivel === 'alta').length, otras = w.alertas.length - alta;
  if (!w.alertas.length) return chip('ok', 'Al día');
  return `<span class="contador">${alta ? `<span class="chip e-pend" title="Prioritarias">${alta}</span>` : ''}${otras ? `<span class="chip e-sin" title="Otras">${otras}</span>` : ''}</span>`;
}
function filaArchivo(a, mostrarCarpeta) {
  const ext = (a.nombre.match(/\.([^.]+)$/) || [, ''])[1].toLowerCase();
  const donde = mostrarCarpeta ? `<span class="sutil">${h([sinNumero(a.carpeta), ...a.sub.map(sinNumero)].filter(Boolean).join(' › '))}</span>` : (a.sub.length ? `<span class="sutil">${h(a.sub.map(sinNumero).join(' › '))}</span>` : '');
  return `<div class="archivo"><span class="ext ext-${h(ext)}">${h(ext || '—')}</span><button class="enlace nombre" style="text-align:left" data-accion="ver-archivo" data-ruta="${h(a.ruta)}" title="${h(a.ruta)}">${h(a.nombre)}</button><span class="meta-archivo">${donde}<span class="sutil num">${tamano(a.size)}</span></span>
    <span class="acc"><button class="btn btn-chico" data-accion="ver-archivo" data-ruta="${h(a.ruta)}">Ver</button><button class="btn btn-chico" data-accion="descargar-archivo" data-ruta="${h(a.ruta)}" title="Descargar una copia del documento">Descargar</button><button class="btn btn-chico" data-accion="renombrar-archivo" data-ruta="${h(a.ruta)}" title="Cambiar el nombre del documento (sigue en la misma carpeta)">Renombrar</button><button class="btn btn-chico" data-accion="reemplazar-archivo" data-ruta="${h(a.ruta)}" title="Cambiar el archivo por otro, con el mismo nombre (la versión anterior queda en la papelera)">Reemplazar</button><button class="btn btn-chico" data-accion="mover-archivo" data-ruta="${h(a.ruta)}" title="Pasarlo a otro tipo de soporte u otro periodo (por ejemplo de Vacaciones a Dotación, o de 2022 a 2025)">Mover</button><button class="btn btn-chico btn-peligro" data-accion="borrar-archivo" data-ruta="${h(a.ruta)}" title="Quitar el documento del expediente (queda en la papelera)">Eliminar</button></span></div>`;
}
/* Papelera: de un trabajador (w) o toda (en Ajustes). */
function papeleraDe(w) { return (S.datos.papelera || []).filter(p => !w || p.ruta.startsWith(w.id + '/')); }
function listaPapelera(lista, conTrabajador) {
  return `<div class="archivos">${lista.map(p => {
    const nombre = ultimoSeg(p.ruta), ext = (nombre.match(/\.([^.]+)$/) || [, ''])[1].toLowerCase();
    const partes = partesRuta(p.ruta), i = partes.findIndex(x => x === p.trabajador);
    const donde = (conTrabajador && p.trabajador ? [nombreBonito(p.trabajador)] : []).concat((i >= 0 ? partes.slice(i + 1, -1) : partes.slice(0, -1)).map(sinNumero)).join(' › ');
    const que = (p.motivo === 'reemplazado' ? 'Versión anterior, reemplazada' : 'Eliminado') + ' el ' + fechaCorta(new Date(p.fecha));
    return `<div class="archivo"><span class="ext ext-${h(ext)}">${h(ext || '—')}</span><button class="enlace nombre" style="text-align:left" data-accion="ver-papelera" data-id="${h(p.id)}" title="${h(p.ruta)}">${h(nombre)}</button><span class="meta-archivo"><span class="sutil">${h(donde)}</span><span class="sutil">${h(que)}</span><span class="sutil num">${tamano(p.size)}</span></span>
    <span class="acc"><button class="btn btn-chico" data-accion="ver-papelera" data-id="${h(p.id)}">Ver</button><button class="btn btn-chico" data-accion="restaurar-papelera" data-id="${h(p.id)}" title="Volver a ponerlo en su carpeta, sin deshacer los demás cambios">Restaurar</button></span></div>`;
  }).join('')}</div>`;
}
function tarjetaPapelera(w) {
  const lista = papeleraDe(w);
  return `<div class="tarjeta"><div class="tarjeta-titulo"><h2>Papelera${lista.length ? ` (${lista.length})` : ''}</h2>
      ${lista.length ? `<div class="acciones"><button class="btn btn-chico btn-peligro" data-accion="vaciar-papelera" ${w ? `data-wid="${h(w.id)}"` : ''}>Vaciar${w ? '' : ' papelera'}</button></div>` : ''}</div>
    <div class="tarjeta-cuerpo"><p class="sutil" style="margin:0 0 8px">Documentos eliminados y versiones anteriores de documentos reemplazados${w ? ' de este trabajador' : ''}, de los últimos ${DIAS_PAPELERA} días. <strong>Restaurar</strong> los vuelve a poner en su carpeta sin deshacer los demás cambios; si ya hay otro con el mismo nombre, queda como «(2)».</p>
    ${lista.length ? listaPapelera(lista, !w) : '<span class="sutil">La papelera está vacía.</span>'}</div></div>`;
}
function listaArchivos(arr, vacio = '') {
  if (!arr || !arr.length) return vacio ? `<span class="sutil">${h(vacio)}</span>` : '';
  return `<div class="archivos">${arr.map(a => filaArchivo(a)).join('')}</div>`;
}
function enlacesArchivos(arr) {
  if (!arr || !arr.length) return '<span class="sutil">—</span>';
  return arr.map(a => `<button class="enlace" style="text-align:left" data-accion="ver-archivo" data-ruta="${h(a.ruta)}" title="${h(a.nombre)}">${h(a.nombre.replace(/\.[^.]+$/, ''))}</button>`).join('<br>');
}
function campo(w, rutaC, etq, tipo = 'text', opciones, extra = '') {
  const v = obtener(w.d, rutaC) ?? '';
  const attrs = `data-campo="${h(rutaC)}" data-wid="${h(w.id)}" ${extra}`;
  if (tipo === 'select') {
    return `<label class="campo">${h(etq)}<select ${attrs}>${opciones.map(o => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<option value="${h(val)}" ${String(v) === String(val) ? 'selected' : ''}>${h(txt)}</option>`; }).join('')}</select></label>`;
  }
  if (tipo === 'textarea') return `<label class="campo ancho">${h(etq)}<textarea ${attrs}>${h(v)}</textarea></label>`;
  return `<label class="campo">${h(etq)}<input type="${tipo}" ${attrs} value="${h(v)}"></label>`;
}
function areasDisponibles(filtroTipo) {
  return [...new Set(S.ws.filter(w => !filtroTipo || filtroTipo(w)).map(w => w.area))];
}
function antiguedad(w) {
  const ing = ingresoDe(w); if (!ing) return '';
  const fin = retiroDe(w) || hoy();
  let m = (fin.getFullYear() - ing.getFullYear()) * 12 + fin.getMonth() - ing.getMonth();
  if (fin.getDate() < ing.getDate()) m--;
  const a = Math.floor(m / 12), r = m % 12;
  return [a ? a + (a === 1 ? ' año' : ' años') : '', r ? r + (r === 1 ? ' mes' : ' meses') : ''].filter(Boolean).join(' y ') || 'Menos de un mes';
}

/* ---------- Vista: Panel ---------- */

function proximosVencimientos() {
  const H = hoy(), y = H.getFullYear(), lista = [];
  for (const yy of [y, y + 1]) {
    lista.push({ f: new Date(yy, 3, 30), t: 'Entrega de dotación (abril)', c: 'dotacion' });
    lista.push({ f: new Date(yy, 5, 30), t: 'Prima de servicios, primer semestre', c: 'primas' });
    lista.push({ f: new Date(yy, 7, 31), t: 'Entrega de dotación (agosto)', c: 'dotacion' });
    lista.push({ f: new Date(yy, 11, 20), t: 'Prima de servicios, segundo semestre', c: 'primas' });
    lista.push({ f: new Date(yy, 11, 20), t: 'Entrega de dotación (diciembre)', c: 'dotacion' });
    lista.push({ f: new Date(yy, 0, 31), t: `Pago de intereses de cesantías ${yy - 1}`, c: 'cesantias' });
    lista.push({ f: new Date(yy, 1, 14), t: `Consignación de cesantías ${yy - 1} al fondo`, c: 'cesantias' });
  }
  return lista.filter(x => x.f >= H).sort((a, b) => a.f - b.f).slice(0, 5)
    .map(x => ({ ...x, dias: Math.round((x.f - H) / 86400000) }));
}

function cobertura() {
  const act = S.ws.filter(w => w.estado === 'Activo');
  const contar = (celdas) => { const due = celdas.filter(c => c.estado !== 'prox' && c.estado !== 'na' && c.estado !== 'curso'); return [due.filter(c => OK_ESTADOS.has(c.estado)).length, due.length]; };
  const sum = f => act.reduce((t, w) => { const [a, b] = f(w); return [t[0] + a, t[1] + b]; }, [0, 0]);
  return [
    { t: 'Primas', c: 'primas', v: sum(w => contar(w.c.primas ? w.c.primas.celdas : [])) },
    { t: 'Dotación', c: 'dotacion', v: sum(w => contar(w.c.dotacion ? w.c.dotacion.celdas : [])) },
    { t: 'Intereses de cesantías', c: 'cesantias', v: sum(w => contar(w.c.cesantias ? w.c.cesantias.filas.map(f => ({ estado: f.int })) : [])) },
    { t: 'Vacaciones', c: 'vacaciones', v: sum(w => contar(w.c.vacaciones ? w.c.vacaciones.periodos : [])) },
    { t: 'Afiliaciones', c: 'afiliaciones', v: sum(w => contar(w.c.afiliaciones.filter(a => a.requerido))) },
    { t: 'Documentos requeridos', c: 'documentos', v: sum(w => contar(w.c.documentos.filter(d => d.req))) },
  ];
}

function tarjetaVacacionesPanel() {
  const H = hoy(), lim = sumarDias(H, 60), filas = [];
  for (const w of S.ws.filter(x => x.estado === 'Activo' && x.tipo === 'laboral')) {
    const fv = fechasVacTrabajador(w);
    if (fv.actual) filas.push({ w, orden: 0, t: `En vacaciones · regresa el ${fechaCorta(diaRegreso(finRegistro(fv.actual)))}`, e: 'reg' });
    else if (fv.prox && fecha(fv.prox.desde) <= lim) filas.push({ w, orden: 1, t: `Sale el ${fechaCorta(fv.prox.desde)} · ${fmtDias(fv.prox.dias)} días`, e: 'prox' });
  }
  filas.sort((a, b) => a.orden - b.orden);
  return `<div class="tarjeta"><div class="tarjeta-titulo"><h2>${icono('vacaciones')}Vacaciones en curso y próximas</h2><a class="sutil" href="#/control/vacaciones">Ver control</a></div>
    ${filas.length ? filas.map(f => `<div class="vencimiento"><a href="${linkT(f.w, 'vacaciones')}">${h(nombreBonito(f.w.nombre))}</a>${chip(f.e, f.t)}</div>`).join('') : '<div class="vacio">Nadie está de vacaciones ni tiene salidas programadas en los próximos 60 días.</div>'}</div>`;
}

function vPanel() {
  const act = S.ws.filter(w => w.estado === 'Activo'), ret = S.ws.filter(w => w.estado !== 'Activo');
  const todas = S.ws.flatMap(w => w.alertas.map(a => ({ ...a, w })));
  const altas = todas.filter(a => a.nivel === 'alta');
  const sinFicha = act.filter(w => !w.d.fechaIngreso).length;
  const porArea = areasDisponibles().map(a => ({ a, n: act.filter(w => w.area === a).length, r: ret.filter(w => w.area === a).length }));
  const kpi = (ico, tono, etq, valor, det, alerta) => `<div class="tarjeta kpi${alerta ? ' alerta' : ''}"><div class="kpi-cab"><span class="kpi-ico t-${tono}">${icono(ico)}</span><span class="etq">${etq}</span></div><div class="valor">${valor}</div><div class="det">${det}</div></div>`;
  const grupos = Object.keys(TIPOS_ALERTA).map(t => ({ t, items: todas.filter(a => a.tipo === t) })).filter(g => g.items.length)
    .sort((a, b) => b.items.filter(x => x.nivel === 'alta').length - a.items.filter(x => x.nivel === 'alta').length || b.items.length - a.items.length);
  return `
  <div class="encabezado"><div><h1>Panel de control</h1><p>${h(S.datos.ajustes.empresa)} · corte al ${fechaLarga(hoy())}</p></div>
    <div class="acciones"><a class="btn" href="#/personal">Ver personal</a><button class="btn btn-primario" data-accion="nuevo-trabajador">+ Nuevo trabajador</button></div></div>
  <div class="rejilla rejilla-4">
    ${kpi('personal', 'verde', 'Trabajadores activos', act.length, porArea.filter(x => x.n).map(x => `${h(x.a)}: ${x.n}`).join(' · '))}
    ${kpi('retirados', 'gris', 'Retirados con expediente', ret.length, `${S.totalArchivos.toLocaleString('es-CO')} soportes en las carpetas`)}
    ${kpi('alerta', 'rojo', 'Alertas prioritarias', altas.length, `${todas.length} alertas en total`, altas.length > 0)}
    ${kpi('ficha', 'ambar', 'Hojas de vida sin fecha de ingreso', sinFicha, sinFicha ? 'Los controles de estos trabajadores son estimados' : 'Todas completas')}
  </div>
  <div class="rejilla rejilla-panel">
    <div class="tarjeta">
      <div class="tarjeta-titulo"><h2>${icono('lista')}Qué falta por hacer</h2><span class="sutil">Clic en un grupo para ver el detalle</span></div>
      ${grupos.length ? grupos.map(g => {
        const alta = g.items.filter(x => x.nivel === 'alta').length;
        const items = g.items.slice().sort((a, b) => a.w.nombre.localeCompare(b.w.nombre));
        return `<details class="grupo-alerta"><summary><span><strong>${h(TIPOS_ALERTA[g.t])}</strong> <span class="sutil">· ${new Set(g.items.map(x => x.w.id)).size} trabajador(es)</span></span>
          <span class="contador">${alta ? `<span class="chip e-pend">${alta} prioritarias</span>` : ''}<span class="chip e-sin">${g.items.length}</span></span></summary>
          <div class="items">${items.slice(0, 300).map(a => `<div class="item"><a href="${linkT(a.w, a.tab)}">${h(nombreBonito(a.w.nombre))}</a><span class="n-${a.nivel}">●</span><span>${h(a.texto)}</span></div>`).join('')}</div></details>`;
      }).join('') : '<div class="vacio">No hay pendientes. Todo está al día.</div>'}
    </div>
    <div class="rejilla" style="align-content:start">
      <div class="tarjeta"><div class="tarjeta-titulo"><h2>${icono('calendario')}Próximos vencimientos</h2><span class="sutil">Fechas de ley</span></div>
        ${proximosVencimientos().map(x => `<div class="vencimiento"><div class="fecha-bloque"><span>${MES_CORTO[x.f.getMonth()]}</span><strong>${x.f.getDate()}</strong></div><div class="venc-info"><strong>${h(x.t)}</strong><div class="sutil">${fechaLarga(x.f)}</div></div>${chip(x.dias <= 15 ? 'pend' : x.dias <= 45 ? 'sin' : 'prox', x.dias === 0 ? 'Hoy' : `En ${x.dias} días`)}</div>`).join('')}
      </div>
      ${tarjetaVacacionesPanel()}
      <div class="tarjeta"><div class="tarjeta-titulo"><h2>${icono('check')}Soportes al día</h2><span class="sutil">Trabajadores activos</span></div>
        <div class="tarjeta-cuerpo cobertura">
        ${cobertura().map(c => { const p = c.v[1] ? Math.round(c.v[0] / c.v[1] * 100) : 100; return `<a href="#/control/${c.c}"><div class="fila"><span>${h(c.t)}</span><span class="num muted">${c.v[0]} de ${c.v[1]} · <strong>${p} %</strong></span></div><div class="barra ${p >= 90 ? '' : p >= 70 ? 'b-aviso' : 'b-pend'}"><div style="width:${p}%"></div></div></a>`; }).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- Vista: Personal ---------- */

function filtrar(lista, f) {
  const q = sinTildes(f.q);
  return lista.filter(w => (f.estado === 'Todos' || w.estado === f.estado) && (!f.area || w.area === f.area) &&
    (!q || sinTildes(w.nombre + ' ' + (w.d.documento || '') + ' ' + numeroContrato(w) + ' ' + (w.d.cargo || '')).includes(q)));
}

function barraFiltros(f, prefijo, extra = '') {
  return `<div class="filtros">
    <div class="segmentado">${['Activo', 'Retirado', 'Todos'].map(e => `<button data-accion="filtro" data-f="${prefijo}" data-k="estado" data-v="${e}" class="${f.estado === e ? 'activo' : ''}">${e === 'Activo' ? 'Activos' : e === 'Retirado' ? 'Retirados' : 'Todos'}${prefijo === 'filtros' ? `<span class="n">${e === 'Todos' ? S.ws.length : S.ws.filter(w => w.estado === e).length}</span>` : ''}</button>`).join('')}</div>
    <select data-filtro="${prefijo}" data-k="area"><option value="">Todas las áreas</option>${areasDisponibles().map(a => `<option ${f.area === a ? 'selected' : ''}>${h(a)}</option>`).join('')}</select>
    ${prefijo === 'filtros' && f.q ? `<span class="chip e-prox">Búsqueda: «${h(f.q)}» <button class="enlace" data-accion="limpiar-busqueda" title="Quitar la búsqueda">×</button></span>` : ''}
    ${extra}
  </div>`;
}

function vPersonal() {
  const lista = filtrar(S.ws, S.filtros);
  return `
  <div class="encabezado"><div><h1>Personal</h1><p>${lista.length} trabajador(es) · cada fila abre el expediente completo</p></div>
    <div class="acciones"><button class="btn btn-primario" data-accion="nuevo-trabajador">+ Nuevo trabajador</button></div></div>
  ${barraFiltros(S.filtros, 'filtros')}
  <div class="tarjeta tabla-env"><table>
    <thead><tr><th>Trabajador</th><th>Área</th><th>Vinculación</th><th>Cargo</th><th>Ingreso</th><th>Estado</th><th>Pendientes</th><th class="centro">Soportes</th></tr></thead>
    <tbody>${lista.map(w => `<tr class="clic" data-ir="${h(linkT(w))}">
      <td>${persona(w)}</td><td>${h(w.area)}</td><td>${h(TIPO_NOMBRE[w.tipo])}</td><td>${h(w.d.cargo || '')}</td>
      <td class="num">${w.d.fechaIngreso ? fechaCorta(w.d.fechaIngreso) : '<span class="sutil">Sin registrar</span>'}</td>
      <td>${chip(w.estado === 'Activo' ? 'ok' : 'na', w.estado)}${w.otros.length ? ` <span class="sutil" title="También aparece en otra carpeta">+${w.otros.length} vínculo</span>` : ''}</td>
      <td>${contadorAlertas(w)}</td><td class="centro num">${w.archivos.length}</td></tr>`).join('') || '<tr><td colspan="8" class="vacio">No hay trabajadores con estos filtros.</td></tr>'}
    </tbody></table></div>`;
}

/* ---------- Vista: Ficha del trabajador ---------- */

function pestanasDe(w) {
  const p = [['resumen', 'Resumen'], ['hoja', 'Hoja de vida']];
  if (w.tipo === 'laboral') p.push(['vacaciones', 'Vacaciones'], ['dotacion', 'Dotación'], ['primas', 'Primas'], ['cesantias', 'Cesantías e intereses']);
  p.push(['afiliaciones', w.tipo === 'servicio' ? 'Seguridad social y planillas' : 'Afiliaciones'], ['prestamos', 'Préstamos']);
  if (w.tipo === 'laboral' || (w.d.disciplinarios || []).length) p.push(['llamados', 'Llamados y descargos']);
  p.push(['documentos', 'Documentos'], ['soportes', 'Soportes'], ['pendientes', 'Pendientes']);
  return p;
}

function vFicha(w, tab) {
  if (!w) return `<div class="nota">No se encontró el trabajador. Puede que su carpeta se haya movido o renombrado. <a href="#/personal">Volver al personal</a></div>`;
  const pest = pestanasDe(w);
  if (!pest.some(p => p[0] === tab)) tab = 'resumen';
  const cuenta = t => w.alertas.filter(a => a.tab === t).length;
  const vistas = { resumen: tResumen, hoja: tHoja, vacaciones: tVacaciones, dotacion: tDotacion, primas: tPrimas, cesantias: tCesantias, afiliaciones: tAfiliaciones, documentos: tDocumentos, soportes: tSoportes, pendientes: tPendientes, prestamos: tPrestamos, llamados: tLlamados };
  const mover = w.estadoCarpeta === 'Activo' ? 'Mover a Retirados' : w.estadoCarpeta === 'Retirado' ? 'Mover a Activos' : (w.estado === 'Activo' ? 'Registrar retiro' : 'Reactivar');
  const datosCab = [
    ['Documento', w.d.documento ? docId(w) : 'Sin registrar'], ['Contrato No.', numeroContrato(w) || '—'], ['Vinculación', TIPO_NOMBRE[w.tipo]], ['Área', w.area],
    [w.tipo === 'servicio' ? 'Inicio del contrato' : 'Fecha de ingreso', w.d.fechaIngreso ? fechaCorta(w.d.fechaIngreso) : 'Sin registrar'],
    ['Antigüedad', antiguedad(w) || '—'], [w.tipo === 'servicio' ? 'Honorarios' : w.tipo === 'sena' ? 'Apoyo de sostenimiento' : 'Salario', dinero(w.d.salario) || '—'],
  ];
  return `
  <div class="tarjeta ficha"><div class="ficha-banda"></div>
    <div class="ficha-cab"><button class="foto-boton" data-accion="subir" data-wid="${h(w.id)}" data-tipo="foto" title="${w.det.foto ? 'Cambiar la foto' : 'Adjuntar la foto del trabajador'}">${avatar(w, true)}<span>${w.det.foto ? 'Cambiar' : 'Foto'}</span></button>
      <div class="info"><div class="ficha-titulo"><h1>${h(nombreBonito(w.nombre))}</h1>${chip(w.estado === 'Activo' ? 'ok' : 'na', w.estado)}</div>
        <div class="meta"><span>${h(w.d.cargo || 'Sin cargo registrado')}</span>${sustitucionDe(w) ? `<span title="Contrato por sustitución patronal">Sustitución patronal${w.d.sustitucion.empresa ? ' de ' + h(w.d.sustitucion.empresa) : ''}${continuaSustitucion(w) ? ' · prestaciones desde ' + fechaCorta(w.d.sustitucion.fechaIngreso) : ''}</span>` : ''}${w.d.fechaRetiro ? `<span>Retiro: ${fechaCorta(w.d.fechaRetiro)}${w.d.motivoRetiro ? ' · ' + h(w.d.motivoRetiro) : ''}</span>` : ''}</div>
        ${w.otros.length ? `<div class="sutil" style="margin-top:6px">También registrado en: ${w.otros.map(o => `<a href="${linkT(o)}">${h(o.area)} (${h(o.estado)})</a>`).join(', ')}</div>` : ''}
      </div>
      <div class="acciones">
        <button class="btn btn-primario" data-accion="subir" data-wid="${h(w.id)}">Adjuntar soporte</button>
        <button class="btn" data-accion="imprimir" data-wid="${h(w.id)}" title="Hoja de vida, constancia laboral, vacaciones, dotación y liquidación">Imprimir documentos</button>
        <button class="btn" data-accion="exportar-zip" data-wid="${h(w.id)}" title="Guardar la carpeta del trabajador, con todos sus documentos, en un archivo .zip">Exportar ZIP</button>
        <button class="btn" data-accion="mover" data-wid="${h(w.id)}">${mover}</button>
      </div>
    </div>
    <div class="ficha-datos">${datosCab.map(([e, v]) => `<div><span>${h(e)}</span><strong title="${h(v)}">${h(v)}</strong></div>`).join('')}</div>
    <nav class="pestanas">${pest.map(([k, t]) => `<a href="${linkT(w, k)}" class="${k === tab ? 'activo' : ''}">${t}${cuenta(k) ? `<span class="badge">${cuenta(k)}</span>` : ''}</a>`).join('')}</nav>
  </div>
  <div style="margin-top:16px">${vistas[tab](w)}</div>`;
}

function tResumen(w) {
  const c = w.c;
  const ultima = (obj) => Object.keys(obj).sort().pop();
  const datos = [
    ['Fecha de ingreso', w.d.fechaIngreso ? fechaLarga(w.d.fechaIngreso) : 'Sin registrar'],
    ['Antigüedad', antiguedad(w) || '—'],
    ['Salario', dinero(w.d.salario) || '—'],
  ];
  if (continuaSustitucion(w)) datos.splice(1, 0, ['Prestaciones desde (sustitución patronal)', fechaLarga(iso(ingresoDe(w)))]);
  if (c.vacaciones) datos.push(['Vacaciones disponibles', c.vacaciones.modo === 'sinFecha' ? '—' : `${fmtDias(c.vacaciones.disponibles)} días${c.vacaciones.vencidas ? ' · ' + c.vacaciones.vencidas + ' periodo(s) vencido(s)' : ''}`]);
  if (c.primas) { const u = ultima(w.det.primas); datos.push(['Última prima con soporte', u ? (u.endsWith('-1') ? '1.er' : '2.º') + ' semestre ' + u.slice(0, 4) : '—']); }
  if (c.dotacion) { const u = ultima(w.det.dotacion); datos.push(['Última dotación con soporte', u ? CORTES_DOT[+u.slice(-1) - 1].nombre + ' ' + u.slice(0, 4) : '—']); }
  if (w.tipo === 'servicio') { const u = w.det.contratos[w.det.contratos.length - 1]; datos.push(['Último contrato', u ? fechaLarga(u.fecha) : '—']); }
  if (w.tipo === 'laboral') { const r = c.disciplinarios; datos.push(['Llamados y descargos', r.lista.length ? `${r.lista.length} registro(s)${r.abiertos.length ? ` · ${r.abiertos.length} proceso(s) abierto(s)` : ''}` : 'Ninguno']); }
  if (w.d.fechaRetiro) datos.push(['Fecha de retiro', fechaLarga(w.d.fechaRetiro)]);
  return `<div class="rejilla rejilla-resumen">
    <div class="tarjeta"><div class="tarjeta-titulo"><h2>Pendientes de este expediente</h2><span class="sutil">${w.alertas.length} en total</span></div>
      ${w.alertas.length ? `<ul class="lista-alertas">${w.alertas.map(a => `<li><span class="punto n-${a.nivel}"></span><div style="flex:1">${h(a.texto)}</div><a href="${linkT(w, a.tab)}" class="sutil">Ver</a></li>`).join('')}</ul>` : '<div class="vacio">Este expediente está al día.</div>'}
    </div>
    <div class="tarjeta"><div class="tarjeta-titulo"><h2>Datos clave</h2><a href="${linkT(w, 'hoja')}" class="sutil">Editar</a></div>
      <div class="tarjeta-cuerpo rejilla rejilla-2">${datos.map(([e, v]) => `<div class="dato"><span>${h(e)}</span><strong>${h(v)}</strong></div>`).join('')}</div>
      ${w.d.observaciones ? `<div class="tarjeta-cuerpo" style="border-top:1px solid var(--borde)"><div class="sutil">Observaciones</div>${h(w.d.observaciones)}</div>` : ''}
    </div></div>`;
}

/* Documento que respalda un dato de la hoja de vida: «Ver» si ya está, «Adjuntar» si falta. */
function adjuntosHoja(w, claves) {
  const docs = w.c.documentos, extra = { hv: { k: 'hv', nombre: 'Hoja de vida', re: /hoja de vida/, subir: 'hv' }, foto: null };

    const d = docs.find(x => x.k === k) || (extra[k] && { ...extra[k], archivos: w.archivos.filter(a => extra[k].re.test(sinTildes(a.nombre))) });
    if (!d) return '';
    const a = d.archivos && d.archivos[0];
    return `<span class="adjunto ${a ? 'si' : ''}">${a ? '✓' : '○'} ${h(d.nombre)}${a ? ` <button class="enlace" data-accion="ver-archivo" data-ruta="${h(a.ruta)}">Ver</button>` : ` <button class="btn btn-chico" data-accion="subir" data-wid="${h(w.id)}" data-tipo="${d.subir}">Adjuntar</button>`}</span>`;
  }).join('')}</div>`;
}

    ${sec('Contacto', [

      campo(w, 'correo', 'Correo electrónico', 'email'), campo(w, 'emergencia.nombre', 'Contacto de emergencia'), campo(w, 'emergencia.parentesco', 'Parentesco'), campo(w, 'emergencia.telefono', 'Teléfono de emergencia', 'tel'),

      campo(w, 'fechaFinContrato', 'Fin del contrato (si es a término fijo)', 'date'),
      campo(w, 'salario', w.tipo === 'servicio' ? 'Valor mensual de honorarios' : w.tipo === 'sena' ? 'Apoyo de sostenimiento' : 'Salario básico mensual', 'number', null, 'min="0" step="1000"'),
      campo(w, 'jornada', 'Jornada / horario'), campo(w, 'lugarTrabajo', 'Lugar de trabajo (finca, lote, oficina)'),
      campo(w, 'estado', 'Estado', 'select', [['', `Automático (${w.estadoCarpeta || 'según soportes'})`], 'Activo', 'Retirado']),
      campo(w, 'fechaRetiro', 'Fecha de retiro', 'date'), campo(w, 'motivoRetiro', 'Motivo del retiro', 'select', ['', 'Renuncia voluntaria', 'Terminación con justa causa', 'Terminación sin justa causa', 'Vencimiento del término', 'Terminación de la obra o labor', 'Mutuo acuerdo', 'Fin del contrato de aprendizaje', 'Fin del contrato de servicios', 'Otro']),
    ].join(''), adjuntosHoja(w, ['contrato', 'examen', 'sena', 'renuncia', 'liq']))}
    ${w.tipo === 'laboral' ? sec('Sustitución patronal', [
      campo(w, 'sustitucion.activa', '¿Viene de otra empresa por sustitución patronal?', 'select', [['', 'No'], ['si', 'Sí']]),
      ...(sustitucionDe(w) ? [
        campo(w, 'sustitucion.empresa', 'Empresa anterior'), campo(w, 'sustitucion.nit', 'NIT de la empresa anterior'),
        campo(w, 'sustitucion.fechaIngreso', 'Fecha de ingreso a la empresa anterior', 'date'),
        campo(w, 'sustitucion.continuidad', 'Las prestaciones se cuentan desde', 'select', [['anterior', 'El ingreso a la empresa anterior (continúa el contrato)'], ['actual', 'El ingreso a esta empresa']]),
        `<p class="sutil ancho" style="margin:0">Con continuidad, las cesantías, los intereses, las primas, la dotación, las vacaciones, la antigüedad y la indemnización se calculan desde el ingreso a la empresa anterior (arts. 67 a 70 CST). La fecha de ingreso de arriba sigue siendo la de esta empresa.${continuaSustitucion(w) ? ` Hoy se cuentan desde el <strong>${fechaLarga(iso(ingresoDe(w)))}</strong>.` : ''}</p>`,

    ${sec('Formación, experiencia y familia', [campo(w, 'estudios', 'Estudios realizados', 'textarea'), campo(w, 'experiencia', 'Experiencia laboral', 'textarea'), campo(w, 'beneficiarios', 'Núcleo familiar y beneficiarios', 'textarea')].join(''))}
