function notaEstimado(w, r, que) {
  if (!r) return '';
  if (r.sinFecha || r.modo === 'sinFecha') return `<div class="nota">Registre la <a href="${linkT(w, 'hoja')}">fecha de ingreso</a> para calcular ${que}. Mientras tanto solo se muestran los soportes encontrados.</div>`;
  if (r.estimado) return `<div class="nota info">Falta la fecha de ingreso: el control de ${que} se estima desde el primer soporte encontrado${r.modo === 'calendario' ? ', por año calendario' : ''}. Registre la fecha en la hoja de vida para un cálculo exacto.</div>`;
  return notaSustitucion(w);
}
function notaSustitucion(w) {
  const s = sustitucionDe(w); if (!s) return '';
  const emp = h(s.empresa || 'la empresa anterior');
  if (continuaSustitucion(w)) return `<div class="nota info">Contrato por <strong>sustitución patronal</strong>: viene de ${emp}, donde ingresó el ${fechaLarga(s.fechaIngreso)}. Las prestaciones y las vacaciones se cuentan desde esa fecha (continuidad del contrato). <a href="${linkT(w, 'hoja')}">Cambiar</a></div>`;
  return `<div class="nota info">Contrato por <strong>sustitución patronal</strong>: viene de ${emp}${s.continuidad !== 'actual' ? ', pero falta la fecha de ingreso a esa empresa' : ''}. Las prestaciones y las vacaciones se cuentan desde el ingreso a esta empresa${w.d.fechaIngreso ? ' (' + fechaLarga(w.d.fechaIngreso) + ')' : ''}. <a href="${linkT(w, 'hoja')}">Cambiar</a></div>`;
}

function botonCelda(w, tipo, cel, sub) {
  if (!cel) return '<span class="sutil">—</span>';
  const est = sub ? cel[sub === 'intereses' ? 'int' : 'cons'] : cel.estado;
  const vence = sub ? (sub === 'intereses' ? cel.venceInt : cel.venceCons) : cel.vence;
  const titulo = (vence ? 'Vence ' + fechaCorta(vence) : '') + (est === 'ok' ? ' · con soporte' : '');
  return `<button class="chip e-${est} celda" data-accion="celda" data-wid="${h(w.id)}" data-tipo="${tipo}" data-key="${h(cel.key)}" ${sub ? `data-sub="${sub}"` : ''} title="${h(titulo)}"><span class="punto"></span>${h(ETQ[est] || est)}</button>`;
}

const fmtDias = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('es-CO', { maximumFractionDigits: 2 });

/* Fechas de un registro de vacaciones: del primer al último día, días hábiles y día de regreso. */
function finRegistro(r) { return r.hasta ? fecha(r.hasta) : r.desde ? finVacaciones(fecha(r.desde), Math.ceil(Number(r.dias) || 1)) : null; }
function estadoRegistro(r) {
  if (r.tipo !== 'Disfrutadas' || !r.desde) return '';
  const H = hoy(), fin = finRegistro(r);
  if (fecha(r.desde) > H) return chip('prox', 'Programadas');
  if (fin >= H) return chip('reg', 'En vacaciones');
  return '';
}
function fechasRegistro(w, r) {
  if (r.tipo === 'Compensadas en dinero') return `Compensadas en dinero${r.valor ? ` · <strong>${dinero(r.valor)}</strong>` : ''} · ${fmtDias(diasReg(w, r))} días${r.desde ? ' · pagadas el ' + fechaCorta(r.desde) : ' · <span class="n-media">sin fecha de pago</span>'}`;
  if (r.tipo === 'No aplica') return 'Periodo marcado como no aplica';
  if (!r.desde) return `<strong>${fmtDias(r.dias)} días hábiles</strong> · <span class="n-media">sin fechas registradas</span>`;
  const fin = finRegistro(r);
  return `<strong>${fechaCorta(r.desde)} → ${fechaCorta(fin)}</strong> · ${fmtDias(r.dias)} días hábiles · regreso ${fechaCorta(diaRegreso(fin))}`;
}
function detallePeriodo(w, p) {
  const id = h(w.id);
  const regs = (p.regs || []).slice().sort((a, b) => String(a.desde || '').localeCompare(String(b.desde || ''))).map(r => {
    const sop = r.soporte && w.archivos.find(a => a.ruta === r.soporte);
    return `<div class="fechas-vac">${fechasRegistro(w, r)} ${estadoRegistro(r)}${sop ? ` · <button class="enlace" data-accion="ver-archivo" data-ruta="${h(sop.ruta)}">soporte</button>` : ''}${r.nota ? ` <span class="sutil">(${h(r.nota)})</span>` : ''}
      <button class="enlace sutil" data-accion="editar-vac" data-wid="${id}" data-id="${h(r.id)}">editar</button>${r.tipo !== 'No aplica' ? ` · <button class="enlace sutil" data-accion="vac-imprimir" data-wid="${id}" data-id="${h(r.id)}">imprimir</button>` : ''}</div>`;
  }).join('');
  const conf = p.porConfirmar ? `<div class="fechas-vac"><span class="n-media">Fechas sin registrar</span> · soporte: ${p.archivos.map(a => `<button class="enlace" data-accion="ver-archivo" data-ruta="${h(a.ruta)}">${h(a.nombre.replace(/\.[^.]+$/, ''))}</button>`).join(', ')} <span class="sutil">(se cuentan 15 días)</span>
      <button class="btn btn-chico" data-accion="detallar-vac" data-wid="${id}" data-periodo="${p.k}" data-soporte="${h(p.archivos[0].ruta)}">Registrar fechas</button></div>` : '';
  return regs + conf || '<span class="sutil">Aún no ha tomado vacaciones de este periodo</span>';
}

function fechasVacTrabajador(w) {
  const H = hoy();
  const regs = (w.d.vacaciones || []).filter(r => r.tipo === 'Disfrutadas' && r.desde).sort((a, b) => b.desde.localeCompare(a.desde));
  return {
    actual: regs.find(r => fecha(r.desde) <= H && finRegistro(r) >= H),
    prox: regs.filter(r => fecha(r.desde) > H).pop(),
    ult: regs.find(r => finRegistro(r) < H),
  };
}

function historialVacaciones(w) {
  const v = w.c.vacaciones, id = h(w.id);
  const regs = (w.d.vacaciones || []).filter(r => r.tipo !== 'No aplica').slice().sort((a, b) => String(b.desde || '').localeCompare(String(a.desde || '')));
  const sinFechas = v.periodos.filter(p => p.porConfirmar);
  if (!regs.length && !sinFechas.length) return '';
  const nombrePer = r => { const p = v.periodos.find(x => String(x.k) === String(v.modo === 'periodos' ? r.periodo : r.anio)); return p ? `<strong>${nombrePeriodo(p)}</strong><div class="sutil">${rangoPeriodo(p)}</div>` : 'Periodo ' + (r.periodo || r.anio); };
  return `<div class="tarjeta tabla-env" style="margin-top:14px"><div class="tarjeta-titulo"><h2>Historial de vacaciones tomadas</h2><span class="sutil">De la más reciente a la más antigua</span></div>
    <table><thead><tr><th>Salida</th><th>Último día</th><th>Regreso</th><th class="centro">Días hábiles</th><th>Tipo</th><th>Periodo</th><th></th></tr></thead><tbody>
    ${regs.map(r => { const fin = finRegistro(r); return `<tr><td class="num">${r.desde ? fechaCorta(r.desde) + (r.tipo === 'Compensadas en dinero' ? '<div class="sutil">pago</div>' : '') : '<span class="n-media">Sin fecha</span>'}</td><td class="num">${fin && r.tipo === 'Disfrutadas' ? fechaCorta(fin) : '—'}</td><td class="num">${fin && r.tipo === 'Disfrutadas' ? fechaCorta(diaRegreso(fin)) : '—'}</td>
      <td class="centro num">${fmtDias(diasReg(w, r))}</td><td>${h(r.tipo)}${r.valor ? ` <span class="sutil">· ${dinero(r.valor)}</span>` : ''} ${estadoRegistro(r)}</td><td>${nombrePer(r)}</td><td style="white-space:nowrap"><button class="enlace sutil" data-accion="editar-vac" data-wid="${id}" data-id="${h(r.id)}">editar</button> · <button class="enlace sutil" data-accion="vac-imprimir" data-wid="${id}" data-id="${h(r.id)}" title="${r.tipo === 'Compensadas en dinero' ? 'Imprimir el acuerdo de compensación' : 'Imprimir la comunicación de vacaciones'}">imprimir</button></td></tr>`; }).join('')}
    ${sinFechas.map(p => `<tr><td colspan="3"><span class="n-media">Fechas sin registrar</span> <span class="sutil">· soporte ${h(p.archivos.map(a => a.nombre.replace(/\.[^.]+$/, '')).join(', '))}</span></td><td class="centro num">15</td><td>Disfrutadas (por confirmar)</td><td><strong>${nombrePeriodo(p)}</strong><div class="sutil">${rangoPeriodo(p)}</div></td>
      <td style="white-space:nowrap"><button class="btn btn-chico" data-accion="detallar-vac" data-wid="${id}" data-periodo="${p.k}" data-soporte="${h(p.archivos[0].ruta)}">Registrar fechas</button> <button class="enlace sutil" data-accion="vac-imprimir" data-wid="${id}" data-id="p:${p.k}" title="Imprimir la comunicación de vacaciones con espacios para las fechas">imprimir</button></td></tr>`).join('')}
    </tbody></table></div>`;
}

function tVacaciones(w) {
  const v = w.c.vacaciones, id = h(w.id);
  const sop = Object.keys(w.det.vacaciones).sort().flatMap(y => w.det.vacaciones[y]);
  const nov = w.d.novedades || [];
  const kpis = v.modo === 'sinFecha' ? '' : `<div class="rejilla rejilla-4" style="margin-bottom:14px">
      <div class="tarjeta kpi"><div class="etq">Días causados</div><div class="valor num">${fmtDias(v.causadosTot)}</div><div class="det">${v.modo === 'periodos' ? `${fmtDias(v.proporcional)} del periodo en curso (${v.laboradosActual} días laborados)` : 'Estimado por año calendario'}</div></div>
      <div class="tarjeta kpi"><div class="etq">Días disfrutados</div><div class="valor num">${fmtDias(v.disfrutadosTot)}</div><div class="det">${v.compensadosTot ? fmtDias(v.compensadosTot) + ' días compensados en dinero' : 'Sin compensaciones en dinero'}</div></div>
      <div class="tarjeta kpi ${v.vencidas ? 'alerta' : ''}"><div class="etq">Días disponibles</div><div class="valor num">${fmtDias(v.disponibles)}</div><div class="det">${v.disponibles < 0 ? 'Vacaciones anticipadas' : v.valorEstimado ? 'Equivalen a ' + dinero(v.valorEstimado) + ' (salario básico ÷ 30)' : 'Registre el salario para ver su valor'}</div></div>
      <div class="tarjeta kpi ${v.vencidas ? 'alerta' : ''}"><div class="etq">Periodos cumplidos con saldo</div><div class="valor num">${v.pendientes}</div><div class="det">${v.vencidas ? v.vencidas + ' vencido(s): deben otorgarse ya' : 'Ninguno vencido'}</div></div></div>`;
  const visibles = v.periodos.slice().reverse();
  const etqEstado = p => p.estado === 'pend' && p.vencida ? 'Vencido' : p.estado === 'ok' ? (p.porConfirmar ? 'Disfrutado (por confirmar)' : 'Disfrutado') : p.estado === 'parcial' ? (p.vencida ? 'Parcial · vencido' : 'Parcial') : null;
  const filas = visibles.map(p => `<tr>
      <td class="num"><strong>${nombrePeriodo(p)}</strong><div class="sutil">${rangoPeriodo(p)}</div><div class="sutil">${v.modo === 'periodos' ? `${p.k}.º año de servicio${p.causado ? '' : ' · en curso'}` : 'año calendario (estimado)'}</div>${p.noLaborados ? `<div class="sutil">${p.noLaborados} días no laborados</div>` : ''}</td>
      <td class="centro num">${p.laborados}</td><td class="centro num">${fmtDias(p.causados)}</td><td class="centro num">${fmtDias(p.disfrutados)}</td><td class="centro num">${fmtDias(p.compensados)}</td>
      <td class="centro num"><strong>${fmtDias(p.saldo)}</strong></td>
      <td>${chip(p.estado === 'pend' && p.vencida ? 'pend' : p.estado, etqEstado(p))}</td>
      <td style="white-space:normal;min-width:320px">${detallePeriodo(w, p)}</td>
      <td class="acciones"><button class="btn btn-chico" data-accion="registrar-vac" data-wid="${id}" data-periodo="${p.k}">Registrar</button>
        <button class="btn btn-chico" data-accion="subir" data-wid="${id}" data-tipo="vacaciones" data-anio="${p.anioSoporte || +String(p.causado ? p.fin : p.ini).slice(0, 4)}">Adjuntar</button></td></tr>`).join('');
  return `${notaEstimado(w, v, 'los periodos de vacaciones')}
    <div class="nota info">Cálculo: <strong>15 días hábiles por cada 360 días laborados</strong> (meses comerciales de 30 días). Cada periodo va de aniversario a aniversario de la fecha de ingreso; el periodo en curso causa días en proporción (días laborados × 15 ÷ 360). Las licencias no remuneradas y suspensiones no cuentan como días laborados.</div>
    ${kpis}
    <div class="tarjeta tabla-env"><div class="tarjeta-titulo"><h2>Vacaciones por periodo</h2><div class="acciones"><button class="btn btn-chico" data-accion="imp-estvac" data-wid="${id}" title="Resumen, cada periodo, vacaciones tomadas y novedades, listo para firmar o guardar como PDF" ${v.modo === 'sinFecha' ? 'disabled' : ''}>Imprimir estado</button><button class="btn btn-primario btn-chico" data-accion="registrar-vac" data-wid="${id}" data-periodo="${(visibles.find(p => p.saldo > 0) || visibles[0] || {}).k || ''}">+ Registrar vacaciones</button></div></div>
    ${visibles.length ? `<table class="periodos"><thead><tr><th>Periodo</th><th class="centro">Días laborados</th><th class="centro">Causados</th><th class="centro">Disfrutados</th><th class="centro">Compensados</th><th class="centro">Disponibles</th><th>Estado</th><th>Fechas en que se tomaron</th><th></th></tr></thead><tbody>${filas}</tbody></table>` : '<div class="vacio">Sin periodos para mostrar.</div>'}</div>
    ${historialVacaciones(w)}
    <div style="margin-top:14px">
      <div class="tarjeta"><div class="tarjeta-titulo"><h2>Licencias no remuneradas y suspensiones</h2><span class="sutil">Corren el final del periodo</span></div>
        <form class="tarea" data-form="novedad" data-wid="${id}" style="flex-wrap:wrap">
          <select name="tipo" style="width:auto"><option>Licencia no remunerada</option><option>Suspensión disciplinaria</option><option>Ausencia injustificada</option></select>
          <input name="desde" type="date" required style="width:150px" title="Desde"><input name="hasta" type="date" required style="width:150px" title="Hasta"><button class="btn">Agregar</button></form>
        ${nov.length ? nov.map(n => `<div class="tarea"><span>${h(n.tipo)} · ${fechaCorta(n.desde)} a ${fechaCorta(n.hasta)} <span class="sutil">(${Math.round((fecha(n.hasta) - fecha(n.desde)) / 86400000) + 1} días)</span></span><button class="enlace sutil" data-accion="novedad-borrar" data-wid="${id}" data-id="${h(n.id)}">quitar</button></div>`).join('') : '<div class="vacio">Sin novedades registradas.</div>'}
      </div>
    </div>
    <div class="tarjeta" style="margin-top:14px"><div class="tarjeta-titulo"><h2>Soportes de vacaciones en la carpeta</h2><button class="btn btn-chico" data-accion="subir" data-wid="${id}" data-tipo="vacaciones">Adjuntar</button></div><div class="tarjeta-cuerpo">${listaArchivos(sop, 'Sin soportes de vacaciones en la carpeta.')}</div></div>`;
}

function tablaPorAnio(w, tipo, r, columnas, colTitulo) {
  const anios = [...new Set(r.celdas.map(c => c.anio))].sort((a, b) => b - a);
  return `<table><thead><tr><th>Año</th>${columnas.map(c => `<th>${h(c.t)}</th>`).join('')}</tr></thead><tbody>
    ${anios.map(y => `<tr><td><strong>${y}</strong></td>${columnas.map(c => { const cel = r.celdas.find(x => x.anio === y && x.s === c.s); return `<td>${botonCelda(w, tipo, cel)}${cel && cel.archivos.length ? `<div class="sutil">${cel.archivos.map(a => h(a.nombre.replace(/\.[^.]+$/, ''))).join('<br>')}</div>` : cel ? `<div class="sutil">${colTitulo(cel)}</div>` : ''}</td>`; }).join('')}</tr>`).join('')}
  </tbody></table>`;
}

function tDotacion(w) {
  const r = w.c.dotacion;
  const t = w.d.tallas || {};
  const todas = w.archivos.filter(a => a.cat === 'dotacion');
  return `${notaEstimado(w, r, 'las entregas de dotación')}
  <div class="nota info">Por ley se entrega dotación el 30 de abril, el 31 de agosto y el 20 de diciembre a quienes devengan hasta 2 salarios mínimos y llevan más de 3 meses. ${w.d.salario ? '' : 'Registre el salario para validar si aplica.'}</div>
  <div class="tarjeta tabla-env"><div class="tarjeta-titulo"><h2>Entregas de dotación</h2><div class="acciones"><span class="sutil">Tallas: camisa ${h(t.camisa || '—')} · pantalón ${h(t.pantalon || '—')} · calzado ${h(t.calzado || '—')}</span><button class="btn btn-chico" data-accion="imp-dotacion" data-wid="${h(w.id)}">Imprimir acta de entrega</button></div></div>
    ${r.celdas.length ? tablaPorAnio(w, 'dotacion', r, CORTES_DOT.map(c => ({ s: c.s, t: c.nombre })), cel => 'Vence ' + fechaCorta(cel.vence)) : '<div class="vacio">Sin entregas para mostrar.</div>'}</div>
  <div class="tarjeta" style="margin-top:14px"><div class="tarjeta-titulo"><h2>Soportes de dotación</h2><button class="btn btn-chico" data-accion="subir" data-wid="${h(w.id)}" data-tipo="dotacion">Adjuntar</button></div><div class="tarjeta-cuerpo">${listaArchivos(todas, 'Sin soportes de dotación.')}</div></div>`;
}

function tPrimas(w) {
  const r = w.c.primas;
  const todas = w.archivos.filter(a => a.cat === 'primas');
  return `${notaEstimado(w, r, 'las primas')}
  <div class="tarjeta tabla-env"><div class="tarjeta-titulo"><h2>Prima de servicios</h2><span class="sutil">Primer semestre: hasta el 30 de junio · Segundo semestre: hasta el 20 de diciembre</span></div>
    ${r.celdas.length ? tablaPorAnio(w, 'primas', r, [{ s: 1, t: 'Primer semestre' }, { s: 2, t: 'Segundo semestre' }], cel => cel.man && cel.man.valor ? dinero(cel.man.valor) : 'Vence ' + fechaCorta(cel.vence)) : '<div class="vacio">Sin semestres para mostrar.</div>'}</div>
  <div class="tarjeta" style="margin-top:14px"><div class="tarjeta-titulo"><h2>Soportes de primas</h2><button class="btn btn-chico" data-accion="subir" data-wid="${h(w.id)}" data-tipo="prima">Adjuntar</button></div><div class="tarjeta-cuerpo">${listaArchivos(todas, 'Sin soportes de primas.')}</div></div>`;
}

function tCesantias(w) {
  const r = w.c.cesantias;
  const fondo = (w.d.afiliaciones && w.d.afiliaciones.ces && w.d.afiliaciones.ces.entidad) || 'sin registrar';
  const retiros = w.archivos.filter(a => a.cat === 'retiroCes');
  const todas = w.archivos.filter(a => a.cat === 'intereses');
  return `${notaEstimado(w, r, 'las cesantías')}
  <div class="tarjeta tabla-env"><div class="tarjeta-titulo"><h2>Cesantías e intereses</h2><span class="sutil">Fondo de cesantías: ${h(fondo)}</span></div>
    ${r.filas.length ? `<table><thead><tr><th>Año</th><th>Intereses (pago al trabajador, 31 ene)</th><th>Consignación al fondo (14 feb)</th><th>Soportes</th></tr></thead><tbody>
      ${r.filas.slice().reverse().map(f => `<tr><td><strong>${f.anio}</strong></td><td>${botonCelda(w, 'cesantias', f, 'intereses')}${f.man.valor_intereses ? `<div class="sutil">${dinero(f.man.valor_intereses)}</div>` : ''}</td><td>${botonCelda(w, 'cesantias', f, 'consignacion')}${f.man.valor_consignacion ? `<div class="sutil">${dinero(f.man.valor_consignacion)}</div>` : ''}</td><td>${enlacesArchivos([...new Set([...f.archInt, ...f.archCons])])}</td></tr>`).join('')}
    </tbody></table>` : '<div class="vacio">Sin años para mostrar.</div>'}</div>
  <div class="rejilla rejilla-2" style="margin-top:14px">
    <div class="tarjeta"><div class="tarjeta-titulo"><h2>Soportes de cesantías e intereses</h2><button class="btn btn-chico" data-accion="subir" data-wid="${h(w.id)}" data-tipo="intereses">Adjuntar</button></div><div class="tarjeta-cuerpo">${listaArchivos(todas, 'Sin soportes.')}</div></div>
    <div class="tarjeta"><div class="tarjeta-titulo"><h2>Retiros de cesantías</h2><button class="btn btn-chico" data-accion="subir" data-wid="${h(w.id)}" data-tipo="retiroCes">Adjuntar</button></div><div class="tarjeta-cuerpo">${listaArchivos(retiros, 'Sin retiros de cesantías registrados.')}</div></div>
  </div>`;
}

function tAfiliaciones(w) {
  const filas = w.c.afiliaciones.filter(a => a.requerido || a.archivos.length || a.reg.entidad);
  const gen = w.det.afil.general;
  const pl = w.c.planillas;
  return `<div class="tarjeta tabla-env"><div class="tarjeta-titulo"><h2>Afiliaciones a seguridad social</h2><span class="sutil">Escriba la entidad y la fecha; el soporte se detecta en la carpeta de seguridad social</span></div>
    <table><thead><tr><th>Sistema</th><th style="min-width:180px">Entidad</th><th>Fecha de afiliación</th><th>Estado</th><th>Soportes</th><th></th></tr></thead><tbody>
    ${filas.map(a => `<tr><td><strong>${h(a.nombre)}</strong>${a.requerido ? '' : '<div class="sutil">Opcional</div>'}</td>
      <td><input data-campo="afiliaciones.${a.k}.entidad" data-wid="${h(w.id)}" value="${h(a.reg.entidad || '')}" placeholder="Nombre de la entidad">${a.k === 'arl' && w.tipo !== 'sena' ? `<select style="margin-top:4px" data-campo="afiliaciones.arl.riesgo" data-wid="${h(w.id)}">${['', 'I', 'II', 'III', 'IV', 'V'].map(x => `<option ${a.reg.riesgo === x ? 'selected' : ''} value="${x}">${x ? 'Riesgo ' + x : 'Clase de riesgo'}</option>`).join('')}</select>` : ''}</td>
      <td><input type="date" data-campo="afiliaciones.${a.k}.fecha" data-wid="${h(w.id)}" value="${h(a.reg.fecha || '')}"></td>
      <td>${chip(a.estado)}</td><td>${enlacesArchivos(a.archivos)}</td>
      <td class="acciones"><button class="btn btn-chico" data-accion="subir" data-wid="${h(w.id)}" data-tipo="afiliacion" data-sistema="${a.k}">Adjuntar</button>
      <select class="btn-chico" style="width:auto" data-campo="afiliaciones.${a.k}.estado" data-wid="${h(w.id)}"><option value="">Aplica</option><option value="na" ${a.reg.estado === 'na' ? 'selected' : ''}>No aplica</option></select></td></tr>`).join('')}
    </tbody></table></div>
    <div class="tarjeta" style="margin-top:14px"><div class="tarjeta-titulo"><h2>RUAF, históricos y planillas</h2><button class="btn btn-chico" data-accion="subir" data-wid="${h(w.id)}" data-tipo="ruaf">Adjuntar</button></div><div class="tarjeta-cuerpo">${listaArchivos(gen, 'Sin soportes generales de seguridad social.')}</div></div>
    ${pl ? `<div class="tarjeta tabla-env" style="margin-top:14px"><div class="tarjeta-titulo"><h2>Planillas mensuales del contratista</h2><span class="sutil">El contratista debe acreditar el pago de su seguridad social cada mes</span></div>
      ${pl.sinFecha ? '<div class="vacio">Registre la fecha de inicio del contrato en la hoja de vida.</div>' : `<table><thead><tr><th>Mes</th><th>Estado</th><th>Soporte</th><th></th></tr></thead><tbody>${pl.meses.slice().reverse().map(m => `<tr><td>${h(m.titulo)}</td><td>${botonCelda(w, 'planillas', m)}</td><td>${enlacesArchivos(m.archivos)}</td><td><button class="btn btn-chico" data-accion="subir" data-wid="${h(w.id)}" data-tipo="planilla" data-anio="${m.key.slice(0, 4)}" data-mes="${+m.key.slice(5)}">Adjuntar</button></td></tr>`).join('')}</tbody></table>`}</div>` : ''}`;
}

function tDocumentos(w) {
  const docs = w.c.documentos;
  const contratos = w.tipo === 'servicio' ? w.det.contratos : [];
  return `<div class="tarjeta tabla-env"><div class="tarjeta-titulo"><h2>Documentos del expediente</h2><span class="sutil">${docs.filter(d => d.estado === 'pend').length} requerido(s) faltante(s)</span></div>
    <table><thead><tr><th>Documento</th><th>Tipo</th><th>Estado</th><th>Soportes encontrados</th><th></th></tr></thead><tbody>
    ${docs.map(d => `<tr><td><strong>${h(d.nombre)}</strong></td><td>${d.req ? 'Requerido' : '<span class="sutil">Recomendado</span>'}</td><td>${chip(d.estado, d.estado === 'reg' ? 'Entregado (físico)' : null)}</td><td>${enlacesArchivos(d.archivos)}</td>
      <td class="acciones"><button class="btn btn-chico" data-accion="subir" data-wid="${h(w.id)}" data-tipo="${d.subir}">Adjuntar</button>
      <select style="width:auto" class="btn-chico" data-campo="docs.${d.k}.estado" data-wid="${h(w.id)}"><option value="">Según carpeta</option><option value="ok" ${d.man.estado === 'ok' ? 'selected' : ''}>Entregado en físico</option><option value="na" ${d.man.estado === 'na' ? 'selected' : ''}>No aplica</option></select></td></tr>`).join('')}
    </tbody></table></div>
    ${contratos.length ? `<div class="tarjeta tabla-env" style="margin-top:14px"><div class="tarjeta-titulo"><h2>Contratos de prestación de servicios</h2></div><table><thead><tr><th>Contrato</th><th>Firmado</th><th>Archivos</th></tr></thead><tbody>
      ${contratos.slice().reverse().map(c => `<tr><td><strong>Contrato del ${fechaLarga(c.fecha)}</strong></td><td>${chip(c.firmado ? 'ok' : 'pend', c.firmado ? 'Firmado' : 'Falta copia firmada')}</td><td>${enlacesArchivos(c.archivos)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${w.det.revisar.length ? `<div class="tarjeta" style="margin-top:14px"><div class="tarjeta-titulo"><h2>Archivos marcados para revisar</h2><span class="sutil">El nombre del archivo indica una inconsistencia</span></div><div class="tarjeta-cuerpo">${listaArchivos(w.det.revisar)}</div></div>` : ''}`;
}

const TIPO_POR_CAT = { vacaciones: 'vacaciones', dotacion: 'dotacion', primas: 'prima', intereses: 'intereses', incapacidades: 'incapacidad', llamados: 'llamado', seguridad: 'afiliacion', arl: 'afiliacion', liquidacion: 'liquidacion', retiroCes: 'retiroCes', contrato: 'contrato', prestamos: 'prestamo', colillas: 'colilla', personales: 'otro' };

function carpetasDe(w) {
  const plant = Object.values(PLANTILLAS[w.tipo] || {});
  const existentes = new Set(w.carpetas);
  return [...new Set([...w.carpetas, ...plant.filter(p => !w.carpetas.some(c => catDe(c) === catDe(p)))])].sort()
    .map(c => ({ nombre: c, existe: existentes.has(c), n: w.archivos.filter(a => a.carpeta === c).length }));
}

function tSoportes(w) {
  const sel = S.carpetaSel[w.id] ?? '';
  const carpetas = carpetasDe(w);
  const archivos = w.archivos.filter(a => !sel || a.carpeta === sel).sort((a, b) => (a.carpeta + a.sub.join('/') + a.nombre).localeCompare(b.carpeta + b.sub.join('/') + b.nombre, 'es'));
  const sueltos = w.archivos.filter(a => !a.carpeta);
  return `<div class="tarjeta soportes">
    <div class="carpetas">
      <button class="${!sel ? 'activo' : ''}" data-accion="carpeta-sel" data-wid="${h(w.id)}" data-carpeta=""><span>Todos los soportes</span><span class="sutil">${w.archivos.length}</span></button>
      <div class="subtitulo">Carpetas</div>
      ${carpetas.map(c => `<button class="${sel === c.nombre ? 'activo' : ''}" data-accion="carpeta-sel" data-wid="${h(w.id)}" data-carpeta="${h(c.nombre)}" ${c.existe ? '' : 'style="opacity:.6" title="Se creará al adjuntar el primer soporte"'}><span>${h(sinNumero(c.nombre))}</span><span class="sutil">${c.n || ''}</span></button>`).join('')}
    </div>
    <div>
      <div class="tarjeta-titulo"><h2>${h(sel ? sinNumero(sel) : 'Todos los soportes')}</h2>
        <div class="acciones">
        <button class="btn btn-chico btn-primario" data-accion="subir" data-wid="${h(w.id)}" ${sel ? `data-tipo="${TIPO_POR_CAT[catDe(sel)] || 'otro'}" data-categoria="${h(sel)}"` : ''}>Adjuntar aquí</button></div></div>
      <div class="tarjeta-cuerpo">
        <div class="zona-soltar" data-accion="subir" data-wid="${h(w.id)}" ${sel ? `data-tipo="${TIPO_POR_CAT[catDe(sel)] || 'otro'}" data-categoria="${h(sel)}"` : ''} data-soltar="1">Arrastre aquí los archivos o haga clic para adjuntar un soporte</div>
        <div style="margin-top:12px">${archivos.length ? `<div class="archivos">${archivos.map(a => filaArchivo(a, !sel)).join('')}</div>` : '<div class="vacio">Esta carpeta está vacía.</div>'}</div>
        ${!sel && sueltos.length ? `<div class="sutil" style="margin-top:10px">${sueltos.length} archivo(s) están sueltos en la carpeta principal del trabajador.</div>` : ''}
      </div>
    </div></div>
    ${papeleraDe(w).length ? `<div style="margin-top:16px">${tarjetaPapelera(w)}</div>` : ''}`;
}

function tPrestamos(w) {
  const r = w.c.prestamos, id = h(w.id);

    </div>

      : '<div class="vacio">No tiene préstamos ni descuentos registrados.</div>'}</div>
    <p class="sutil">Fechas de descuento: las cuotas quincenales se descuentan el 15 y el último día de cada mes; las mensuales, el último día del mes. Registre cada descuento cuando se haga en la nómina para llevar el saldo.</p>`;

/* --- Ventanas de préstamos y descuentos --- */

      <label class="campo">Cuotas<select id="pModalidad"><option value="Fija" ${p && p.modalidad === 'Variable' ? '' : 'selected'}>Fijas (el mismo valor cada vez)</option><option value="Variable" ${p && p.modalidad === 'Variable' ? 'selected' : ''}>Variables (cambian cada vez)</option></select></label>

function previaPrestamo() {

function guardarPrestamo() {

  d.prestamos = d.prestamos || [];
  const p = m.idP ? prestamoDe(w, m.idP) : { id: nuevoId(), pagos: [] };
  Object.assign(p, datos);
  Object.keys(p).forEach(k => { if (p[k] === '' || p[k] === null) delete p[k]; });
  if (!m.idP) d.prestamos.push(p);
  recalcular(w); guardar(`${m.idP ? 'Editar' : 'Nuevo'} ${datos.tipo.toLowerCase()} de ${nombreBonito(w.nombre)}: ${datos.concepto}`); cerrarModal(); rerender();

/* --- Llamados de atención y descargos del trabajador --- */
const recortar = (s, n = 140) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const horaDoc = s => { if (!s) return ''; const [H, M] = s.split(':').map(Number); return `${H % 12 || 12}:${pad(M || 0)} ${H < 12 ? 'a. m.' : 'p. m.'}`; };

}

  return `<div class="pasos-disc">${p.map(([t, ok], i) => `<span class="${ok ? 'hecho' : i === actual ? 'actual' : ''}">${ok ? '✓ ' : ''}${t}</span>`).join('')}</div>${det}`;
}

    </div>

/* «… del 3 de octubre de 2026» → 2026-10-03 (para proponer la fecha al registrar soportes antiguos). */
function fechaDeTexto(t) {
  const m = sinTildes(String(t)).match(/(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre) de (\d{4})/);
  return m ? `${m[3]}-${pad(MESES.indexOf(m[2]) + 1)}-${pad(+m[1])}` : '';
}

/* --- Ventana del seguimiento --- */
const discDe = (w, id) => (w.d.disciplinarios || []).find(c => c.id === id);
const CAMPOS_PROCESO = ['fechaDescargos', 'horaDescargos', 'lugar', 'asistencia', 'acompanantes', 'descargos', 'decision', 'fechaDecision', 'suspDesde', 'suspHasta', 'motivo'];
function abrirDisc(w, idC, op = {}) {
  const c = idC ? discDe(w, idC) : null, v = k => h(c ? c[k] ?? '' : op[k] ?? '');
  const tipo = c ? c.tipo : op.tipo || 'Llamado de atención', sel = (lista, actual, vacio) => (vacio ? `<option value="">${vacio}</option>` : '') + lista.map(t => `<option ${actual === t ? 'selected' : ''}>${t}</option>`).join('');
  const anexos = c ? anexosDisc(w, c) : [];
  S.modal = { tipo: 'disc', wid: w.id, idC, carpeta: c ? c.carpeta : op.carpeta || '' };
  abrirModal(`${cabModal(c ? (c.tipo === 'Proceso de descargos' ? 'Seguimiento del proceso de descargos' : 'Llamado de atención') : tipo === 'Proceso de descargos' ? 'Nuevo proceso de descargos' : 'Nuevo llamado de atención', nombreBonito(w.nombre))}

      <label class="campo">Fecha de los hechos<input type="date" id="dcFechaHechos" value="${v('fechaHechos')}"></label>
      <label class="campo">Falta o norma incumplida<input id="dcFalta" value="${v('falta')}" placeholder="Ej.: llegadas tarde; reglamento interno, art. …"></label>
      <label class="campo" style="grid-column:1/-1">Hechos<textarea id="dcHechos" rows="3" placeholder="Qué pasó, cuándo y dónde">${v('hechos')}</textarea></label>
      <div id="dcProceso" style="grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:inherit">
        <div class="sutil" style="grid-column:1/-1;margin:4px 0 -6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">Citación y diligencia de descargos</div>
        <label class="campo">Fecha de la diligencia<input type="date" id="dcFechaDescargos" value="${v('fechaDescargos')}"></label>
        <label class="campo">Hora<input type="time" id="dcHoraDescargos" value="${v('horaDescargos')}"></label>
        <label class="campo">Lugar<input id="dcLugar" value="${v('lugar')}" placeholder="Ej.: oficina administrativa"></label>
        <label class="campo">Cómo fue la diligencia<select id="dcAsistencia">${sel(['Rindió descargos', 'No asistió'], c && c.asistencia, 'Pendiente')}</select></label>
        <label class="campo">Acompañantes del trabajador<input id="dcAcompanantes" value="${v('acompanantes')}" placeholder="Opcional (hasta dos compañeros)"></label>
        <span></span>
        <label class="campo" style="grid-column:1/-1">Resumen de los descargos<textarea id="dcDescargos" rows="3" placeholder="Lo que explicó el trabajador y las pruebas que aportó">${v('descargos')}</textarea></label>
        <div class="sutil" style="grid-column:1/-1;margin:4px 0 -6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">Decisión</div>
        <label class="campo">Decisión<select id="dcDecision">${sel(DECISIONES_DISC, c && c.decision, 'Pendiente')}</select></label>
        <label class="campo">Fecha de la decisión<input type="date" id="dcFechaDecision" value="${v('fechaDecision')}"></label>
        <label class="campo dc-susp">Suspensión desde<input type="date" id="dcSuspDesde" value="${v('suspDesde')}"></label>
        <label class="campo dc-susp">Suspensión hasta<input type="date" id="dcSuspHasta" value="${v('suspHasta')}"></label>
        <label class="campo" style="grid-column:1/-1">Motivo de la decisión<textarea id="dcMotivo" rows="2" placeholder="Por qué se decide así (opcional; sale en la comunicación)">${v('motivo')}</textarea></label>

function leerDisc() {
  const val = id => ($(id) ? $(id).value.trim() : '');
  const d = { tipo: val('#dcTipo'), fecha: val('#dcFecha'), fechaHechos: val('#dcFechaHechos'), falta: val('#dcFalta'), hechos: val('#dcHechos'), nota: val('#dcNota') };
  if (d.tipo === 'Proceso de descargos') for (const k of CAMPOS_PROCESO) d[k] = val('#dc' + k[0].toUpperCase() + k.slice(1));
  if (d.decision !== 'Suspensión') { d.suspDesde = ''; d.suspHasta = ''; }
  return d;
}
function previaDisc() {
  const el = $('#dcPrevia'); if (!el) return;
  const d = leerDisc(), proceso = d.tipo === 'Proceso de descargos', H = hoy();
  $('#dcProceso').style.display = proceso ? 'grid' : 'none';
  $('#dcFechaEtq').textContent = proceso ? 'Fecha de la citación' : 'Fecha del llamado de atención';
  document.querySelectorAll('.dc-susp').forEach(x => { x.style.display = d.decision === 'Suspensión' ? '' : 'none'; });
  const notas = [], hechos = fecha(d.fechaHechos), f = fecha(d.fecha);
  if (hechos && f && diasEntre(hechos, f) > 30) notas.push(`<span class="n-media">Pasaron ${diasEntre(hechos, f)} días desde los hechos: la sanción debe imponerse con prontitud (inmediatez).</span>`);
  if (proceso) {
    const dil = fecha(d.fechaDescargos);
    if (!dil) notas.push('Indique la fecha de la diligencia para imprimir la citación. Entre la citación y la diligencia deje tiempo para que el trabajador prepare su defensa.');
    else if (f && diasEntre(f, dil) < 1) notas.push('<span class="n-media">La diligencia es el mismo día de la citación: conviene dar al menos un día hábil para preparar la defensa.</span>');
    if (dil && dil <= H && !d.asistencia) notas.push('Ya pasó la fecha de la diligencia: indique cómo fue.');
    if (d.decision === 'Suspensión') {
      const n = d.suspDesde && d.suspHasta ? diasEntre(fecha(d.suspDesde), fecha(d.suspHasta)) + 1 : 0;
      notas.push(n > 0 ? `Suspensión de <strong>${n} día(s)</strong>. Por la primera falta no puede pasar de 8 días; si reincide, de 2 meses (art. 112 CST). Se descuenta sola del tiempo para vacaciones.` : '<span class="n-alta">Indique las fechas de la suspensión.</span>');
    }
    if (d.decision && !d.asistencia) notas.push('<span class="n-media">Hay decisión pero no se registró cómo fue la diligencia de descargos.</span>');
  }
  el.innerHTML = notas.join('<br>') || (proceso ? 'Pasos: citación por escrito → diligencia de descargos con acta → decisión comunicada por escrito. Imprima cada documento desde «Imprimir».' : 'Imprima el llamado de atención, hágalo firmar y adjúntelo como anexo.');
}
function sincronizarSuspension(d, c) {
  d.novedades = (d.novedades || []).filter(n => n.disc !== c.id);
  if (c && c.decision === 'Suspensión' && c.suspDesde && c.suspHasta) {
    d.novedades.push({ id: nuevoId(), tipo: 'Suspensión disciplinaria', desde: c.suspDesde, hasta: c.suspHasta, disc: c.id });
    d.novedades.sort((a, b) => a.desde.localeCompare(b.desde));
  }
}
/* Guarda el seguimiento. Con cerrar = false deja la ventana abierta (para adjuntar un anexo enseguida). */
function guardarDisc(cerrar = true) {
  const m = S.modal, w = S.porId.get(m.wid), d = datosDe(w), datos = leerDisc();
  if (!datos.hechos) { aviso('Describa los hechos.', true); return null; }
  if (!datos.fecha) { aviso('Indique la fecha.', true); return null; }
  if (datos.decision === 'Suspensión' && (!datos.suspDesde || !datos.suspHasta || datos.suspHasta < datos.suspDesde)) { aviso('Indique las fechas de la suspensión.', true); return null; }
  d.disciplinarios = d.disciplinarios || [];
  const nuevo = !m.idC, c = nuevo ? { id: nuevoId() } : discDe(w, m.idC);
  if (nuevo && m.carpeta) c.carpeta = m.carpeta;
  if (datos.tipo !== 'Proceso de descargos') CAMPOS_PROCESO.forEach(k => delete c[k]);
  Object.assign(c, datos);
  Object.keys(c).forEach(k => { if (c[k] === '' || c[k] == null) delete c[k]; });
  if (nuevo) d.disciplinarios.push(c);
  sincronizarSuspension(d, c);
  m.idC = c.id;
  recalcular(w); guardar(`${nuevo ? 'Nuevo' : 'Editar'} ${c.tipo.toLowerCase()} de ${nombreBonito(w.nombre)}`);
  if (cerrar) { cerrarModal(); rerender(); avisoDeshacer(nuevo ? `${c.tipo} registrado.` : 'Seguimiento actualizado.'); }
  return c;
}
function borrarDisc() {
  const m = S.modal, w = S.porId.get(m.wid), d = datosDe(w), c = discDe(w, m.idC);
  if (!c || !confirm(`¿Eliminar este ${c.tipo.toLowerCase()}?\n\nLos anexos no se borran: quedan en la carpeta Llamados de atención.`)) return;
  d.disciplinarios = d.disciplinarios.filter(x => x !== c);
  d.novedades = (d.novedades || []).filter(n => n.disc !== c.id);
  recalcular(w); guardar(`Eliminar ${c.tipo.toLowerCase()} de ${nombreBonito(w.nombre)}`); cerrarModal(); rerender();
  avisoDeshacer(`${c.tipo} eliminado.`);
}
/* Adjuntar un anexo: el tipo de documento y la fecha se proponen según lo que falta en el seguimiento. */
function abrirAnexoDisc(w, idC, op = {}) {
  const c = discDe(w, idC); if (!c) return;
  const x = calcCasoDisc(w, c), tiene = t => x.anexos.some(a => sinTildes(a.nombre).startsWith(sinTildes(t)));
  const anexo = op.anexo || (x.proceso ? ['Citación a descargos', 'Acta de descargos', 'Decisión'].find(t => !tiene(t)) || 'Pruebas' : 'Llamado de atención');
  const fechaA = { 'Citación a descargos': c.fecha, 'Acta de descargos': c.fechaDescargos, 'Decisión': c.fechaDecision, 'Llamado de atención': c.fecha }[anexo];
  abrirSubir(w, { tipo: 'llamado', anexo, fecha: fechaA || iso(hoy()), carpetaFija: c.carpeta || '', nuevaSub: `${c.tipo} del ${fechaLarga(fechaDisc(c))}`,
    volver: { enlazar: { tipo: 'disc', wid: w.id, id: c.id }, ...(op.reabrir ? { reabrir: { wid: w.id, id: c.id } } : {}) } });
}

  return `<div class="tarjeta"><div class="tarjeta-titulo"><h2>Pendientes y seguimiento</h2><span class="sutil">Tareas propias de este trabajador (por ejemplo: "Solicitar certificado bancario")</span></div>

      const sinFirma = w.tipo === 'servicio' ? w.det.contratos.filter(c => !c.firmado).map(c => 'Contrato del ' + fechaLarga(c.fecha) + ' firmado') : [];
      const faltan = [...req.map(d => d.nombre), ...sinFirma];
      csv.push([w.nombre, w.d.documento || '', w.area, w.estado, faltan.join(', '), rec.map(d => d.nombre).join(', '), w.det.revisar.map(a => a.nombre).join(', ')]);
      return `<tr class="clic" data-ir="${h(linkT(w, 'documentos'))}"><td>${persona(w)}</td><td>${faltan.map(n => chip('pend', n)).join(' ') || chip('ok', 'Completo')}</td><td>${rec.map(d => chip('sin', d.nombre)).join(' ') || '<span class="sutil">—</span>'}</td><td>${w.det.revisar.length ? chip('parcial', w.det.revisar.length + ' archivo(s)') : '<span class="sutil">—</span>'}</td></tr>`;
    }).join('')}</tbody></table>`;
  }

  if (k === 'planillas') {
    const meses = Array.from({ length: 6 }, (_, i) => { const d = sumarMeses(new Date(hoy().getFullYear(), hoy().getMonth(), 1), i - 5); return d.getFullYear() + '-' + pad(d.getMonth() + 1); });
    csv.push(['Trabajador', 'Documento', 'Estado', ...meses]);
    tabla = `<table><thead><tr><th>Contratista</th>${meses.map(m => `<th>${MES_CORTO[+m.slice(5) - 1]} ${m.slice(0, 4)}</th>`).join('')}<th class="centro">Pendientes</th></tr></thead><tbody>
    ${lista.map(w => {
      const pl = w.c.planillas, celdas = meses.map(m => pl.meses.find(x => x.key === m));
      csv.push([w.nombre, w.d.documento || '', w.estado, ...celdas.map(c => c ? ETQ[c.estado] : '—')]);
      return `<tr><td><a href="${linkT(w, 'afiliaciones')}" style="color:inherit">${persona(w)}</a></td>${celdas.map(c => `<td>${botonCelda(w, 'planillas', c)}</td>`).join('')}<td class="centro">${chip(pl.meses.some(m => m.estado === 'pend') ? 'pend' : 'ok', String(pl.meses.filter(m => m.estado === 'pend').length))}</td></tr>`;
    }).join('')}</tbody></table>`;
  }

  if (k === 'prestamos') {
    const proxNomina = fechasDescuento(hoy(), 'Quincenal', 1)[0];
    const filas = lista.flatMap(w => w.c.prestamos.lista.filter(x => !x.terminado).map(x => ({ w, x })));
    const activas = filas.filter(({ w }) => w.estado === 'Activo');
    const totalFijo = activas.reduce((t, { x }) => t + x.aDescontarHasta(proxNomina), 0);
    const variables = activas.filter(({ x }) => !x.fija && x.proxima && x.proxima.fecha <= proxNomina).length;
    csv.push(['Trabajador', 'Documento', 'Contrato', 'Tipo', 'Concepto', 'Cuotas', 'Valor total', 'Descontado', 'Saldo', 'Próximo descuento', 'Valor del próximo descuento', 'Vencido', 'Estado']);
    tabla = `<div class="nota info" style="margin:14px 16px">Próxima nómina: <strong>${fechaLarga(proxNomina)}</strong> · descuentos de cuota fija a trabajadores activos: <strong>${dinero(totalFijo) || '$ 0'}</strong>${variables ? ` · más ${variables} descuento(s) de cuota variable` : ''}.</div>
    <table><thead><tr><th>Trabajador</th><th>Concepto</th><th>Cuotas</th><th>Saldo</th><th>Próximo descuento</th><th>Estado</th></tr></thead><tbody>
    ${filas.map(({ w, x }) => {
      csv.push([w.nombre, w.d.documento || '', numeroContrato(w), x.p.tipo || 'Préstamo', x.p.concepto || '', x.desc, x.conTope ? x.monto : 'Sin tope', x.pagado, x.conTope ? x.saldo : '', x.proxima ? iso(x.proxima.fecha) : '', x.proxima && x.proxima.valor ? x.proxima.valor : (x.proxima ? 'Variable' : ''), x.atraso || '', estadoPrestamo(w, x).etq]);
      return `<tr class="clic" data-ir="${h(linkT(w, 'prestamos'))}"><td>${persona(w)}</td><td><strong>${h(x.p.concepto || x.p.tipo)}</strong><div class="sutil">${h(x.p.tipo || 'Préstamo')}${x.p.fecha ? ' · ' + fechaCorta(x.p.fecha) : ''}</div></td><td>${h(x.desc)}</td>
        <td class="num"><strong>${x.conTope ? dinero(x.saldo) || '$ 0' : 'Sin tope'}</strong>${x.conTope ? `<div class="sutil">de ${dinero(x.monto)}</div>` : ''}</td>
        <td class="num">${x.proxima ? fechaCorta(x.proxima.fecha) + `<div class="sutil">${x.proxima.valor ? dinero(x.proxima.valor) : 'valor variable'}</div>` : '—'}</td>
        <td>${(e => chip(e.estado, e.etq) + (e.vencido ? `<div class="sutil n-alta">${e.vencido}</div>` : ''))(estadoPrestamo(w, x))}</td></tr>`;
    }).join('') || '<tr><td colspan="6" class="vacio">No hay préstamos ni descuentos vigentes con estos filtros.</td></tr>'}</tbody></table>`;
  }

  if (k === 'llamados') {
    const filas = lista.flatMap(w => w.c.disciplinarios.lista.map(x => ({ w, x })))
      .sort((a, b) => (b.x.abierto - a.x.abierto) || String(fechaDisc(b.x.c)).localeCompare(String(fechaDisc(a.x.c))));
    const abiertos = filas.filter(f => f.x.abierto).length, sinFirma = filas.filter(f => !f.x.proceso && f.x.estado === 'pend').length;
    csv.push(['Trabajador', 'Documento', 'Estado del trabajador', 'Fecha', 'Tipo', 'Fecha de los hechos', 'Hechos', 'Falta', 'Diligencia de descargos', 'Cómo fue', 'Decisión', 'Seguimiento', 'Anexos']);
    tabla = `<div class="nota info" style="margin:14px 16px"><strong>${abiertos}</strong> proceso(s) de descargos abierto(s)${sinFirma ? ` · <strong>${sinFirma}</strong> llamado(s) de atención sin soporte firmado` : ''}. La sanción debe decidirse con prontitud después de conocer los hechos.</div>
    <table><thead><tr><th>Trabajador</th><th>Fecha</th><th>Tipo y hechos</th><th>Seguimiento</th><th>Decisión</th><th class="centro">Anexos</th><th>Estado</th></tr></thead><tbody>
    ${filas.map(({ w, x }) => {
      const c = x.c;
      csv.push([w.nombre, w.d.documento || '', w.estado, fechaDisc(c), c.tipo, c.fechaHechos || '', c.hechos || '', c.falta || '', c.fechaDescargos || '', c.asistencia || '', decisionDisc(c), x.etq, x.anexos.length]);
      return `<tr class="clic" data-ir="${h(linkT(w, 'llamados'))}"><td>${persona(w)}</td><td class="num">${fechaCorta(fechaDisc(c)) || '—'}</td><td><strong>${h(c.tipo)}</strong><div class="sutil">${h(recortar(c.hechos, 110))}</div></td>
        <td>${pasosDisc(x)}</td><td>${h(decisionDisc(c)) || `<span class="sutil">${x.proceso ? 'Pendiente' : '—'}</span>`}</td><td class="centro num">${x.anexos.length}</td><td>${chip(x.estado, x.etq)}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="vacio">No hay llamados de atención ni procesos de descargos con estos filtros.</td></tr>'}</tbody></table>`;
  }

  S.csv = { nombre: def.t, filas: csv };
  return `<div class="encabezado"><div><h1>${h(def.t)}</h1><p>${h(def.d)} ${k === 'prestamos' ? 'Haga clic en una fila para abrir los préstamos del trabajador.' : k === 'llamados' ? 'Haga clic en una fila para abrir el seguimiento del trabajador.' : 'Haga clic en una casilla para registrar o adjuntar el soporte.'}</p></div></div>
    ${barraFiltros(f, 'ctrl', extra)}
    ${def.tipo === 'laboral' ? `<p class="sutil" style="margin-top:-6px">Se muestran los trabajadores con contrato laboral. Cada uno se revisa desde su fecha de ingreso (o la de la empresa anterior, si viene por sustitución patronal con continuidad).</p>` : ''}
    <div class="tarjeta tabla-env">${lista.length ? tabla : '<div class="vacio">No hay trabajadores con estos filtros.</div>'}</div>`;
}

/* ---------- Ventanas (modales) ---------- */

function abrirModal(html, ancho) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal ${ancho === 'visor' ? 'visor' : ancho ? 'ancho' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  m.hidden = false;
  const f = m.querySelector('input:not([type=hidden]):not([disabled]), select, textarea');
  if (f) f.focus();
}
function cerrarModal() {
  const url = S.modal && S.modal.url;
  $('#modal').hidden = true; $('#modal').innerHTML = ''; S.modal = null;
  if (url) setTimeout(() => URL.revokeObjectURL(url), 60000); // por si se abrió también en otra pestaña
}
const cabModal = (t, sub) => `<div class="modal-cab"><div><h2>${h(t)}</h2>${sub ? `<p>${h(sub)}</p>` : ''}</div><button class="cerrar" data-accion="cerrar-modal" aria-label="Cerrar">×</button></div>`;

/* --- Adjuntar soporte --- */

function abrirSubir(w, op = {}) {
  const tipo = op.tipo || (S.carpetaSel[w.id] ? TIPO_POR_CAT[catDe(S.carpetaSel[w.id])] : null) || 'otro';
  const H = hoy();
  S.modal = {
    tipo: 'subir', wid: w.id, soporte: tipo, archivos: op.archivos || [],
    v: { anio: op.anio || H.getFullYear(), mes: op.mes || (H.getMonth() + 1), semestre: op.semestre || (H.getMonth() < 6 ? 1 : 2), fecha: op.fecha || iso(H), sistema: op.sistema || 'eps', anexo: op.anexo || 'Llamado de atención', carpetaFija: op.carpetaFija || '', nuevaSub: op.nuevaSub || '', categoria: op.categoria || S.carpetaSel[w.id] || carpetaDe(w, 'personales'), texto: op.texto || '', quincena: op.quincena || '' },
    volver: op.volver || null,
  };
  pintarSubir();
}

function destinoSubida(w, m) {
  const t = TIPOS_SOPORTE.find(x => x.k === m.soporte);
  const v = m.v;
  let cat = t.cat;
  if (t.k === 'afiliacion' && v.sistema === 'arl' && w.tipo === 'servicio') cat = 'arl';
  let carpeta = t.cat ? carpetaDe(w, cat) : v.categoria;
  // Los anexos de un seguimiento ya creado van a su propia subcarpeta
  if (t.subcarpeta) carpeta = t.k === 'llamado' && v.carpetaFija ? v.carpetaFija : carpeta + '/' + siguienteSubcarpeta(w, carpeta, t.subcarpeta(v));
  return { carpeta, base: t.nombreFn(v, w), t };
}

function pintarSubir() {
  const m = S.modal, w = S.porId.get(m.wid);
  const tipos = TIPOS_SOPORTE.filter(t => !t.tipos || t.tipos.includes(w.tipo));
  const t = TIPOS_SOPORTE.find(x => x.k === m.soporte) || tipos[0];
  m.soporte = t.k;
  const campos = (t.campos || []).map(c => {
    if (c === 'anio') return `<label class="campo">Año<input type="number" min="2000" max="2100" data-sv="anio" value="${h(m.v.anio)}"></label>`;
    if (c === 'mes') return `<label class="campo">Mes<select data-sv="mes">${MESES.map((x, i) => `<option value="${i + 1}" ${+m.v.mes === i + 1 ? 'selected' : ''}>${x}</option>`).join('')}</select></label>`;
    if (c === 'semestre') return `<label class="campo">Semestre<select data-sv="semestre"><option value="1" ${+m.v.semestre === 1 ? 'selected' : ''}>Primer semestre</option><option value="2" ${+m.v.semestre === 2 ? 'selected' : ''}>Segundo semestre</option></select></label>`;
    if (c === 'fecha' || (c === 'fechaOpc' && w.tipo === 'servicio')) return `<label class="campo">${c === 'fechaOpc' ? 'Fecha del contrato' : 'Fecha'}<input type="date" data-sv="fecha" value="${h(m.v.fecha)}"></label>`;
    if (c === 'sistema') return `<label class="campo">Sistema<select data-sv="sistema">${SISTEMAS.map(s => `<option value="${s.k}" ${m.v.sistema === s.k ? 'selected' : ''}>${h(s.nombre)}</option>`).join('')}</select></label>`;
    if (c === 'categoria') return `<label class="campo">Carpeta<select data-sv="categoria">${carpetasDe(w).map(c2 => `<option ${m.v.categoria === c2.nombre ? 'selected' : ''}>${h(c2.nombre)}</option>`).join('')}</select></label>`;
    if (c === 'anexo') return `<label class="campo">Documento<select data-sv="anexo">${ANEXOS_DISC.map(x => `<option ${m.v.anexo === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>`;
    if (c === 'concepto') return `<label class="campo">Concepto<input data-sv="texto" value="${h(m.v.texto)}" placeholder="Autorización de préstamo"></label>`;
    if (c === 'quincena') return `<label class="campo">Periodo<select data-sv="quincena">${[['', 'Mes completo'], ['primera quincena', 'Primera quincena'], ['segunda quincena', 'Segunda quincena']].map(([v2, t2]) => `<option value="${v2}" ${m.v.quincena === v2 ? 'selected' : ''}>${t2}</option>`).join('')}</select></label>`;
    if (c === 'texto') return `<label class="campo" style="grid-column:1/-1">Nombre del documento<input data-sv="texto" value="${h(m.v.texto)}" placeholder="Ej.: Certificado laboral del 15 de octubre de 2026"></label>`;
    return '';
  }).join('');
  const mover = m.mover && S.porRuta.get(m.mover);
  abrirModal(`${cabModal(mover ? 'Mover soporte' : 'Adjuntar soporte', nombreBonito(w.nombre))}
    <div class="modal-cuerpo">
      ${mover ? `<div class="vista-previa">Documento que se mueve:<br><code>${h(padreDe(m.mover.slice(w.id.length + 1)).split('/').filter(Boolean).map(sinNumero).join(' › ') || 'Carpeta del trabajador')} › ${h(ultimoSeg(m.mover))}</code></div>
        <p class="sutil" style="margin:0">Elija a qué corresponde en realidad: otro tipo de soporte (por ejemplo de Vacaciones a Dotación) u otro periodo (por ejemplo de 2022 a 2025). El nombre y la carpeta se ponen solos.</p>` : ''}
      <label class="campo">${mover ? 'Corresponde a' : 'Tipo de soporte'}<select data-sv="soporte">${tipos.map(x => `<option value="${x.k}" ${x.k === t.k ? 'selected' : ''}>${h(x.nombre)}</option>`).join('')}</select></label>
      ${campos ? `<div class="form" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${campos}</div>` : ''}
      ${mover ? '' : `<div class="zona-soltar" data-accion="elegir-archivo" data-soltar="modal">${m.archivos.length ? `<strong>${m.archivos.length} archivo(s) listo(s):</strong><br>${m.archivos.map(f => h(f.name)).join('<br>')}<br><span class="sutil">Clic para cambiar</span>` : 'Arrastre el archivo aquí o haga clic para buscarlo'}</div>
      <input type="file" id="archivoSubir" multiple hidden ${t.k === 'foto' ? 'accept="image/*"' : ''}>`}
      <div class="vista-previa" id="previaSubida"></div>
    </div>
    <div class="modal-pie"><button class="btn" data-accion="cerrar-modal">Cancelar</button><button class="btn btn-primario" data-accion="confirmar-subida" ${m.archivos.length || mover ? '' : 'disabled'}>${mover ? 'Mover aquí' : 'Guardar en el expediente'}</button></div>`);
  actualizarPrevia();
}

function actualizarPrevia() {
  const m = S.modal, w = S.porId.get(m.wid), el = $('#previaSubida');
  if (!el) return;
  const { carpeta, base } = destinoSubida(w, m);
  const ext = m.mover ? (m.mover.match(/\.[^./]+$/) || [''])[0] : m.archivos[0] ? (m.archivos[0].name.match(/\.[^.]+$/) || [''])[0].toLowerCase() : '.pdf';
  el.innerHTML = base ? `${m.mover ? 'Quedará como' : 'Se guardará como'}:<br><code>${h(sinNumero(carpeta.split('/')[0]))}${carpeta.includes('/') ? ' › ' + h(carpeta.split('/').slice(1).join(' › ')) : ''} › ${h(base + ext)}</code>${m.archivos.length > 1 ? '<div class="sutil">Los demás archivos se numeran (2), (3)…</div>' : ''}` : '<span class="n-alta">Escriba el nombre del documento.</span>';
}

async function confirmarSubida() {
  const m = S.modal, w = S.porId.get(m.wid);
  const { carpeta, base, t } = destinoSubida(w, m);
  if (!base) return aviso('Escriba el nombre del documento.', true);
  if ((t.campos || []).includes('fecha') && !m.v.fecha) return aviso('Indique la fecha.', true);
  const btn = $('[data-accion="confirmar-subida"]'); btn.disabled = true; btn.textContent = m.mover ? 'Moviendo…' : 'Guardando…';
  if (m.mover) {
    try {
      const ext = (m.mover.match(/\.[^./]+$/) || [''])[0];
      const nueva = await moverDocumento(m.mover, w.id + '/' + carpeta, base + ext);
      cerrarModal();
      if (nueva === m.mover) return aviso('El documento ya tenía ese nombre y estaba en esa carpeta.');
      actualizarReferencias(m.mover, nueva);
      guardar(`Mover «${ultimoSeg(m.mover)}»`); await cargar(); rerender();
      avisoDeshacer(`Soporte movido a ${padreDe(nueva.slice(w.id.length + 1)).split('/').map(sinNumero).join(' › ')} › ${ultimoSeg(nueva)}.`);
    } catch (err) { aviso('No se pudo mover: ' + err.message, true); btn.disabled = false; btn.textContent = 'Mover aquí'; }
    return;
  }
  try {
    const rutas = [];
    for (const f of m.archivos) {
      const ext = (f.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
      rutas.push(await agregarDocumento(w.id + '/' + carpeta, base + ext, f));
    }
    const volver = m.volver;
    if (volver && volver.enlazar) enlazarSoporte(volver.enlazar, rutas[0]);
    guardar(`Adjuntar ${m.archivos.length > 1 ? m.archivos.length + ' soportes' : '«' + base + '»'} a ${nombreBonito(w.nombre)}`); cerrarModal();
    avisoDeshacer(`${m.archivos.length} soporte(s) agregado(s) a ${sinNumero(carpeta.split('/')[0])}.`);
    await cargar();
    rerender();
    if (volver && (volver.modal || volver.reabrir)) volverAlFormulario(volver, rutas[0]);
  } catch (err) { aviso('No se pudo guardar: ' + err.message, true); btn.disabled = false; btn.textContent = 'Guardar en el expediente'; }
}

/* --- Adjuntar desde un campo del formulario ---
   El botón «Adjuntar» junto a un campo de archivo guarda lo escrito en el formulario, abre la ventana de adjuntar y,
   al guardar (o cancelar), vuelve al formulario con el archivo nuevo ya elegido en ese campo. */
function capturarFormulario() {
  const v = {};
  document.querySelectorAll('#modal input[id], #modal select[id], #modal textarea[id]').forEach(el => { if (el.type !== 'file') v[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
  return v;
}
function adjuntarDesdeCampo(el) {
  const m = S.modal, w = S.porId.get(m.wid);
  const volver = { modal: { ...m }, form: capturarFormulario(), campo: el.dataset.campoArchivo };
  let texto = el.dataset.texto, fechaS;
  if (m.tipo === 'prestamo') { // el nombre del soporte toma el concepto y la fecha que ya se escribieron
    if (volver.form.pConcepto) texto = 'Autorización de ' + volver.form.pConcepto.toLowerCase();
    fechaS = volver.form.pFecha || undefined;
  }
  abrirSubir(w, { tipo: el.dataset.tipo, anio: el.dataset.anio && +el.dataset.anio, texto, fecha: fechaS, volver });
}
function volverAlFormulario(v, ruta) {
  if (v.reabrir) { const w2 = S.porId.get(v.reabrir.wid); if (w2) abrirDisc(w2, v.reabrir.id); return; }
  const m = v.modal, w = S.porId.get(m.wid); if (!w) return;
  if (m.tipo === 'prestamo') abrirPrestamo(w, m.idP);
  else if (m.tipo === 'vac') abrirVacaciones(w, v.form.vPeriodo, m.regId);
  else return;
  for (const [id, val] of Object.entries(v.form)) { const el = document.getElementById(id); if (el) { if (el.type === 'checkbox') el.checked = val; else el.value = val; } }
  if (ruta && v.campo && $('#' + v.campo)) $('#' + v.campo).value = ruta;
  if (m.tipo === 'prestamo') previaPrestamo(); else calcVacModal('inicio');
}
/* Adjuntar directamente el soporte de algo ya guardado (por ejemplo, un préstamo sin soporte). */
function enlazarSoporte(enl, ruta) {
  const w = S.porId.get(enl.wid); if (!w || !ruta) return;
  if (enl.tipo === 'prestamo') { const p = prestamoDe(w, enl.id); if (p) p.soporte = ruta; }
  if (enl.tipo === 'disc') { // el primer anexo crea la carpeta del seguimiento
    const c = discDe(w, enl.id), rel = padreDe(ruta.slice(w.id.length + 1));
    if (c && !c.carpeta && catDe(rel.split('/')[0]) === 'llamados') c.carpeta = rel;
  }
}
const botonAdjuntar = (campo, tipo, extra = '') => `<button type="button" class="btn btn-chico" data-accion="adjuntar-campo" data-campo-archivo="${campo}" data-tipo="${tipo}" ${extra} title="Subir un archivo nuevo y dejarlo como soporte">Adjuntar</button>`;

/* --- Registro manual de una casilla de control --- */

function abrirCelda(w, tipo, key, sub) {
  let cel, titulo, okEtq, prefill;
  if (tipo === 'cesantias') {
    cel = w.c.cesantias.filas.find(f => f.key === key);
    titulo = (sub === 'intereses' ? 'Intereses de cesantías ' : 'Consignación de cesantías al fondo ') + key;
    okEtq = sub === 'intereses' ? 'Pagados (soporte en físico u otro medio)' : 'Consignadas';
    prefill = { tipo: sub === 'intereses' ? 'intereses' : 'consignacion', anio: +key };
  } else {
    const fuente = tipo === 'planillas' ? w.c.planillas.meses : w.c[tipo].celdas;
    cel = fuente.find(c => c.key === key);
    titulo = tipo === 'primas' ? 'Prima · ' + cel.titulo.toLowerCase() : tipo === 'planillas' ? 'Planilla de ' + cel.titulo : cel.titulo;
    okEtq = tipo === 'dotacion' ? 'Entregada (soporte en físico)' : tipo === 'planillas' ? 'Verificada' : 'Pagada (soporte en físico)';
    const [a, b] = key.split('-').map(Number);
    prefill = tipo === 'primas' ? { tipo: 'prima', anio: a, semestre: b } : tipo === 'dotacion' ? { tipo: 'dotacion', anio: a, mes: CORTES_DOT[b - 1].mes + 1 } : { tipo: 'planilla', anio: a, mes: b };
  }
  if (!cel) return;
  const ctl = (w.d.controles && w.d.controles[tipo] && w.d.controles[tipo][key]) || {};
  const pre = tipo === 'cesantias' ? sub + '_' : '';
  const estadoAct = tipo === 'cesantias' ? ctl[sub] : ctl.estado;
  const est = tipo === 'cesantias' ? cel[sub === 'intereses' ? 'int' : 'cons'] : cel.estado;
  const archivos = tipo === 'cesantias' ? (sub === 'intereses' ? cel.archInt : cel.archCons) : cel.archivos;
  const vence = tipo === 'cesantias' ? (sub === 'intereses' ? cel.venceInt : cel.venceCons) : cel.vence;
  S.modal = { tipo: 'celda', wid: w.id, ctl: tipo, key, sub, prefill, titulo };
  abrirModal(`${cabModal(titulo, nombreBonito(w.nombre))}
    <div class="modal-cuerpo">
      <div style="display:flex;gap:10px;align-items:center">${chip(est)}${vence ? `<span class="sutil">Fecha límite: ${fechaLarga(vence)}</span>` : ''}</div>
      <div><div class="sutil" style="margin-bottom:4px">Soportes en la carpeta</div>${listaArchivos(archivos, 'Ninguno todavía.')}</div>
      <div class="form" style="grid-template-columns:1fr 1fr">
        <label class="campo" style="grid-column:1/-1">Registro manual<select id="cEstado"><option value="">Automático (según soportes)</option><option value="ok" ${estadoAct === 'ok' ? 'selected' : ''}>${h(okEtq)}</option><option value="na" ${estadoAct === 'na' ? 'selected' : ''}>No aplica</option></select></label>
        <label class="campo">Fecha<input type="date" id="cFecha" value="${h(ctl[pre + 'fecha'] || '')}"></label>
        <label class="campo">Valor<input type="number" min="0" step="100" id="cValor" value="${h(ctl[pre + 'valor'] || '')}"></label>
        <label class="campo" style="grid-column:1/-1">Nota<input id="cNota" value="${h(ctl[pre + 'nota'] || '')}" placeholder="Ej.: firmado en planilla física, pagado en nómina"></label>
      </div>
    </div>
    <div class="modal-pie"><button class="btn" data-accion="celda-subir" style="margin-right:auto">Adjuntar soporte</button><button class="btn" data-accion="cerrar-modal">Cancelar</button><button class="btn btn-primario" data-accion="celda-guardar">Guardar</button></div>`);
}

function guardarCelda() {
  const m = S.modal, w = S.porId.get(m.wid), d = datosDe(w);
  const pre = m.ctl === 'cesantias' ? m.sub + '_' : '';
  d.controles = d.controles || {}; d.controles[m.ctl] = d.controles[m.ctl] || {};
  const reg = d.controles[m.ctl][m.key] || {};
  const est = $('#cEstado').value;
  if (m.ctl === 'cesantias') { if (est) reg[m.sub] = est; else delete reg[m.sub]; } else { if (est) reg.estado = est; else delete reg.estado; }
  for (const [k, id] of [['fecha', '#cFecha'], ['valor', '#cValor'], ['nota', '#cNota']]) { const v = $(id).value.trim(); if (v) reg[pre + k] = k === 'valor' ? Number(v) : v; else delete reg[pre + k]; }
  if (Object.keys(reg).length) d.controles[m.ctl][m.key] = reg; else delete d.controles[m.ctl][m.key];
  recalcular(w); guardar(`${m.titulo} de ${nombreBonito(w.nombre)}`); cerrarModal(); rerender();
}

/* --- Registro de vacaciones --- */

function abrirVacaciones(w, periodo, regId, soporte) {
  const v = w.c.vacaciones;
  if (v.modo === 'sinFecha') return aviso('Registre primero la fecha de ingreso en la hoja de vida.', true);
  const reg = regId ? (w.d.vacaciones || []).find(r => r.id === regId) : null;
  const per = reg ? (v.modo === 'periodos' ? reg.periodo : reg.anio) : periodo;
  const opciones = v.periodos.slice().reverse();
  const usadas = new Set((w.d.vacaciones || []).filter(r => r !== reg).map(r => r.soporte).filter(Boolean));
  const sops = w.archivos.filter(a => a.cat === 'vacaciones' && !usadas.has(a.ruta));
  const sel = reg ? reg.soporte : soporte;
  S.modal = { tipo: 'vac', wid: w.id, modo: v.modo, regId };
  abrirModal(`${cabModal(reg ? 'Editar registro de vacaciones' : 'Registrar vacaciones', nombreBonito(w.nombre))}
    <div class="modal-cuerpo"><div class="form" style="grid-template-columns:1fr 1fr">
      <label class="campo" style="grid-column:1/-1">Periodo al que corresponden<select id="vPeriodo">${opciones.map(p => `<option value="${p.k}" ${String(p.k) === String(per) ? 'selected' : ''}>${nombrePeriodo(p)} · ${rangoPeriodo(p)}${p.causado ? '' : ' (en curso)'} · disponibles ${fmtDias(p.saldo)}</option>`).join('')}</select></label>
      <label class="campo">Tipo<select id="vTipo">${['Disfrutadas', 'Compensadas en dinero', 'No aplica'].map(t => `<option ${reg && reg.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label class="campo" data-vac="disfrute">Días hábiles<input type="number" id="vDias" min="0" max="45" step="0.5" value="${reg && reg.dias != null && reg.dias !== '' ? h(reg.dias) : 15}"></label>
      <label class="campo" data-vac="disfrute">Primer día de vacaciones <span class="sutil">(opcional)</span><input type="date" id="vDesde" value="${h(reg && reg.tipo === 'Disfrutadas' && reg.desde || '')}"></label>
      <label class="campo" data-vac="disfrute">Último día de vacaciones <span class="sutil">(opcional)</span><input type="date" id="vHasta" value="${h(reg && reg.hasta || '')}"></label>
      <label class="campo" data-vac="compensa">Días compensados<input type="number" id="vDiasComp" min="0" max="45" step="0.5" value="${reg && reg.tipo === 'Compensadas en dinero' && !sinDias(reg) ? h(reg.dias) : ''}" placeholder="Días hábiles pagados en dinero"></label>
      <label class="campo" data-vac="compensa">Valor pagado<input type="number" id="vValor" min="0" step="1" value="${h(reg && reg.valor || '')}" placeholder="$"></label>
      <label class="campo" data-vac="compensa">Fecha de pago<input type="date" id="vPago" value="${h(reg && reg.tipo === 'Compensadas en dinero' && reg.desde || '')}"></label>
      <div class="vista-previa" id="vCalculo" style="grid-column:1/-1">Escriba el primer día para calcular el último día y la fecha de regreso.</div>
      <label class="campo" style="grid-column:1/-1">Soporte en la carpeta<span style="display:flex;gap:8px"><select id="vSoporte"><option value="">Sin soporte digital</option>${sops.map(a => `<option value="${h(a.ruta)}" ${sel === a.ruta ? 'selected' : ''}>${h(a.nombre)}</option>`).join('')}</select>${botonAdjuntar('vSoporte', 'vacaciones', `data-anio="${(v.periodos.find(p2 => String(p2.k) === String(per)) || {}).fin ? String(v.periodos.find(p2 => String(p2.k) === String(per)).fin).slice(0, 4) : hoy().getFullYear()}"`)}</span></label>
      <label class="campo" style="grid-column:1/-1">Nota<input id="vNota" value="${h(reg && reg.nota || '')}" placeholder="Opcional"></label>
    </div>
    <p class="sutil" style="margin:0">Días hábiles: no cuentan domingos ni festivos de Colombia${ajustes().sabadoHabil === false ? ' ni sábados' : ''} (se ajusta en Ajustes). "No aplica" deja el periodo sin saldo (por ejemplo, disfrutado con otro empleador).</p></div>
    <div class="modal-pie">${reg ? '<button class="btn btn-peligro" data-accion="vac-borrar" style="margin-right:auto">Eliminar</button>' : ''}<button class="btn" data-accion="cerrar-modal">Cancelar</button><button class="btn btn-primario" data-accion="vac-guardar">Guardar</button></div>`);
  calcVacModal('inicio');
}

/* Periodo elegido en la ventana de vacaciones y sus días disponibles sin contar el registro que se está editando. */
function periodoVacModal(w) { return w.c.vacaciones.periodos.find(x => String(x.k) === $('#vPeriodo').value); }
function disponiblesVacModal(w, p) {
  const m = S.modal, reg = m.regId && (w.d.vacaciones || []).find(r => r.id === m.regId);
  const mismo = reg && String(m.modo === 'periodos' ? reg.periodo : reg.anio) === String(p.k) && reg.tipo !== 'No aplica';
  return Math.max(0, redondear(p.saldo + (mismo ? diasReg(w, reg) : 0)));
}
/* origen: 'dias' recalcula el último día; 'hasta' recalcula los días hábiles; 'inicio' solo muestra. */
function calcVacModal(origen) {
  const el = $('#vCalculo'); if (!el) return;
  const desde = fecha($('#vDesde').value), dias = Number($('#vDias').value) || 0, tipo = $('#vTipo').value;
  document.querySelectorAll('[data-vac]').forEach(x => { x.style.display = (x.dataset.vac === 'compensa') === (tipo === 'Compensadas en dinero') && tipo !== 'No aplica' ? '' : 'none'; });
  if (tipo === 'Compensadas en dinero') {
    const w = S.porId.get(S.modal.wid), p = periodoVacModal(w), comp = Number($('#vDiasComp').value) || 0, sal = Number(w.d.salario) || 0;
    if (!p) { el.textContent = 'Elija el periodo.'; return; }
    const antes = disponiblesVacModal(w, p), quedan = redondear(antes - comp);
    if (sal && comp) $('#vValor').placeholder = 'Con el salario actual: ' + dinero(Math.round(sal / 30 * comp));
    el.innerHTML = `${h(nombrePeriodo(p))}: ${fmtDias(p.causados)} días causados${p.causado ? '' : ' (en curso)'} · <strong>${fmtDias(antes)} disponibles</strong> antes de esta compensación.`
      + (comp ? ` Con ${fmtDias(comp)} día(s) compensado(s) le ${quedan === 1 ? 'queda' : 'quedan'} <strong>${fmtDias(Math.max(0, quedan))} día(s)</strong> al periodo.` : ' Escriba los días compensados para ver cuántos le quedan.')
      + (comp > antes ? ` <span class="n-alta">Supera los días disponibles del periodo.</span>` : '')
      + (comp && comp > p.causados / 2 ? ` <span class="n-media">Con el contrato vigente solo se puede compensar hasta la mitad del periodo (${fmtDias(p.causados / 2)} días), por acuerdo escrito (art. 189 CST).</span>` : '');
    return;
  }
  if (tipo === 'Disfrutadas' && desde) {
    if (origen === 'hasta' && $('#vHasta').value) $('#vDias').value = diasHabiles(desde, fecha($('#vHasta').value));
    else if (origen === 'dias' && dias > 0) $('#vHasta').value = iso(finVacaciones(desde, Math.ceil(dias)));
  }
  const hasta = fecha($('#vHasta').value);
  if (tipo !== 'Disfrutadas') el.textContent = 'El periodo quedará sin saldo.';
  else if (desde && hasta && hasta >= desde) el.innerHTML = `Del ${fechaLarga(desde)} al ${fechaLarga(hasta)}: <strong>${diasHabiles(desde, hasta)} días hábiles</strong> (${Math.round((hasta - desde) / 86400000) + 1} calendario). Regresa a trabajar el <strong>${fechaLarga(diaRegreso(hasta))}</strong>.`;
  else el.textContent = 'Si ya sabe la fecha, escriba el primer día para calcular el último día y el regreso. Sin fechas también se puede registrar e imprimir la comunicación.';
}

function guardarVacaciones() {
  const m = S.modal, w = S.porId.get(m.wid), d = datosDe(w);
  d.vacaciones = d.vacaciones || [];
  const tipo = $('#vTipo').value, comp = tipo === 'Compensadas en dinero', dias = Number($(comp ? '#vDiasComp' : '#vDias').value) || 0;
  if (tipo !== 'No aplica' && dias <= 0) return aviso(comp ? 'Indique cuántos días se compensaron en dinero.' : 'Indique los días.', true);
  if (comp) {
    const p = periodoVacModal(w), antes = p ? disponiblesVacModal(w, p) : 0;
    if (dias > antes) return aviso(`${p ? nombrePeriodo(p) : 'El periodo'} solo tiene ${fmtDias(antes)} día(s) disponibles: no se pueden compensar ${fmtDias(dias)}.`, true);
  }
  const r = m.regId ? d.vacaciones.find(x => x.id === m.regId) : { id: nuevoId() };
  // Compensadas: días compensados, valor y fecha de pago (en «desde»).
  Object.assign(r, comp ? { tipo, dias, desde: $('#vPago').value, valor: Number($('#vValor').value) || 0 }
    : { tipo, dias: tipo === 'No aplica' ? 0 : dias, desde: $('#vDesde').value, hasta: $('#vHasta').value });
  Object.assign(r, { soporte: $('#vSoporte').value, nota: $('#vNota').value.trim() });
  if (comp) delete r.hasta; else delete r.valor;
  delete r.periodo; delete r.anio;
  if (m.modo === 'periodos') r.periodo = +$('#vPeriodo').value; else r.anio = +$('#vPeriodo').value;
  ['desde', 'hasta', 'soporte', 'nota', 'valor'].forEach(k => { if (!r[k]) delete r[k]; });
  if (!m.regId) d.vacaciones.push(r);
  recalcular(w); guardar(`${m.regId ? 'Editar' : 'Registrar'} vacaciones de ${nombreBonito(w.nombre)}`); cerrarModal(); rerender();
}

function borrarVacaciones() {
  const m = S.modal, w = S.porId.get(m.wid), d = datosDe(w);
  if (!confirm('¿Eliminar este registro de vacaciones?')) return;
  d.vacaciones = (d.vacaciones || []).filter(r => r.id !== m.regId);
  recalcular(w); guardar(`Eliminar registro de vacaciones de ${nombreBonito(w.nombre)}`); cerrarModal(); rerender();
  avisoDeshacer('Registro de vacaciones eliminado.');
}

async function guardarNuevo() {
  const nombre = $('#nNombre').value.toUpperCase().replace(/[\\/:*?"<>|.]/g, ' ').replace(/\s+/g, ' ').trim();
  if (nombre.split(' ').length < 2) return aviso('Escriba nombres y apellidos.', true);
  const g = S.grupos.find(x => x.top === $('#nGrupo').value);
  const base = g.top + (g.conEstados ? '/Activos/' : '/') + nombre;
  if (S.porId.has(base)) return aviso('Ya existe un trabajador con ese nombre en esa área.', true);
  const tipo = tipoDeArea(g.top);
  try {
    [base, ...CARPETAS_INICIALES[tipo].map(c => base + '/' + PLANTILLAS[tipo][c])].forEach(asegurarCarpeta);
    S.datos.trabajadores[base] = { documento: $('#nDoc').value.trim(), cargo: $('#nCargo').value.trim(), fechaIngreso: $('#nIngreso').value, tipoContrato: OPC_CONTRATO[tipo][1] };
    Object.keys(S.datos.trabajadores[base]).forEach(k => { if (!S.datos.trabajadores[base][k]) delete S.datos.trabajadores[base][k]; });
    guardar(`Nuevo trabajador ${nombreBonito(nombre)}`); cerrarModal();
    await cargar();
    location.hash = linkT(S.porId.get(base), 'hoja');
    aviso('Expediente creado. Complete la hoja de vida.');
  } catch (err) { aviso('No se pudo crear: ' + err.message, true); }
}

}

async function guardarMover() {
  const m = S.modal, w = S.porId.get(m.wid);
  const d = { ...(S.datos.trabajadores[w.id] || {}) };
  if (m.aRetirados) { d.fechaRetiro = $('#mFecha').value; d.motivoRetiro = $('#mMotivo').value; }
  delete d.estado;
  let nuevo = w.id;
  try {
    if (w.estadoCarpeta) {
      const seg = w.id.split('/');
      seg[1] = m.aRetirados ? 'Retirados' : 'Activos';
      nuevo = seg.join('/');
      moverRuta(w.id, nuevo);
      delete S.datos.trabajadores[w.id];
    } else d.estado = m.aRetirados ? 'Retirado' : 'Activo';
    S.datos.trabajadores[nuevo] = d;
    if (S.carpetaSel[w.id] !== undefined) { S.carpetaSel[nuevo] = S.carpetaSel[w.id]; delete S.carpetaSel[w.id]; }
    guardar(`${m.aRetirados ? 'Retiro' : 'Reactivación'} de ${nombreBonito(w.nombre)}`); cerrarModal();
    await cargar();
    location.hash = linkT(S.porId.get(nuevo) || { id: nuevo }, 'resumen');
    rerender();
    avisoDeshacer(m.aRetirados ? 'Retiro registrado.' : 'Trabajador reactivado.');
  } catch (err) { aviso('No se pudo completar: ' + err.message, true); }
}

/* Pone el documento en la zona de impresión y abre el diálogo. El título de la pestaña es el nombre sugerido al guardar como PDF. */
function imprimirDocs(html, titulo) {
  $('#imprimir').innerHTML = html;
  document.querySelectorAll('#imprimir .doc').forEach(s => s.insertAdjacentHTML('beforeend', pieDoc()));
  const antes = document.title;
  if (titulo) document.title = titulo;
  window.addEventListener('afterprint', () => { document.title = antes; }, { once: true });
  setTimeout(() => window.print(), 150);
}

/* Número a letras en pesos colombianos: 1.750.905 → "UN MILLÓN SETECIENTOS CINCUENTA MIL NOVECIENTOS CINCO PESOS M/CTE". */
function enLetras(valor) {
  const n = Math.round(Math.abs(Number(valor) || 0));
  const U = ['', 'UN', 'DOS', 'TRES', 'CUATRO', 'CINCO', 'SEIS', 'SIETE', 'OCHO', 'NUEVE', 'DIEZ', 'ONCE', 'DOCE', 'TRECE', 'CATORCE', 'QUINCE', 'DIECISÉIS', 'DIECISIETE', 'DIECIOCHO', 'DIECINUEVE',
    'VEINTE', 'VEINTIÚN', 'VEINTIDÓS', 'VEINTITRÉS', 'VEINTICUATRO', 'VEINTICINCO', 'VEINTISÉIS', 'VEINTISIETE', 'VEINTIOCHO', 'VEINTINUEVE'];
  const D = ['', '', '', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
  const C = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];
  const cien = x => { if (x === 100) return 'CIEN'; const r = x % 100; return [C[Math.floor(x / 100)], r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' Y ' + U[r % 10] : '')].filter(Boolean).join(' '); };
  if (!n) return 'CERO PESOS M/CTE';
  const mill = Math.floor(n / 1e6), miles = Math.floor(n % 1e6 / 1000), resto = n % 1000, p = [];
  if (mill) p.push(mill === 1 ? 'UN MILLÓN' : cien(mill) + ' MILLONES');
  if (miles) p.push(miles === 1 ? 'MIL' : cien(miles) + ' MIL');
  if (resto) p.push(cien(resto));
  return p.join(' ') + (mill && !miles && !resto ? ' DE PESOS M/CTE' : ' PESOS M/CTE');
}

const fechaDocDia = s => { const d = typeof s === 'string' ? fecha(s) : s; return d ? DIAS_SEMANA[d.getDay()] + ' ' + fechaDoc(d) : ''; };

function trato(w) {
  if (w.d.sexo === 'Femenino') return { sr: 'la señora', id: 'identificada', vinc: 'vinculada', int: 'de la interesada' };

}

function imprimirConstancia(w, op) {
  const d = w.d, a = ajustes(), t = trato(w), activo = w.estado === 'Activo';
  const quien = `${t.sr} <strong>${h(w.nombre)}</strong>, ${t.id} con ${h(NOMBRE_DOC_ID[d.tipoDocumento] || 'cédula de ciudadanía')} No. <strong>${h(d.documento)}</strong>${d.lugarExpedicion ? ' expedida en ' + h(d.lugarExpedicion) : ''}`;
  const periodo = `desde el ${fechaDoc(d.fechaIngreso)}${!activo && d.fechaRetiro ? ' hasta el ' + fechaDoc(d.fechaRetiro) : ''}`;
  const valor = op.salario && d.salario ? `<strong>${h(enLetras(d.salario))} (${h(dinero(d.salario))})</strong>` : '';
  const cargo = `<strong>${h(String(d.cargo).toUpperCase())}</strong>`;
  let cuerpo;
  if (w.tipo === 'servicio') cuerpo = `Que ${quien}, ${activo ? 'presta' : 'prestó'} sus servicios a esta empresa de manera independiente, mediante contrato de prestación de servicios, ${periodo}, en la actividad de ${cargo}${valor ? `, con honorarios mensuales de ${valor}` : ''}.`;

/* --- Comunicación de vacaciones o acuerdo de compensación --- */

/* Registro para la comunicación: uno de los registrados, o un periodo con soporte en la carpeta pero sin fechas
   registradas («p:<periodo>», 15 días por confirmar). */
function registroComunicacion(w, regId) {
  if (String(regId).startsWith('p:')) {
    const v = w.c.vacaciones, k = String(regId).slice(2), p = v.periodos.find(x => String(x.k) === k);
    return p && { id: regId, tipo: 'Disfrutadas', dias: 15, [v.modo === 'periodos' ? 'periodo' : 'anio']: p.k, porConfirmar: true };
  }
  return (w.d.vacaciones || []).find(x => x.id === regId);
}
function abrirComunicacionVac(w, regId) {
  const v = w.c.vacaciones;

  const sinFechas = (v.periodos || []).filter(p => p.porConfirmar);
  if (!regs.length && !sinFechas.length) {
    cerrarModal(); location.hash = linkT(w, 'vacaciones');

    : `${r.tipo} · ${fmtDias(r.dias)} días${r.desde ? ' · sale el ' + fechaCorta(r.desde) : ' · sin fechas'}`;
  S.modal = { tipo: 'comVac', wid: w.id };
  abrirModal(`${cabModal('Comunicación de vacaciones', nombreBonito(w.nombre))}
    <div class="modal-cuerpo">
      <label class="campo">Registro de vacaciones<select id="cvReg">${regs.map(r => `<option value="${h(r.id)}" ${r.id === regId ? 'selected' : ''}>${h(etq(r))}</option>`).join('')}
        ${sinFechas.map(p => `<option value="p:${p.k}" ${regId === 'p:' + p.k ? 'selected' : ''}>${h(nombrePeriodo(p))} · 15 días · fechas sin registrar (soporte en la carpeta)</option>`).join('')}</select></label>
      <label class="campo" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="cvValor" style="width:auto" checked> Incluir el valor (el registrado; si no hay, salario básico ÷ 30 × días)</label>
      <label class="campo">Observaciones (opcional)<input id="cvNota" placeholder="Ej.: se pagan con la nómina de la primera quincena"></label>

    </div>

function imprimirComunicacionVac(w, regId, op) {
  const r = registroComunicacion(w, regId); if (!r) return;
  const v = w.c.vacaciones, d = w.d, a = ajustes(), comp = r.tipo === 'Compensadas en dinero', dias = diasReg(w, r);
  const p = v.periodos.find(x => String(x.k) === String(v.modo === 'periodos' ? r.periodo : r.anio));
  const perTxt = p ? `${nombrePeriodo(p).replace('Periodo', 'periodo')} (del ${fechaDoc(p.ini)} al ${fechaDoc(p.fin)})` : 'el periodo correspondiente';
  const valor = !op.valor ? 0 : comp && r.valor ? Number(r.valor) : d.salario ? Math.round(Number(d.salario) / 30 * dias) : 0;
  const filaValor = valor ? `<tr><th>Valor${comp && r.valor ? ' pagado' : ''}</th><td>${h(dinero(valor))} (${h(enLetras(valor))})</td></tr>` : '';
  const enBlanco = '<span class="en-blanco"></span>';

  let titulo, cuerpo;
  if (comp) {
