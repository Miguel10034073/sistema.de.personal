    titulo = 'ACUERDO DE COMPENSACIÓN DE VACACIONES EN DINERO';
    cuerpo = `<p>Entre <strong>${h(a.empresa)}</strong>${a.nit ? ', NIT ' + h(a.nit) : ''}${a.repLegal ? ', representada por ' + h(a.repLegal) : ''}, y el trabajador identificado arriba, de común acuerdo se pacta compensar en dinero ${dias ? `<strong>${fmtDias(dias)} días hábiles</strong> de ` : ''}las vacaciones del ${h(perTxt)}, conforme al artículo 189 del Código Sustantivo del Trabajo, modificado por el artículo 20 de la Ley 1429 de 2010.</p>
      <table><tr><th>Fecha de pago</th><td>${r.desde ? h(fechaDoc(r.desde)) : enBlanco}</td></tr>${dias ? `<tr><th>Días compensados</th><td>${fmtDias(dias)} días hábiles</td></tr>` : ''}${filaValor}</table>
      ${p && p.saldo > 0 ? '<p>El trabajador disfrutará en tiempo los demás días de vacaciones del periodo.</p>' : ''}`;
  } else if (r.desde) {
    const fin = finRegistro(r), regreso = diaRegreso(fin);
    titulo = 'COMUNICACIÓN DE VACACIONES';
    cuerpo = `<p>Por medio de la presente le informamos que la empresa le concede <strong>${fmtDias(r.dias)} días hábiles</strong> de vacaciones remuneradas, correspondientes al ${h(perTxt)}, de acuerdo con los artículos 186 y siguientes del Código Sustantivo del Trabajo.</p>
      <table><tr><th>Primer día de vacaciones</th><td>${h(fechaDocDia(r.desde))}</td></tr><tr><th>Último día de vacaciones</th><td>${h(fechaDocDia(fin))}</td></tr>
        <tr><th>Fecha de regreso a labores</th><td><strong>${h(fechaDocDia(regreso))}</strong></td></tr>
        <tr><th>Días</th><td>${fmtDias(r.dias)} hábiles (${Math.round((fin - fecha(r.desde)) / 86400000) + 1} calendario)</td></tr>${filaValor}</table>`;

    cuerpo = `<p>Por medio de la presente le informamos que la empresa le concede <strong>${fmtDias(r.dias)} días hábiles</strong> de vacaciones remuneradas, correspondientes al ${h(perTxt)}, de acuerdo con los artículos 186 y siguientes del Código Sustantivo del Trabajo, en las fechas que se indican a continuación.</p>

    <h1>${titulo}</h1>

/* --- Llamados de atención y descargos: llamado por escrito, citación, acta, decisión e historial --- */

/* Cuotas fijas: qué descuento completó cada cuota (los descuentos se aplican en orden a las cuotas). */
function cuotasConPagos(x) {
  const pagos = x.pagos.slice().sort((a, b) => String(a.fecha).localeCompare(String(b.fecha))), H = hoy(), filas = [];
  let iP = 0, resto = pagos.length ? Number(pagos[0].valor) || 0 : 0, saldo = x.monto;
  x.plan.forEach((c, i) => {
    let falta = c.valor, ultima = null;
    while (falta > 0 && iP < pagos.length) {
      const usa = Math.min(falta, resto); falta -= usa; resto -= usa; if (usa > 0) ultima = pagos[iP].fecha;
      if (resto <= 0) { iP++; resto = iP < pagos.length ? Number(pagos[iP].valor) || 0 : 0; }
    }
    saldo -= c.valor;
    const estado = falta <= 0 ? `Descontada el ${fechaCorta(ultima)}` : falta < c.valor ? `Parcial: faltan ${dinero(falta)}` : c.fecha < H ? 'Vencida, sin descontar' : 'Pendiente';
    filas.push({ n: i + 1, fecha: c.fecha, valor: c.valor, estado, saldo: Math.max(0, saldo) });
  });
  return filas;
}
function hojaEstadoPrestamos(w, lista, detalle) {

      <td class="r">${x.conTope ? dinero(x.monto) : 'Sin tope'}</td><td class="r">${dinero(x.pagado) || '$ 0'}</td><td class="r">${x.conTope ? dinero(x.saldo) || '$ 0' : '—'}</td><td>${h(estadoPrestamo(w, x).etq)}</td></tr>`).join('')}
    ${conTope.length > 1 ? `<tr class="total"><td colspan="2">Total</td><td class="r">${dinero(tot('monto'))}</td><td class="r">${dinero(tot('pagado')) || '$ 0'}</td><td class="r">${dinero(tot('saldo')) || '$ 0'}</td><td></td></tr>` : ''}
  </tbody></table>`;
  const detalleDe = x => {
    const p = x.p, prox = x.proxima && !x.terminado ? `Próximo descuento: ${fechaDoc(x.proxima.fecha)}${x.proxima.valor ? ' por ' + dinero(x.proxima.valor) : ''}.` : x.terminado ? 'Pagado en su totalidad.' : '';

      ${cuotasConPagos(x).map(c => `<tr><td class="c">${c.n} de ${x.plan.length}</td><td>${fechaDoc(c.fecha)}</td><td class="r">${dinero(c.valor)}</td><td>${h(c.estado)}</td><td class="r">${dinero(c.saldo) || '$ 0'}</td></tr>`).join('')}</tbody></table>`;
    else {

/* Logo de la empresa para los documentos (se guarda en la copia, por eso se limita su tamaño). */
function cargarLogo(file) {
  if (!/^image\//.test(file.type)) return aviso('Elija una imagen PNG o JPG.', true);
  if (file.size > 400 * 1024) return aviso('El logo pesa más de 400 KB. Use una imagen más liviana.', true);
  const fr = new FileReader();
  fr.onload = () => { ajustes().logo = fr.result; guardar('Logo de la empresa'); rerender(); aviso('Logo guardado. Saldrá en los documentos impresos.'); };
  fr.readAsDataURL(file);
}

function descargar(nombre, contenido, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* Nombre legible de un campo para el historial de deshacer (el texto de su etiqueta). */
function etiquetaCampo(el) {
  const l = el.closest('label');

  if (/^afiliaciones\./.test(c)) return 'Afiliación a ' + ((SISTEMAS.find(x => x.k === c.split('.')[1]) || {}).corto || 'seguridad social');
  if (/^docs\./.test(c)) return 'Estado de un documento requerido';
  return c || 'un dato';
}

/* La carpeta de copias vinculada. Antes se guardaba en el almacén de Mindala: se pasa a la configuración general. */
async function carpetaCopiasGuardada() {
  const hd = await configLeer('carpetaCopias').catch(() => null);
  if (hd) return hd;
  const vieja = await abrirBase('expediente-laboral-mindala', ['docs', 'sesion'])
    .then(db => idbEn(db, 'sesion', 'readonly', st => st.get('carpetaCopiasDir')).finally(() => db.close())).catch(() => null);
  if (vieja) await configEscribir('carpetaCopias', vieja).catch(() => {});
  return vieja || null;
}
async function elegirCarpetaCopias() {
  if (!window.showDirectoryPicker) return aviso('Este navegador no permite trabajar con carpetas. Use Edge o Chrome.', true);
  if (copiaPendiente() && !confirm('La compañía abierta tiene cambios que todavía no están en su copia .json. Siguen guardados en este navegador y se escriben la próxima vez que la abra. ¿Continuar?')) return;
  let hd;
  try { hd = await window.showDirectoryPicker({ id: 'copias', mode: 'readwrite', startIn: 'documents' }); }
  catch (e) { if (e.name !== 'AbortError') aviso('No se pudo usar esa carpeta: ' + e.message, true); return; }
  let subcarpetas = 0, sueltas = 0;
  for await (const [n, x] of hd.entries()) { if (x.kind === 'directory' && !n.startsWith('.')) subcarpetas++; else if (/\.json$/i.test(n)) sueltas++; }
  if (sueltas && !subcarpetas) return aviso(`«${hd.name}» tiene copias .json sueltas: parece la carpeta de una sola compañía. Elija la carpeta de arriba (por ejemplo «Copias de seguridad»), que tiene una subcarpeta por compañía.`, true);
  await configEscribir('carpetaCopias', hd).catch(() => {});
  await abrirCarpetaCopias(hd);
}
async function abrirCopiasGuardada() {
  const hd = await carpetaCopiasGuardada().catch(() => null);
  if (!hd) return elegirCarpetaCopias();
  const p = await hd.requestPermission({ mode: 'readwrite' }).catch(() => 'denied');
  if (p !== 'granted') return aviso('Sin permiso no se puede abrir el expediente. Pulse de nuevo y elija «Permitir».', true);
  await abrirCarpetaCopias(hd);
}
/* Botón «Reintentar» cuando la copia no se pudo escribir: recupera el permiso y vuelve a intentar. */
async function permitirCarpetaCopias() {
  const raiz = FS.raiz || await carpetaCopiasGuardada().catch(() => null);
  if (!raiz) return elegirCarpetaCopias();
  const p = await raiz.requestPermission({ mode: 'readwrite' }).catch(() => 'denied');
  if (p !== 'granted') return aviso('Sin permiso no se puede escribir la copia. Los cambios siguen guardados en este navegador.', true);
  FS.raiz = raiz; S.errorCopia = '';
  if (!FS.copias) return abrirCarpetaCopias(raiz);
  await escribirCopiaDelDia();
}

/* ---------- Compañías: una subcarpeta de copias por compañía ---------- */

/* Subcarpetas de la carpeta de copias. Con detalle, cuántas copias tiene cada una y la más reciente. */
async function listarCompanias(detalle) {
  const out = [];
  for await (const [nombre, hd] of FS.raiz.entries()) {
    if (hd.kind !== 'directory' || nombre.startsWith('.')) continue;
    const c = { nombre, copias: 0, ultima: null };
    if (detalle) for await (const [n, f] of hd.entries()) {
      if (f.kind !== 'file' || !/\.json$/i.test(n)) continue;
      const file = await f.getFile(); c.copias++;
      if (!c.ultima || file.lastModified > c.ultima.mtime) c.ultima = { nombre: n, mtime: file.lastModified, size: file.size };
    }
    out.push(c);
  }
  return out.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
}
/* Abre la carpeta de copias vinculada en la compañía pedida, la última usada o la primera. */
async function abrirCarpetaCopias(raiz, nombre) {
  FS.raiz = raiz;
  try {
    const lista = await listarCompanias();
    if (!lista.length) return pantallaSinCompanias();
    const ultima = await configLeer('compania').catch(() => null);
    const elegida = lista.find(c => c.nombre === nombre) || lista.find(c => c.nombre === ultima) || lista[0];
    await abrirCompania(elegida.nombre);
  } catch (err) {
    console.error(err);
    await pantallaInicio();
    aviso('No se pudo abrir la carpeta de copias: ' + (err.name === 'NotAllowedError' ? 'no hay permiso.'
      : err.name === 'NotFoundError' ? `«${raiz.name}» ya no está donde estaba (se movió o cambió de nombre). Pulse «Usar otra carpeta» y elíjala de nuevo; los cambios guardados en este navegador no se pierden.`
      : err.message), true);
  }
}

/* Cambia a otra compañía. Si la abierta tiene cambios sin copiar, primero escribe su copia. */
async function cambiarCompania(nombre) {

async function crearCompania(texto) {
  if (!FS.raiz) return aviso('Primero abra la carpeta de copias de seguridad.', true);
  const nombre = String(texto || '').replace(/[\\/:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^\.+|\.+$/g, '');
  if (nombre.length < 2) return aviso('Escriba el nombre de la compañía.', true);
  const lista = await listarCompanias();
  if (lista.some(c => slugCompania(c.nombre) === slugCompania(nombre))) return aviso(`Ya existe la compañía «${nombre}».`, true);
  await FS.raiz.getDirectoryHandle(nombre, { create: true });
  await cambiarCompania(nombre);
  if (COMPANIA.nombre === nombre && !S.datos) await empezarVacio(); // compañía nueva: empieza con el expediente vacío
}
/* Ventana con las compañías de la carpeta de copias, para abrir otra o crear una nueva. */
async function abrirCompanias() {
  if (!FS.raiz) return aviso('Primero abra la carpeta de copias de seguridad.', true);
  let lista;
  try { lista = await listarCompanias(true); } catch (err) { return aviso('No se pudo leer la carpeta de copias: ' + err.message, true); }
  const fila = c => {
    const actual = c.nombre === COMPANIA.nombre && S.datos;
    const det = c.copias ? `${c.copias} copia(s) · la más reciente del ${fechaCorta(new Date(c.ultima.mtime))} · ${tamano(c.ultima.size)}` : 'Sin copias todavía';
    return `<div class="compania${actual ? ' actual' : ''}"><span class="logo">${h(inicialCompania(c.nombre))}</span><div class="info"><strong>${h(c.nombre)}</strong><span class="sutil">${det}</span></div>
      ${actual ? chip('ok', 'Abierta') : `<button class="btn btn-chico btn-primario" data-accion="compania-abrir" data-nombre="${h(c.nombre)}">Abrir</button>`}</div>`;
  };
  cerrarModal();
  abrirModal(`${cabModal('Compañías', `Cada compañía tiene su propia carpeta de copias dentro de «${nombreRaiz()}»`)}
    <div class="modal-cuerpo">
      ${copiaPendiente() ? `<div class="nota info" style="margin:0">${h(COMPANIA.nombre)} tiene cambios sin copiar: al cambiar de compañía, primero se escribe su copia (tarda unos segundos).</div>` : ''}
      <div class="companias">${lista.map(fila).join('') || '<div class="vacio">No hay compañías todavía.</div>'}</div>
      <div style="border-top:1px solid var(--borde);padding-top:14px">
        <label class="campo">Nueva compañía<span style="display:flex;gap:8px"><input id="ncNombre" placeholder="Nombre, por ejemplo: Sindi Por Do Sol SAS"><button class="btn" data-accion="compania-crear">Crear</button></span></label>
        <p class="sutil" style="margin:6px 0 0">Se crea la subcarpeta «${h(nombreRaiz())} / nombre» y la compañía empieza con un expediente vacío.</p>
      </div>
    </div>`);
  S.modal = { tipo: 'companias' };
}
function pantallaSinCompanias() {
  document.body.classList.add('sin-sesion');
  $('#principal').innerHTML = `<div class="inicio">${marcaInicio()}<div class="tarjeta tarjeta-cuerpo">
    <h2>«${h(nombreRaiz())}» no tiene compañías todavía</h2>
    <p class="muted">Escriba el nombre de la primera compañía: se crea una subcarpeta para sus copias y empieza con un expediente vacío.</p>
    <div class="acciones"><input id="ncNombre" placeholder="Nombre de la compañía" style="flex:1;min-width:200px"><button class="btn btn-primario" data-accion="compania-crear">Crear compañía</button><button class="btn" data-accion="elegir-copias">Usar otra carpeta</button></div>
  </div></div>`;
}

/* Abre la carpeta de copias: sigue con lo guardado en el navegador si corresponde a la última copia (o tiene cambios
   que aún no se escribieron); si no, carga la copia .json más reciente. */
async function abrirCopias(hd) {
  FS.copias = hd; FS.docs = null; S.copiasCarpeta = hd.name; S.errorCopia = '';
  cerrarModal();
  pantallaProgreso('Abriendo el expediente', `Buscando la copia más reciente en «${hd.name}»…`);
  try {
    const copias = await listarCopiasJson(), ultima = copias[copias.length - 1];
    await leerCarpetaDocs();
    const ses = await sesionLeer().catch(() => null);
    const sesValida = ses && ses.version === VERSION_SESION && ses.datos;
    if (sesValida && (ses.meta.sucio || (ultima && ses.meta.origen === ultima.nombre && ses.meta.copiaEn && ultima.mtime <= Date.parse(ses.meta.copiaEn) + 120000))) {
      S.datos = normalizarDatos(ses.datos);
      S.idx = { carpetas: ses.carpetas || [], archivos: ses.archivos || [] };
      S.meta = { ...ses.meta }; S.sucio = !!ses.meta.sucio; S.cambios = ses.meta.cambios || 0;
      await histIniciar(true);
      await entrar();
      if (S.sucio) { aviso('Había cambios guardados en el navegador que aún no estaban en la copia .json: se escriben ahora.'); programarCopia(3000); }
      else await convertirSiHaceFalta();
      return;
    }
    if (!ultima) return pantallaSinCopias();
    if (await cargarCopia(ultima.file, ultima.nombre)) await convertirSiHaceFalta();
  } catch (err) {
    console.error(err);
    await pantallaInicio();
    aviso('No se pudo abrir la carpeta de copias: ' + (err.name === 'NotAllowedError' ? 'no hay permiso.' : err.message), true);
  }
}
/* Abre una copia .json y la deja lista para trabajar. Las nuevas (versión 3) solo leen la cabecera: los documentos se
   quedan en «Documentos». Las antiguas (versión 2) traen los documentos dentro y se cargan en el navegador.
   Devuelve true si la copia quedó abierta. */
async function cargarCopia(file, nombre) {
  pantallaProgreso('Abriendo la copia de seguridad', nombre);
  const t0 = Date.now();
  let ult = 0;
  try {
    const cab = await cabeceraDeCopia(file);
    const nueva = (cab.version || 0) >= VERSION_COPIA;
    if (nueva && !FS.docs) await leerCarpetaDocs();
    const r = nueva ? await importarCopiaCarpeta(cab) : await importarCopia(file, (leidos, docs) => {
      if (Date.now() - ult < 200) return; ult = Date.now();
      marcarProgreso(leidos / file.size, `${nombre} · ${tamano(leidos)} de ${tamano(file.size)} · ${docs.toLocaleString('es-CO')} documentos`);
    });
    const faltan = new Set(r.faltantes.map(a => a.id));
    S.datos = normalizarDatos(r.cab.datos);
    if (S.datos.papelera) S.datos.papelera = S.datos.papelera.filter(p => r.presentes.has(p.id)); // la papelera solo con lo que se puede restaurar
    // En las copias nuevas, un documento que falta en la carpeta se deja en el índice (puede estar bajando de OneDrive).
    S.idx = { carpetas: r.cab.carpetas || [], archivos: (r.cab.archivos || []).filter(a => nueva || !faltan.has(a.id)) };
    S.meta = { origen: nombre, copiaEn: new Date(file.lastModified).toISOString(), cargada: new Date().toISOString() };
    S.sucio = false; S.cambios = 0;
    await histIniciar(false);
    await guardarSesion();
    await entrar();
    aviso(`Copia abierta: ${nombre} · ${S.idx.archivos.length.toLocaleString('es-CO')} documentos en ${Math.round((Date.now() - t0) / 1000)} s.`);
    if (r.faltantes.length) aviso(nueva ? `${r.faltantes.length} documento(s) del índice no están en la carpeta «${CARPETA_DOCS}». Si OneDrive todavía está sincronizando, espere y vuelva a abrir la página.`
      : `${r.faltantes.length} documento(s) del índice no venían dentro de la copia y se omitieron.`, true);
    return true;
  } catch (err) {
    console.error(err);
    await pantallaInicio();
    aviso('No se pudo abrir la copia: ' + err.message, true);
    return false;
  }
}
/* Si lo abierto tiene documentos que todavía no están en «Documentos» (por ejemplo, al abrir por primera vez una copia
   antigua, con los documentos dentro del .json), se escribe enseguida la copia de esta hora para pasarlos a la carpeta. */
async function convertirSiHaceFalta() {
  const ids = new Set(S.idx.archivos.concat(S.datos.papelera || []).map(a => a.id));
  const claves = await idb('docs', 'readonly', st => st.getAllKeys());
  const porPasar = claves.filter(k => ids.has(k) && !S.docsCarpeta.has(k)).length;
  if (!porPasar) return;
  S.sucio = true; S.cambios++;
  await guardarSesion();
  actualizarEstadoCopia();
  aviso(`Pasando la copia al formato nuevo: ${porPasar.toLocaleString('es-CO')} documento(s) se guardan como archivos en «${S.copiasCarpeta} / ${CARPETA_DOCS}». La primera vez tarda cerca de un minuto; después cada copia tarda segundos.`);
  programarCopia(1500);
}
function pantallaSinCopias() {
  document.body.classList.add('sin-sesion');
  $('#principal').innerHTML = `<div class="inicio">${marcaInicio()}<div class="tarjeta tarjeta-cuerpo">
    <h2>${h(COMPANIA.nombre)} todavía no tiene copias</h2>
    <p class="muted">Su carpeta «${h(FS.raiz ? nombreRaiz() + ' / ' : '')}${h(S.copiasCarpeta)}» no tiene copias .json. Empiece su expediente vacío: la primera copia se escribe en esa carpeta.</p>
    <div class="acciones"><button class="btn btn-primario" data-accion="empezar-vacio">Empezar el expediente de ${h(COMPANIA.nombre)}</button><button class="btn" data-accion="companias">Cambiar de compañía</button></div>
  </div></div>`;
}
async function empezarVacio() {
  S.datos = normalizarDatos({});
  S.idx = { carpetas: [], archivos: [] };
  S.carpetasSet = new Set();
  GRUPOS_INICIALES.forEach(asegurarCarpeta);
  S.meta = { origen: nombreCopia(), cargada: new Date().toISOString() }; S.cambios = 1; S.sucio = true;
  await histIniciar(false);
  await guardarSesion();
  await entrar();
  programarCopia(1000);
}
/* «Abrir otra copia» (Ajustes): para volver a una copia anterior. */
async function elegirOtraCopia() {
  if (!FS.copias) return aviso('Primero abra la carpeta de copias.', true);
  if (window.showOpenFilePicker) {
    try {
      const [hd] = await window.showOpenFilePicker({ startIn: FS.copias, types: [{ description: 'Copia de seguridad del expediente', accept: { 'application/json': ['.json'] } }] });
      return abrirOtraCopia(await hd.getFile());
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  $('#archivoCopia').click();
}
async function abrirOtraCopia(file) {
  if (!/\.json$/i.test(file.name)) return aviso('Seleccione una copia .json del expediente.', true);
  if (!file.name.startsWith(`Expediente ${COMPANIA.nombre} `) && !confirm(`«${file.name}» no parece una copia de ${COMPANIA.nombre}. Si es de otra compañía, ábrala desde «Cambiar de compañía».\n\n¿Abrirla de todos modos como copia de ${COMPANIA.nombre}?`)) return;
  if (!confirm(`Se abrirá «${file.name}» en lugar de lo que tiene abierto ahora.${S.sucio ? ' Antes se escribirán en la copia de esta hora los cambios pendientes.' : ''}\n\nSi después hace cambios, se guardarán en la copia de la hora en que los haga (por ejemplo «${nombreCopia()}»); las demás copias no se tocan.\n\n¿Continuar?`)) return;
  if (S.sucio) { await escribirCopiaDelDia(); if (S.sucio) return aviso('No se pudo escribir antes la copia de esta hora; no se abrió la otra copia.', true); }
  await cargarCopia(file, file.name);
}

async function entrar() {
  document.body.classList.remove('sin-sesion');
  podarPapelera();
  await cargar();
  actualizarEstadoCopia(); actualizarBotonesHist();
  if (!location.hash || location.hash === '#') location.hash = '#/panel';
  render();
}

/* Si se cierra la pestaña con cambios que aún no están en la copia .json, el navegador pide confirmación.
   (Los cambios no se pierden: quedan en el navegador y se escriben la próxima vez que se abra la página). */
window.addEventListener('beforeunload', e => {
  if (!copiaPendiente()) return;
  e.preventDefault(); e.returnValue = '';
  // Si la persona elige quedarse, la copia se escribe enseguida y se avisa cuándo ya se puede cerrar.
  setTimeout(() => { if (copiaPendiente()) copiaAntesDeSalir('cerrar'); }, 400);
});

/* ---------- Copia antes de cerrar o actualizar ----------
   El navegador no deja que una página demore su cierre, y la copia tarda unos segundos (o más, si hay muchos documentos nuevos). Por eso:
   - Al actualizar con F5 o Ctrl+R (⌘R), primero se escribe la copia y luego la página se actualiza sola.
   - Al cerrar la pestaña o usar el botón de actualizar del navegador, este pregunta si desea salir. Si se elige quedarse,
     la copia se escribe enseguida y la página avisa cuando ya se puede cerrar. Si se elige salir, los cambios siguen en
     el navegador y la copia se escribe la próxima vez que se abra la página. */
const copiaPendiente = () => !!S.datos && (S.sucio || !!S.copiando);
function pintarSalida(titulo, texto, progreso, botones = '') {
  cerrarModal();
  abrirModal(`<div class="modal-cab"><div><h2>${h(titulo)}</h2></div></div>
    <div class="modal-cuerpo"><p style="margin:0">${h(texto)}</p>${progreso ? '<div class="barra" style="height:10px"><div id="salidaBarra" style="width:0%"></div></div><div class="sutil" id="salidaTexto">Preparando la copia…</div>' : ''}</div>
    ${botones ? `<div class="modal-pie">${botones}</div>` : ''}`);
  S.modal = { tipo: 'salida' };
}
/* motivo: 'actualizar', 'cerrar' o 'cambiar' (de compañía, hacia destino). Devuelve true si la copia quedó al día. */
async function copiaAntesDeSalir(motivo, destino) {
  if (S.saliendo) return false;
  if (!copiaPendiente()) { if (motivo === 'actualizar') location.reload(); return true; }
  S.saliendo = motivo;
  pintarSalida(`Guardando la copia antes de ${motivo === 'actualizar' ? 'actualizar' : motivo === 'cambiar' ? 'cambiar de compañía' : 'cerrar'}`, 'Se está escribiendo la copia de esta hora con los últimos cambios. Tarda unos segundos (más si hay muchos documentos nuevos): no cierre la pestaña.', true);
  try {
    for (let i = 0; i < 3 && copiaPendiente() && !S.errorCopia; i++) {
      while (S.copiando) await new Promise(r => setTimeout(r, 400)); // si ya se estaba escribiendo, se espera a que termine
      if (S.sucio) await escribirCopiaDelDia();
    }
  } finally { S.saliendo = null; }
  if (!copiaPendiente()) {
    if (motivo === 'cambiar') return true;
    if (motivo === 'actualizar') { pintarSalida('✓ Copia al día', 'Actualizando la página…'); location.reload(); return true; }
    pintarSalida('✓ Copia al día', 'La copia de esta hora ya tiene todos los cambios. Puede cerrar la pestaña.', false, '<button class="btn" data-accion="cerrar-modal">Seguir trabajando</button>');
    return true;
  }
  const error = S.errorCopia ? S.errorCopia.charAt(0).toUpperCase() + S.errorCopia.slice(1) + '. ' : '';
  if (motivo === 'cambiar') pintarSalida('No se pudo escribir la copia', `${error}Para no dejar cambios sin copiar, no se cambió de compañía. Los cambios siguen guardados en este navegador.`, false,
    `<button class="btn" data-accion="cerrar-modal">Seguir trabajando</button><button class="btn btn-primario" data-accion="compania-reintentar" data-nombre="${h(destino)}">Reintentar</button>`);
  else pintarSalida('No se pudo escribir la copia', `${error}Los cambios siguen guardados en este navegador: si cierra ahora, la copia se escribe la próxima vez que abra la página.`, false,
    `<button class="btn" data-accion="cerrar-modal">Seguir trabajando</button><button class="btn btn-primario" data-accion="salida-reintentar" data-motivo="${motivo}">Reintentar</button>`);
  return false;
}

/* Arrastrar y soltar archivos sobre el expediente o sobre la ventana de adjuntar. */
document.addEventListener('dragover', e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
  document.querySelectorAll('[data-soltar]').forEach(z => z.classList.toggle('encima', z.contains(e.target)));
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.querySelectorAll('[data-soltar]').forEach(z => z.classList.remove('encima')); });
document.addEventListener('drop', e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  const archivos = [...e.dataTransfer.files];
  if (document.body.classList.contains('sin-sesion')) { aviso('Primero abra la carpeta de copias de seguridad.', true); return; }
  if (S.modal && S.modal.tipo === 'subir') { S.modal.archivos = archivos; pintarSubir(); return; }
  const [v, id] = ruta();
  const w = v === 't' ? S.porId.get(id) : null;
  if (!w) return aviso('Abra el expediente de un trabajador para adjuntar archivos.', true);
  const zona = e.target.closest('[data-soltar]');
  abrirSubir(w, { archivos, tipo: zona && zona.dataset.tipo, categoria: zona && zona.dataset.categoria });
});

window.addEventListener('hashchange', () => { if (!S.datos || document.body.classList.contains('sin-sesion')) return; window.scrollTo(0, 0); render(); });

pintarMenu();
$('#teclaBuscar').textContent = TECLA === '⌘' ? '⌘K' : 'Ctrl K';
(async () => {
  try { await abrirConfig(); }
  catch (err) {
    document.body.classList.add('sin-sesion');
    $('#principal').innerHTML = `<div class="inicio"><div class="nota">Este navegador no permite guardar información local (${h(err.message)}). Abra el archivo con Microsoft Edge o Google Chrome.</div></div>`;
    return;
  }
  if (window.showDirectoryPicker) {
    const hd = await carpetaCopiasGuardada().catch(() => null);
    if (hd && (await hd.queryPermission({ mode: 'readwrite' }).catch(() => '')) === 'granted') return abrirCarpetaCopias(hd);
  }
  pantallaInicio();
})();

</script>
