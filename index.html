<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expediente laboral</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6f4a'/%3E%3Cpath d='M9 22V10h3l4 6 4-6h3v12h-3v-7l-4 6-4-6v7z' fill='white'/%3E%3C/svg%3E">
<style>
/* ===== Diseño 02 · Expediente laboral ===== */
:root {
  --fondo: #f2f4f7;
  --superficie: #ffffff;
  --superficie-2: #f7f9fb;
  --superficie-3: #eef2f6;
  --borde: #e3e8ee;
  --borde-fuerte: #cdd5df;
  --texto: #101828;
  --texto-2: #475467;
  --texto-3: #8a96a8;
  --marca: #17694a;
  --marca-fuerte: #0f5138;
  --marca-2: #e7f3ec;
  --marca-texto: #ffffff;
  --dorado: #c8962e;
  --ok: #157a4b;      --ok-fondo: #e4f4eb;
  --reg: #1f6a99;     --reg-fondo: #e5f0f8;
  --pend: #c0362c;    --pend-fondo: #fdecea;
  --aviso: #9a5800;   --aviso-fondo: #fff3dc;
  --info: #52627a;    --info-fondo: #eef1f6;
  --na: #8a96a8;      --na-fondo: #f1f3f6;
  --lateral: #0e2a1f;
  --lateral-borde: rgba(255, 255, 255, .08);
  --lateral-texto: #bfd0c6;
  --lateral-texto-2: #7d978a;
  --sombra-1: 0 1px 2px rgba(16, 24, 40, .05);
  --sombra: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
  --sombra-2: 0 16px 40px -12px rgba(16, 24, 40, .25), 0 4px 10px -4px rgba(16, 24, 40, .08);
  --radio: 12px;
  --fuente: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0b110e; --superficie: #131b17; --superficie-2: #18221d; --superficie-3: #1e2a24; --borde: #25322b; --borde-fuerte: #33433a;
    --texto: #e7eeea; --texto-2: #a4b3ab; --texto-3: #6f8077; --marca: #4fb487; --marca-fuerte: #6fd3a0; --marca-2: #16352a; --marca-texto: #06130c;
    --ok: #6fd3a0; --ok-fondo: #173627; --reg: #7cc0e0; --reg-fondo: #172f3d; --pend: #f28b80; --pend-fondo: #3d1d1a;
    --aviso: #f0c063; --aviso-fondo: #3a2e15; --info: #a9b6c2; --info-fondo: #222b33; --na: #6f8077; --na-fondo: #1e2622;
    --lateral: #07120d; --sombra: 0 1px 2px rgba(0, 0, 0, .35); --sombra-2: 0 16px 40px -12px rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #0b110e; --superficie: #131b17; --superficie-2: #18221d; --superficie-3: #1e2a24; --borde: #25322b; --borde-fuerte: #33433a;
  --texto: #e7eeea; --texto-2: #a4b3ab; --texto-3: #6f8077; --marca: #4fb487; --marca-fuerte: #6fd3a0; --marca-2: #16352a; --marca-texto: #06130c;
  --ok: #6fd3a0; --ok-fondo: #173627; --reg: #7cc0e0; --reg-fondo: #172f3d; --pend: #f28b80; --pend-fondo: #3d1d1a;
  --aviso: #f0c063; --aviso-fondo: #3a2e15; --info: #a9b6c2; --info-fondo: #222b33; --na: #6f8077; --na-fondo: #1e2622;
  --lateral: #07120d; --sombra: 0 1px 2px rgba(0, 0, 0, .35); --sombra-2: 0 16px 40px -12px rgba(0, 0, 0, .6); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--fondo); color: var(--texto); font: 13.5px/1.5 var(--fuente); -webkit-font-smoothing: antialiased; }
a { color: var(--marca); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.015em; color: var(--texto); }
h1 { font-size: 22px; line-height: 1.25; }
h2 { font-size: 14.5px; }
h3 { font-size: 14px; }
.muted { color: var(--texto-2); }
.sutil { color: var(--texto-3); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.ico { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: -3px; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.lateral { background: var(--lateral); color: var(--lateral-texto); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.marca { display: flex; gap: 12px; align-items: center; padding: 20px 18px; border-bottom: 1px solid var(--lateral-borde); }
.marca strong { display: block; font-size: 14px; color: #fff; letter-spacing: -.01em; line-height: 1.3; }
.marca span { font-size: 10.5px; color: var(--lateral-texto-2); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(140deg, #34a06e, #12553a); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 2px 8px rgba(0, 0, 0, .25); }
#menu { padding: 10px 10px 14px; overflow-y: auto; flex: 1; }
#menu a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--lateral-texto); font-size: 13.5px; font-weight: 500; position: relative; margin: 1px 0; }
#menu a .ico { opacity: .8; }
#menu a:hover { background: rgba(255, 255, 255, .06); color: #fff; text-decoration: none; }
#menu a.activo { background: rgba(79, 180, 135, .16); color: #fff; font-weight: 600; }
#menu a.activo .ico { opacity: 1; color: #7fd6ac; }
#menu a.activo::before { content: ''; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: #4fb487; }
#menu .cuenta { margin-left: auto; font-size: 11px; font-weight: 650; padding: 0 7px; border-radius: 999px; background: rgba(255, 255, 255, .09); color: var(--lateral-texto); line-height: 18px; font-variant-numeric: tabular-nums; }
#menu .cuenta.alta { background: #d6453a; color: #fff; }
#menu .cuenta:empty { display: none; }
.menu-titulo { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--lateral-texto-2); padding: 18px 10px 6px; font-weight: 650; }
.pie-lateral { padding: 14px 18px; border-top: 1px solid var(--lateral-borde); font-size: 11.5px; color: var(--lateral-texto-2); display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.columna { min-width: 0; display: flex; flex-direction: column; }
.barra-sup { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 28px; min-height: 60px; background: color-mix(in srgb, var(--superficie) 90%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--borde); }
.migas { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texto-3); min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; }
.migas > * { flex: none; }
.migas > a:not(:first-child), .migas > span:not(.sep), .migas > strong { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.migas a { color: var(--texto-2); display: inline-flex; }
.migas a:hover { color: var(--marca); text-decoration: none; }
.migas .sep { color: var(--borde-fuerte); }
.migas strong { color: var(--texto); font-weight: 600; }
.barra-acciones { display: flex; align-items: center; gap: 10px; flex: none; }
.buscador { display: flex; align-items: center; gap: 8px; background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 9px; padding: 0 8px 0 10px; height: 36px; width: 290px; color: var(--texto-3); cursor: text; }
.buscador:focus-within { border-color: var(--marca); box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 16%, transparent); background: var(--superficie); }
.buscador input { border: 0; background: none; padding: 0; height: 100%; font-size: 13px; box-shadow: none; }
.buscador input:focus { outline: none; box-shadow: none; }
kbd { font: 600 10.5px/1 var(--fuente); border: 1px solid var(--borde-fuerte); border-bottom-width: 2px; border-radius: 5px; padding: 3px 5px; color: var(--texto-3); background: var(--superficie); white-space: nowrap; }
.deshacer { display: flex; border: 1px solid var(--borde); border-radius: 9px; overflow: hidden; background: var(--superficie); box-shadow: var(--sombra-1); }
.btn-icono { font: inherit; font-size: 12.5px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px; border: 0; background: none; color: var(--texto-2); cursor: pointer; }
.btn-icono + .btn-icono { border-left: 1px solid var(--borde); }
.btn-icono:hover:not(:disabled) { background: var(--superficie-2); color: var(--texto); }
.btn-icono:disabled { opacity: .4; cursor: default; }
.estado-sistema { display: flex; align-items: center; gap: 8px; }
.guardado { display: flex; align-items: center; gap: 8px; }
.guardado:empty { display: none; }
.pildora { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.p-ok { background: var(--ok-fondo); color: var(--ok); }
.p-media { background: var(--aviso-fondo); color: var(--aviso); }
.p-media .punto { animation: late 1.6s ease-in-out infinite; }
.p-alta { background: var(--pend-fondo); color: var(--pend); }
@keyframes late { 50% { opacity: .35; } }

.principal { padding: 26px 28px 64px; min-width: 0; width: 100%; max-width: 1480px; }
.cargando { padding: 60px; text-align: center; color: var(--texto-2); }
.encabezado { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.encabezado h1 { font-size: 24px; }
.encabezado p { margin: 6px 0 0; color: var(--texto-2); max-width: 780px; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Componentes ---------- */
.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); }
.tarjeta-cuerpo { padding: 18px 20px; }
.tarjeta-titulo { display: flex; justify-content: space-between; align-items: center; padding: 13px 20px; min-height: 52px; border-bottom: 1px solid var(--borde); gap: 10px; flex-wrap: wrap; }
.tarjeta-titulo h2 { display: flex; align-items: center; gap: 9px; }
.tarjeta-titulo h2 .ico { color: var(--texto-3); }
.rejilla { display: grid; gap: 16px; }
.rejilla-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.rejilla-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.rejilla-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.rejilla-panel { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); margin-top: 16px; }
.rejilla-resumen { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.kpi { padding: 18px 20px; }
.kpi-cab { display: flex; align-items: center; gap: 10px; }
.kpi-ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.kpi-ico .ico { width: 18px; height: 18px; }
.t-verde { background: var(--ok-fondo); color: var(--ok); }
.t-azul { background: var(--reg-fondo); color: var(--reg); }
.t-rojo { background: var(--pend-fondo); color: var(--pend); }
.t-ambar { background: var(--aviso-fondo); color: var(--aviso); }
.t-gris { background: var(--info-fondo); color: var(--info); }
.kpi .valor { font-size: 30px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 12px; }
.kpi .etq { color: var(--texto-2); font-size: 12.5px; font-weight: 600; }
.kpi .det { color: var(--texto-3); font-size: 12px; margin-top: 6px; }
.kpi.alerta .valor { color: var(--pend); }

.btn { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--borde-fuerte); background: var(--superficie); color: var(--texto); padding: 0 13px; min-height: 34px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; box-shadow: var(--sombra-1); transition: background .12s, border-color .12s, box-shadow .12s; }
.btn:hover { background: var(--superficie-2); border-color: var(--texto-3); text-decoration: none; }
.btn:focus-visible, .btn-icono:focus-visible { outline: 3px solid color-mix(in srgb, var(--marca) 30%, transparent); outline-offset: 1px; }
.btn-primario { background: var(--marca); border-color: var(--marca-fuerte); color: var(--marca-texto); box-shadow: 0 1px 2px rgba(16, 24, 40, .14), inset 0 1px 0 rgba(255, 255, 255, .14); }
.btn-primario:hover { background: var(--marca-fuerte); border-color: var(--marca-fuerte); }
.btn-claro { background: var(--superficie-2); }
.btn-peligro { color: var(--pend); }
.btn-peligro:hover { background: var(--pend-fondo); border-color: color-mix(in srgb, var(--pend) 40%, transparent); }
.btn-chico { min-height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
.btn-bloque { width: 100%; justify-content: center; }
.btn:disabled { opacity: .5; cursor: default; }
.enlace { background: none; border: 0; padding: 0; color: var(--marca); cursor: pointer; font: inherit; font-weight: 550; }
.enlace:hover { text-decoration: underline; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; line-height: 20px; }
.e-ok { background: var(--ok-fondo); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 16%, transparent); }
.e-reg, .e-liq, .e-gen { background: var(--reg-fondo); color: var(--reg); border-color: color-mix(in srgb, var(--reg) 16%, transparent); }
.e-pend { background: var(--pend-fondo); color: var(--pend); border-color: color-mix(in srgb, var(--pend) 18%, transparent); }
.e-parcial, .e-sin, .e-curso { background: var(--aviso-fondo); color: var(--aviso); border-color: color-mix(in srgb, var(--aviso) 18%, transparent); }
.e-prox, .e-anticipadas { background: var(--info-fondo); color: var(--info); border-color: color-mix(in srgb, var(--info) 14%, transparent); }
.e-na { background: var(--na-fondo); color: var(--na); border-color: var(--borde); }
.punto { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
.n-alta { color: var(--pend); } .n-media { color: var(--aviso); } .n-baja { color: var(--info); }

.filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.segmentado { display: inline-flex; background: var(--superficie-3); border: 1px solid var(--borde); border-radius: 9px; padding: 3px; gap: 2px; }
.segmentado button { font: inherit; font-size: 12.5px; font-weight: 600; border: 0; background: none; padding: 4px 12px; border-radius: 7px; cursor: pointer; color: var(--texto-2); }
.segmentado button:hover { color: var(--texto); }
.segmentado button.activo { background: var(--superficie); color: var(--texto); box-shadow: var(--sombra); }
.segmentado .n { color: var(--texto-3); font-weight: 500; margin-left: 5px; font-variant-numeric: tabular-nums; }
input, select, textarea { font: inherit; font-size: 13.5px; color: var(--texto); background: var(--superficie); border: 1px solid var(--borde-fuerte); border-radius: 8px; padding: 0 10px; height: 36px; width: 100%; box-shadow: var(--sombra-1); transition: border-color .12s, box-shadow .12s; }
textarea { height: auto; padding: 8px 10px; resize: vertical; min-height: 80px; }
input[type=checkbox], input[type=radio] { width: 16px; height: 16px; padding: 0; box-shadow: none; accent-color: var(--marca); }
input[type=file] { height: auto; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--marca); box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 16%, transparent); }
input:disabled { background: var(--superficie-2); color: var(--texto-2); }
.filtros input, .filtros select { width: auto; }
.buscar { min-width: 240px; }
label.campo { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--texto-2); }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 18px; }
.form .ancho { grid-column: 1 / -1; }
.seccion-form { padding: 20px 24px; border-bottom: 1px solid var(--borde); }
.seccion-form:last-child { border-bottom: 0; }
.seccion-form h3 { margin-bottom: 14px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--texto-2); font-weight: 700; }

/* ---------- Tablas ---------- */
.tabla-env { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th { text-align: left; font-weight: 650; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--texto-3); padding: 10px 14px; border-bottom: 1px solid var(--borde); background: var(--superficie-2); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.clic { cursor: pointer; }
tbody tr:hover td { background: color-mix(in srgb, var(--superficie-2) 70%, transparent); }
tbody tr.clic:hover td { background: var(--superficie-2); }
td.centro, th.centro { text-align: center; }
td.num { white-space: nowrap; }
.persona { display: flex; align-items: center; gap: 11px; min-width: 230px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--marca-2); color: var(--marca); display: grid; place-items: center; font-weight: 650; font-size: 12px; flex: none; overflow: hidden; letter-spacing: .02em; }
.avatar[class*="av-"] { background: color-mix(in srgb, var(--c) 15%, var(--superficie)); color: var(--c); }
.av-0 { --c: #1f8a5b; } .av-1 { --c: #2f6fbf; } .av-2 { --c: #b7791f; } .av-3 { --c: #8b4fc0; } .av-4 { --c: #c2414f; } .av-5 { --c: #1b8796; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.grande { width: 72px; height: 72px; font-size: 24px; box-shadow: 0 0 0 4px var(--superficie), 0 0 0 5px var(--borde); }
.persona strong { display: block; font-weight: 600; font-size: 13.5px; }
.celda { font-family: inherit; cursor: pointer; min-width: 104px; }
.celda:hover { filter: brightness(.97); box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 20%, transparent); }
.contador { display: inline-flex; gap: 6px; }
.contador .chip { min-width: 26px; justify-content: center; }

/* ---------- Ficha ---------- */
.tarjeta.ficha { overflow: hidden; }
.ficha-banda { height: 5px; background: linear-gradient(90deg, var(--marca) 0%, #4fb487 55%, var(--dorado) 100%); }
.ficha-cab { display: flex; gap: 18px; align-items: center; padding: 20px 24px; flex-wrap: wrap; }
.ficha-cab .info { flex: 1; min-width: 260px; }
.ficha-titulo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ficha-cab h1 { font-size: 22px; }
.ficha-cab .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--texto-2); font-size: 13.5px; margin-top: 4px; align-items: center; }
.ficha-datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--borde); background: var(--superficie-2); }
.ficha-datos > div { padding: 12px 24px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--borde); min-width: 0; }
.ficha-datos > div:last-child { border-right: 0; }
.ficha-datos span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--texto-3); font-weight: 650; }
.ficha-datos strong { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pestanas { display: flex; gap: 0; border-top: 1px solid var(--borde); padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
.pestanas::-webkit-scrollbar { display: none; }
.pestanas a { padding: 12px 8px 11px; flex: none; color: var(--texto-2); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.pestanas a:hover { color: var(--texto); text-decoration: none; }
.pestanas a.activo { color: var(--marca); border-bottom-color: var(--marca); }
.pestanas .badge { background: var(--pend-fondo); color: var(--pend); border-radius: 999px; font-size: 10.5px; font-weight: 700; padding: 0 6px; line-height: 17px; }
.lista-alertas { list-style: none; margin: 0; padding: 0; }
.lista-alertas li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 20px; border-bottom: 1px solid var(--borde); }
.lista-alertas li:last-child { border-bottom: 0; }
.lista-alertas .punto { margin-top: 7px; flex: none; width: 7px; height: 7px; }
.vacio { padding: 30px 20px; text-align: center; color: var(--texto-3); }
.dato { display: flex; flex-direction: column; gap: 2px; }
.dato span { font-size: 11px; color: var(--texto-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 650; }
.dato strong { font-weight: 600; font-size: 15px; }
.nota { background: var(--aviso-fondo); color: var(--aviso); padding: 11px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; border: 1px solid color-mix(in srgb, var(--aviso) 20%, transparent); border-left: 3px solid var(--aviso); }
.nota.info { background: var(--info-fondo); color: var(--info); border-color: color-mix(in srgb, var(--info) 16%, transparent); border-left-color: var(--info); }
.archivos { display: flex; flex-direction: column; gap: 2px; }
.archivo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 12px; row-gap: 1px; align-items: center; padding: 8px 10px; border-radius: 9px; border: 1px solid transparent; }
.archivo > .ext { grid-column: 1; grid-row: 1 / span 2; }
.archivo > .nombre { grid-column: 2; grid-row: 1; }
.archivo > .meta-archivo { grid-column: 2; grid-row: 2; display: flex; gap: 4px 10px; flex-wrap: wrap; }
.archivo > .meta-archivo:empty { display: none; }
.archivo > .acc { grid-column: 3; grid-row: 1 / span 2; }
.archivo:hover { background: var(--superficie-2); border-color: var(--borde); }
.archivo .ext { font-size: 9.5px; font-weight: 750; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-2); background: var(--superficie-3); border-radius: 5px; padding: 3px 5px; min-width: 38px; text-align: center; flex: none; }
.archivo .ext-pdf { color: #b42318; background: #fdecea; }
.archivo .ext-jpg, .archivo .ext-jpeg, .archivo .ext-png, .archivo .ext-webp, .archivo .ext-gif { color: #6941c6; background: #f1ebfc; }
.archivo .ext-docx, .archivo .ext-doc { color: #175cd3; background: #e7effc; }
.archivo .ext-xlsx, .archivo .ext-csv { color: #067647; background: #e3f6ec; }
.archivo .nombre { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; justify-self: start; max-width: 100%; }
.archivo .acc { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; opacity: .55; transition: opacity .12s; }
.archivo:hover .acc { opacity: 1; }
.soportes { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 380px; }
.carpetas { border-right: 1px solid var(--borde); padding: 10px; background: var(--superficie-2); border-radius: var(--radio) 0 0 var(--radio); }
.carpetas button { display: flex; justify-content: space-between; width: 100%; text-align: left; font: inherit; font-size: 13px; border: 0; background: none; padding: 7px 10px; border-radius: 7px; cursor: pointer; color: var(--texto); }
.carpetas button:hover { background: var(--superficie-3); }
.carpetas button.activo { background: var(--superficie); color: var(--marca); font-weight: 650; box-shadow: var(--sombra); }
.zona-soltar { border: 1.5px dashed var(--borde-fuerte); border-radius: 10px; padding: 20px; text-align: center; color: var(--texto-2); cursor: pointer; transition: .15s; background: var(--superficie-2); }
.zona-soltar.encima, .zona-soltar:hover { border-color: var(--marca); background: var(--marca-2); color: var(--marca); }
.subtitulo { font-size: 10.5px; color: var(--texto-3); text-transform: uppercase; letter-spacing: .08em; margin: 14px 10px 6px; font-weight: 650; }
.periodos td { white-space: nowrap; }
.fechas-vac { padding: 4px 0; }
.fechas-vac + .fechas-vac { border-top: 1px dashed var(--borde); }
.tarea { display: flex; gap: 10px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--borde); }
.tarea input[type=checkbox] { width: 16px; height: 16px; flex: none; }
.tarea.hecha span { text-decoration: line-through; color: var(--texto-3); }
.tarea span { flex: 1; }

/* ---------- Panel ---------- */
.grupo-alerta { border-bottom: 1px solid var(--borde); }
.grupo-alerta:last-child { border-bottom: 0; }
.grupo-alerta summary { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; cursor: pointer; list-style: none; gap: 12px; }
.grupo-alerta summary::-webkit-details-marker { display: none; }
.grupo-alerta summary > span:first-child::before { content: ''; display: inline-block; width: 6px; height: 6px; border-right: 1.8px solid var(--texto-3); border-bottom: 1.8px solid var(--texto-3); transform: rotate(-45deg); margin: 0 12px 2px 0; transition: transform .15s; }
.grupo-alerta[open] summary > span:first-child::before { transform: rotate(45deg); }
.grupo-alerta summary:hover { background: var(--superficie-2); }
.grupo-alerta .items { padding: 0 20px 12px 38px; }
.grupo-alerta .item { display: flex; gap: 10px; padding: 6px 0; font-size: 13px; border-top: 1px dashed var(--borde); }
.grupo-alerta .item a { min-width: 240px; font-weight: 600; }
.vencimiento { display: flex; justify-content: space-between; align-items: center; padding: 11px 20px; border-bottom: 1px solid var(--borde); gap: 14px; }
.vencimiento:last-child { border-bottom: 0; }
.fecha-bloque { width: 44px; flex: none; text-align: center; border: 1px solid var(--borde); border-radius: 9px; overflow: hidden; background: var(--superficie); box-shadow: var(--sombra-1); }
.fecha-bloque span { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 750; background: var(--marca); color: var(--marca-texto); padding: 2px 0; }
.fecha-bloque strong { display: block; font-size: 17px; font-weight: 650; padding: 3px 0 4px; font-variant-numeric: tabular-nums; }
.venc-info { flex: 1; min-width: 0; }
.venc-info strong { font-weight: 600; }
.barra { height: 8px; background: var(--superficie-3); border-radius: 99px; overflow: hidden; }
.barra > div { height: 100%; background: var(--marca); border-radius: 99px; }
.barra.b-aviso > div { background: #d99a2b; }
.barra.b-pend > div { background: #d6453a; }
.cobertura { display: flex; flex-direction: column; gap: 14px; }
.cobertura a { color: inherit; text-decoration: none; display: flex; flex-direction: column; gap: 6px; }
.cobertura a:hover .barra { filter: brightness(1.05); }
.cobertura .fila { display: flex; justify-content: space-between; font-size: 13px; font-weight: 550; }

/* ---------- Modal y avisos ---------- */
.modal-fondo { position: fixed; inset: 0; background: rgba(8, 18, 13, .5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal-fondo[hidden] { display: none; }
.modal { background: var(--superficie); border-radius: 16px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: var(--sombra-2), 0 0 0 1px rgba(16, 24, 40, .06); animation: aparece .16s ease; }
.modal.ancho { width: min(780px, 100%); }
.modal.visor { width: min(1200px, 100%); height: calc(100vh - 32px); display: flex; flex-direction: column; overflow: hidden; }
.modal.visor .modal-cab { align-items: center; }
.modal.visor .modal-cab h2 { font-size: 15px; word-break: break-word; }
.visor-marco { flex: 1; width: 100%; border: 0; background: #525659; }
.visor-img { flex: 1; overflow: auto; display: grid; place-items: center; background: var(--superficie-3); padding: 16px; }
.visor-img img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: var(--sombra-2); border-radius: 4px; }
.modal-cab { padding: 18px 22px; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.modal-cab h2 { font-size: 16.5px; }
.modal-cab p { margin: 3px 0 0; color: var(--texto-2); font-size: 13px; }
.modal-cuerpo { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
.modal-pie { padding: 12px 22px; border-top: 1px solid var(--borde); display: flex; justify-content: flex-end; gap: 8px; background: var(--superficie-2); border-radius: 0 0 16px 16px; position: sticky; bottom: 0; }
.cerrar { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--texto-3); width: 32px; height: 32px; border-radius: 8px; flex: none; }
.cerrar:hover { background: var(--superficie-3); color: var(--texto); }
.vista-previa { background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 9px; padding: 11px 13px; font-size: 13px; }
.vista-previa code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; word-break: break-all; }
.avisos { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.aviso { background: #101828; color: #f2f4f7; padding: 11px 16px; border-radius: 10px; box-shadow: var(--sombra-2); font-size: 13px; max-width: 440px; animation: entra .2s ease; border: 1px solid rgba(255, 255, 255, .08); }
.aviso.error { background: #b42318; color: #fff; }
.aviso button { margin-left: 14px; background: none; border: 0; padding: 0; color: #7fd6ac; font: inherit; font-weight: 700; cursor: pointer; }
.aviso button:hover { text-decoration: underline; }
.opciones-doc { display: flex; flex-direction: column; gap: 8px; }
.opcion-doc { font: inherit; text-align: left; border: 1px solid var(--borde); background: var(--superficie); color: var(--texto); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--sombra-1); transition: .12s; }
.opcion-doc strong { font-weight: 650; }
.opcion-doc:hover { border-color: var(--marca); background: var(--marca-2); }
.opcion-doc span { font-size: 12.5px; color: var(--texto-2); }
.liq-tabla td, .liq-tabla th { padding: 6px 10px; font-size: 12.5px; }
.liq-tabla .r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.liq-tabla tr.total td { font-weight: 700; border-top: 1px solid var(--borde-fuerte); background: var(--superficie-2); }
.logo-empresa { max-height: 56px; max-width: 160px; object-fit: contain; border: 1px solid var(--borde); border-radius: 8px; padding: 4px; background: #fff; }
@media (max-width: 1100px) { .archivo { grid-template-columns: auto minmax(0, 1fr); } .archivo > .acc { grid-column: 2; grid-row: 3; justify-content: flex-start; margin-top: 4px; } }
@keyframes entra { from { transform: translateY(8px); opacity: 0; } }
@keyframes aparece { from { transform: translateY(6px) scale(.985); opacity: 0; } }

/* ---------- Impresión de hoja de vida ---------- */
.pasos-disc { display: flex; gap: 4px; flex-wrap: wrap; }
.pasos-disc span { font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--na-fondo); color: var(--na); white-space: nowrap; }
.pasos-disc span.hecho { background: var(--ok-fondo); color: var(--ok); }
.pasos-disc span.actual { background: var(--aviso-fondo); color: var(--aviso); font-weight: 600; }
.imprimir { display: none; }
@media print {
  /* Documentos impresos: carta, encabezado con logo y datos de la empresa, títulos y tablas en azul institucional,
     firmas alineadas y pie con la fecha de expedición. Los colores de fondo se imprimen (print-color-adjust). */
  @page { size: letter; margin: 15mm 16mm 17mm;
    @bottom-right { content: "Página " counter(page) " de " counter(pages); font: 7.5pt "Segoe UI", Arial, sans-serif; color: #6b7684; } }
  body > .app, .modal-fondo, .avisos { display: none !important; }
  html, body { background: #fff !important; }
  .imprimir { display: block; --tinta: #1b1f24; --acento: #1f3a5f; --acento-suave: #eaf0f6; --linea: #c9d2dd; --gris: #5f6b7a;
    color: var(--tinta); font: 10pt/1.5 "Segoe UI", "Helvetica Neue", Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .imprimir .doc + .doc { break-before: page; page-break-before: always; }
  .imprimir .doc p { text-align: justify; margin: 0 0 8pt; }
  .imprimir .doc strong { font-weight: 650; }
  /* Encabezado */
  .imprimir .doc-cab { display: grid; grid-template-columns: auto 1fr auto; gap: 14pt; align-items: center; padding-bottom: 9pt; margin-bottom: 4pt; border-bottom: 2.2pt solid var(--acento); }
  .imprimir .doc-cab img { height: 50pt; width: auto; max-width: 130pt; object-fit: contain; }
  .imprimir .doc-cab .empresa { font-size: 13pt; font-weight: 700; color: var(--acento); letter-spacing: .01em; line-height: 1.25; }
  .imprimir .doc-cab .linea { font-size: 8pt; color: var(--gris); margin-top: 2pt; }
  .imprimir .doc-cab .meta { text-align: right; font-size: 7.5pt; color: var(--gris); line-height: 1.45; border-left: 0.75pt solid var(--linea); padding-left: 10pt; }
  .imprimir .doc-cab .meta b { display: block; color: var(--tinta); font-size: 8.5pt; font-weight: 650; }
  .imprimir .doc-subcab { height: 2pt; background: var(--acento-suave); margin-bottom: 14pt; }
  .imprimir .doc .lugar-fecha { text-align: right; color: var(--gris); font-size: 9pt; }
  /* Títulos */
  .imprimir .doc h1 { text-align: center; font-size: 13pt; font-weight: 700; color: var(--acento); letter-spacing: .07em; margin: 10pt 0 14pt; padding: 7pt 0; border-top: 0.75pt solid var(--linea); border-bottom: 0.75pt solid var(--linea); }
  .imprimir .doc h2 { font-size: 9pt; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--acento); margin: 14pt 0 6pt; padding-bottom: 3pt; border-bottom: 0.75pt solid var(--linea); break-after: avoid; }
  /* Tablas */
  .imprimir table { width: 100%; border-collapse: collapse; }
  .imprimir .doc table { margin: 4pt 0 11pt; break-inside: auto; }
  .imprimir .doc tr { break-inside: avoid; }
  .imprimir .doc th, .imprimir .doc td { border: 0.6pt solid var(--linea); padding: 3.5pt 6pt; color: var(--tinta); font-size: 9pt; line-height: 1.4; vertical-align: top; position: static; white-space: normal; text-align: left; }
  .imprimir .doc thead th { background: var(--acento); color: #fff; font-weight: 600; font-size: 8.5pt; letter-spacing: .02em; border-color: var(--acento); }
  .imprimir .doc tbody th { background: var(--acento-suave); color: var(--acento); font-weight: 600; }
  .imprimir .doc tbody tr:nth-child(even) td { background: #f8fafc; }
  .imprimir .doc table.datos th { width: 17%; font-size: 7.5pt; text-transform: uppercase; letter-spacing: .05em; vertical-align: middle; }
  .imprimir .doc table.datos td { width: 33%; background: #fff !important; }
  .imprimir .doc .r { text-align: right; white-space: nowrap; }
  .imprimir .doc .f { white-space: nowrap; }
  .imprimir .doc table.compacta th, .imprimir .doc table.compacta td { padding: 3pt 4.5pt; font-size: 8.5pt; }
  .imprimir .doc .c { text-align: center; }
  .imprimir .doc tr.total th, .imprimir .doc tr.total td { font-weight: 700; background: #dde6f0 !important; color: var(--acento); border-top: 1.2pt solid var(--acento); }
  /* Resumen en cifras */
  .imprimir .cifras { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 6pt; margin: 4pt 0 12pt; break-inside: avoid; }
  .imprimir .cifras > div { border: 0.6pt solid var(--linea); border-top: 2pt solid var(--acento); padding: 5pt 7pt; }
  .imprimir .cifras span { display: block; font-size: 7pt; text-transform: uppercase; letter-spacing: .06em; color: var(--gris); }
  .imprimir .cifras strong { display: block; font-size: 13pt; color: var(--acento); line-height: 1.3; }
  .imprimir .cifras small { display: block; font-size: 7.5pt; color: var(--gris); }
  /* Firmas, notas y pie */
  .imprimir .firmas { display: flex; gap: 30pt; margin-top: 58pt; align-items: flex-start; break-inside: avoid; }
  .imprimir .firmas > div { flex: 1; border-top: 0.9pt solid var(--tinta); padding-top: 4pt; font-size: 8.5pt; line-height: 1.45; color: var(--gris); }
  .imprimir .firmas > div strong { color: var(--tinta); font-size: 9pt; }
  .imprimir .firmas > div.vacia { border-top: 0; }
  .imprimir .firmas > div.huella { flex: 0 0 62pt; height: 76pt; margin-top: -46pt; border: 0.9pt solid var(--tinta); display: flex; align-items: flex-end; justify-content: center; padding: 0 0 3pt; font-size: 7.5pt; }
  .imprimir .nota-doc { font-size: 8.5pt; color: var(--gris); }
  .imprimir .doc .notas { margin-top: 10pt; padding: 6pt 9pt; background: #f6f8fb; border-left: 2pt solid var(--acento); font-size: 8pt; color: var(--gris); break-inside: avoid; }
  .imprimir .doc .notas p { margin: 0 0 3pt; text-align: left; }
  .imprimir .renglones div { border-bottom: 0.6pt solid #9aa5b3; height: 19pt; }
  .imprimir .en-blanco { display: inline-block; width: 190pt; height: 13pt; border-bottom: 0.6pt solid #9aa5b3; vertical-align: bottom; }
  .imprimir .doc-pie { margin-top: 22pt; padding-top: 5pt; border-top: 0.6pt solid var(--linea); display: flex; justify-content: space-between; gap: 12pt; font-size: 7pt; color: var(--gris); break-inside: avoid; }
  /* Hoja de vida: foto junto a los datos principales */
  .imprimir .ficha-doc { display: grid; grid-template-columns: 1fr auto; gap: 14pt; align-items: start; margin-bottom: 4pt; }
  .imprimir .ficha-doc img { width: 84pt; height: 104pt; object-fit: cover; border: 0.75pt solid var(--linea); }
  .imprimir .ficha-doc .nombre { font-size: 15pt; font-weight: 700; color: var(--acento); line-height: 1.2; }
  .imprimir .ficha-doc .sub { color: var(--gris); font-size: 9pt; margin-top: 2pt; }
}


@media (max-width: 1440px) { .buscador { width: 230px; } .btn-icono span { display: none; } }
@media (max-width: 1200px) { .rejilla-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rejilla-3 { grid-template-columns: 1fr; } .buscador { width: 200px; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .lateral { position: static; height: auto; }
  #menu { display: flex; flex-wrap: wrap; gap: 2px; }
  #menu a.activo::before { display: none; }
  .menu-titulo, .pie-lateral { display: none; }
  .barra-sup { position: static; flex-wrap: wrap; padding: 10px 16px; }
  .barra-acciones { flex-wrap: wrap; width: 100%; }
  .buscador { flex: 1; width: auto; min-width: 180px; }
  .buscador kbd { display: none; }
  .principal { padding: 16px; }
  .rejilla-2, .rejilla-4, .rejilla-panel, .rejilla-resumen { grid-template-columns: 1fr; }
  .soportes { grid-template-columns: 1fr; }
  .carpetas { border-right: 0; border-bottom: 1px solid var(--borde); border-radius: var(--radio) var(--radio) 0 0; }
  .buscar { min-width: 0; width: 100%; }
  .ficha-datos > div { padding: 10px 16px; }
}

/* ---------- Pantalla de inicio (sin copia abierta) ---------- */
body.sin-sesion { background: radial-gradient(900px 500px at 15% -10%, color-mix(in srgb, var(--marca) 14%, transparent), transparent 70%), var(--fondo); }
body.sin-sesion .app { grid-template-columns: 1fr; }
body.sin-sesion .lateral, body.sin-sesion .barra-sup { display: none; }
.inicio { max-width: 540px; margin: 10vh auto 0; display: flex; flex-direction: column; gap: 18px; padding: 0 16px; }
.inicio .tarjeta-cuerpo { padding: 26px 28px; }
.inicio .tarjeta { box-shadow: var(--sombra-2); }
.inicio h2 { margin-bottom: 8px; font-size: 17px; }
.inicio p { margin: 0 0 14px; }
.inicio-marca { display: flex; gap: 14px; align-items: center; }
.inicio-marca .logo { width: 50px; height: 50px; font-size: 23px; border-radius: 13px; }
.inicio-marca h1 { font-size: 25px; }
.inicio-marca p { margin: 0; }

/* ===== Diseño 03 · navegación superior, estilo corporativo ===== */
:root { --fondo: #f3f4f6; --superficie-2: #f7f8fa; --superficie-3: #eceff3; --borde: #dfe3e9; --borde-fuerte: #c6ccd6; --texto: #13203a; --texto-2: #4a5570; --texto-3: #8790a3;
  --azul: #12284a; --azul-2: #1d3d6b; --azul-claro: #e8eef7; --radio: 6px; --sombra: 0 1px 0 rgba(19, 32, 58, .04); --sombra-1: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --azul: #0a1628; --azul-2: #13284a; --azul-claro: #1a2638; } }
:root[data-theme="dark"] { --azul: #0a1628; --azul-2: #13284a; --azul-claro: #1a2638; }

.app { display: block; min-height: 100vh; }
.cabecera { position: sticky; top: 0; z-index: 40; background: var(--azul); color: #fff; display: flex; align-items: center; gap: 24px; padding: 0 32px; height: 60px; }
.cabecera .marca { padding: 0; border: 0; gap: 11px; flex: none; }
.cabecera .marca strong { color: #fff; font-size: 14.5px; }
.cabecera .marca span { color: #8ea2c3; }

<script>
'use strict';
/* Almacenamiento: cada compañía tiene en «Copias de seguridad» su subcarpeta con
     - las copias "Expediente <Compañía> AAAA-MM-DD.json": hojas de vida, ajustes e índice de documentos (pocos MB), y
     - la carpeta "Documentos", con cada documento como un archivo suelto que se llama como su id ("c123.pdf").
   - La carpeta "Copias de seguridad" se vincula una vez (Edge o Chrome).
   - Al abrir se lee la copia .json más reciente; los documentos se leen de "Documentos" cuando se necesitan.
   - Cada cambio queda guardado al instante en el navegador (IndexedDB), también los documentos nuevos.
   - Poco después del último cambio, o al salir de la pestaña, se escribe la copia de esa hora ("Expediente <Compañía>
     AAAA-MM-DD HHh.json"): solo se pasan a "Documentos" los documentos nuevos (el id de un documento nunca cambia:
     reemplazar crea otro) y se borran los que ya no usa ninguna copia guardada, ni la papelera, ni el historial de deshacer.
     Se conservan todas las copias de los 7 días más recientes con copias.
   - Las copias antiguas (versión 2) traen los documentos dentro del .json; se siguen abriendo y se pasan solas a este formato.
   - Si se cierra la pestaña antes de escribir la copia, los cambios siguen en el navegador y se escriben al volver a abrir. */

const FORMATO = 'expediente-laboral-mindala';
const MARCA_DOCS = '"documentos":{';
const VERSION_COPIA = 3;
const CARPETA_DOCS = 'Documentos';
const DIAS_A_CONSERVAR = 7; // se conservan todas las copias por hora de los 7 días más recientes que tienen copias
const VERSION_SESION = 4;
/* Una copia por día y hora: "Expediente <Compañía> AAAA-MM-DD HHh.json". Los cambios de la misma hora actualizan esa copia. */
const nombreCopia = (d = new Date()) => `Expediente ${COMPANIA.nombre} ${iso(d)} ${pad(d.getHours())}h.json`;
/* Copias automáticas (por hora, y las diarias de antes): las únicas que se borran solas. */
const reCopia = () => new RegExp('^Expediente ' + COMPANIA.nombre.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ' \\d{4}-\\d{2}-\\d{2}( \\d{2}h)?\\.json$');
const GRUPOS_INICIALES = ['001. Personal/Activos', '001. Personal/Retirados', '002. Aprendiz SENA', '003. Trabajadores por servicio/Activos', '003. Trabajadores por servicio/Retirados'];

/* ---------- Compañías ----------
   La carpeta de copias vinculada («Copias de seguridad») tiene una subcarpeta por compañía con sus copias .json.
   Cada compañía tiene en el navegador su propio almacén (documentos, sesión, historial de deshacer); Mindala conserva
   el que ya tenía. La carpeta vinculada y la última compañía usada se guardan en la configuración general. */
const COMPANIA = { nombre: '' };
const slugCompania = n => String(n).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

/* ---------- IndexedDB: documentos y datos de la copia abierta, y la carpeta de copias vinculada ---------- */

let _db = null, _dbConfig = null;
function abrirBase(nombre, almacenes) {
  return new Promise((ok, mal) => {
    const r = indexedDB.open(nombre, 1);
    r.onupgradeneeded = () => almacenes.forEach(a => r.result.createObjectStore(a));
    r.onsuccess = () => ok(r.result);
    r.onerror = () => mal(r.error || new Error('No se pudo abrir el almacén del navegador.'));
  });
}
/* Almacén de la compañía abierta. */
async function abrirDB() {
  if (_db) return _db;
  if (!COMPANIA.nombre) throw new Error('No hay una compañía abierta.');
  return (_db = await abrirBase('expediente-laboral-' + (slugCompania(COMPANIA.nombre) || 'sin-nombre'), ['docs', 'sesion']));
}
function cerrarDB() { if (_db) { _db.close(); _db = null; } }
/* Configuración general: carpeta de copias vinculada y última compañía usada. */
async function abrirConfig() { return _dbConfig || (_dbConfig = await abrirBase('expediente-laboral', ['config'])); }
async function idbEn(db, almacen, modo, fn) {
  return new Promise((ok, mal) => {
    const tx = db.transaction(almacen, modo), st = tx.objectStore(almacen);
    let res;
    const req = fn(st);
    if (req) req.onsuccess = () => { res = req.result; };
    tx.oncomplete = () => ok(res);
    tx.onerror = tx.onabort = () => mal(tx.error || new Error('Error del almacén del navegador.'));
  });
}
const idb = async (almacen, modo, fn) => idbEn(await abrirDB(), almacen, modo, fn);
const configLeer = async k => idbEn(await abrirConfig(), 'config', 'readonly', st => st.get(k));
const configEscribir = async (k, v) => idbEn(await abrirConfig(), 'config', 'readwrite', st => st.put(v, k));
/* Documento por su id: primero el navegador (lo nuevo que aún no está en la copia) y si no, la carpeta "Documentos". */
async function docGet(id) {
  const local = await docLocal(id);
  if (local) return local;
  const n = S.docsCarpeta.get(id), dir = n && await carpetaDocs(false);
  try { return dir ? await (await dir.getFileHandle(n)).getFile() : null; } catch (_) { return null; }
}
const docLocal = id => idb('docs', 'readonly', st => st.get(id));
const docPut = (id, blob) => idb('docs', 'readwrite', st => st.put(blob, id));
const docBorrar = id => idb('docs', 'readwrite', st => st.delete(id));
const docLimpiar = () => idb('docs', 'readwrite', st => st.clear());
const sesionLeer = () => idb('sesion', 'readonly', st => st.get('actual'));
const sesionEscribir = v => idb('sesion', 'readwrite', st => st.put(v, 'actual'));
const sesionBorrar = () => idb('sesion', 'readwrite', st => st.delete('actual'));
const valorLeer = k => idb('sesion', 'readonly', st => st.get(k));
const valorEscribir = (k, v) => idb('sesion', 'readwrite', st => st.put(v, k));
const valorBorrar = k => idb('sesion', 'readwrite', st => st.delete(k));
const histBorrarTodo = () => idb('sesion', 'readwrite', st => st.delete(IDBKeyRange.bound('h:', 'h:\uffff'))); // puntos del historial de deshacer

const tipoPorNombre = n => ({
  pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp',
  txt: 'text/plain', csv: 'text/csv', zip: 'application/zip',
  docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
})[(String(n).match(/\.([^.]+)$/) || [, ''])[1].toLowerCase()] || 'application/octet-stream';
const partesRuta = r => String(r || '').split('/').filter(Boolean);
const padreDe = r => partesRuta(r).slice(0, -1).join('/');
const ultimoSeg = r => partesRuta(r).pop() || '';

function base64ABytes(s) {
  const bin = atob(s), n = bin.length, out = new Uint8Array(n);
  for (let i = 0; i < n; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* ---------- Carpeta de copias de seguridad ---------- */

const FS = { raiz: null, copias: null, docs: null }; // raiz: «Copias de seguridad»; copias: la subcarpeta de la compañía; docs: su carpeta «Documentos»

async function listarCopiasJson() {
  const out = [];

    if (hd.kind !== 'file' || !/\.json$/i.test(nombre)) continue;
    const file = await hd.getFile();

/* Carga una copia en el navegador, por partes (pesa cientos de MB): primero la cabecera (datos, carpetas, índice)

async function importarCopia(file, progreso) {

      } else if (estado === 'clave') {
        const j = s.indexOf('"', i);

        else { clave += s.slice(i, j); i = j + 1; estado = 'puntos'; }

        if (s[i++] === '"') { estado = 'valor'; saltar = !tipos.has(clave); }
      } else if (estado === 'valor') {

  if (estado !== 'fin') throw new Error('La copia está incompleta (se cortó antes de terminar). Abra una copia anterior.');
  const presentes = new Set(await idb('docs', 'readonly', st => st.getAllKeys()));
  const faltantes = (cab.archivos || []).filter(a => !presentes.has(a.id));

}

/* Escribe la copia: primero pasa a «Documentos» los documentos que aún no están ahí (también los de la papelera, para poder
   restaurarlos al abrir la copia en otro momento) y al final la cabecera .json (datos, carpetas, índice).

async function escribirCopia(nombre, { datos, carpetas, archivos }, progreso) {

      enCarpeta.set(id, n); escritos++;
    } else faltan++;
    if (progreso) progreso(i + 1, nuevos.length);
  }
  const lista = archivos.map(a => ({ id: a.id, ruta: a.ruta, size: a.size, mtime: a.mtime, tipo: a.tipo }));
  const cab = JSON.stringify({ formato: FORMATO, version: VERSION_COPIA, exportado: new Date().toISOString(), origen: 'expediente laboral', totalDocumentos: lista.length, documentosEn: CARPETA_DOCS, datos, carpetas, archivos: lista });

function tieneArchivo(w, cat, re) { return w.archivos.some(a => a.cat === cat && (!re || re.test(sinTildes(a.nombre)))); }
function retiroDe(w) { return w.d.fechaRetiro ? fecha(w.d.fechaRetiro) : null; }
/* Sustitución patronal (arts. 67 a 70 CST): el trabajador viene de otra empresa. Si se reconoce la continuidad del contrato,
   las prestaciones, las vacaciones y la antigüedad se cuentan desde su ingreso a la empresa anterior. */
function sustitucionDe(w) { const s = w.d.sustitucion; return w.tipo === 'laboral' && s && s.activa === 'si' ? s : null; }
function continuaSustitucion(w) { const s = sustitucionDe(w); return !!(s && s.continuidad !== 'actual' && s.fechaIngreso); }
/* Fecha desde la que se cuentan las prestaciones: la de ingreso o, con sustitución patronal y continuidad, la de la empresa anterior. */
function ingresoDe(w) {
  const propia = w.d.fechaIngreso ? fecha(w.d.fechaIngreso) : null;

/* Estados de celda: ok (con soporte), reg (registrado sin soporte), liq (pagado en liquidación),
   pend (vencido sin soporte), prox (aún no vence), na (no aplica), sin (sin registro, informativo), parcial */
function estadoCelda({ archivos, man, vence, retiro, okManual }) {
  if (archivos && archivos.length) return 'ok';
  if (man && man.estado === 'na') return 'na';
  if (man && man.estado === okManual) return 'reg';
  if (retiro && vence && retiro < vence) return 'liqx';
  if (vence && vence < hoy()) return 'pend';
  return 'prox';
}

/* ---------- Número de contrato ----------
   Es la cédula. Si la persona tiene varios contratos (la misma cédula en varios expedientes), se numeran por fecha de
   ingreso: cédula-1, cédula-2… Se puede escribir otro número en la hoja de vida. */
const soloDigitos = s => String(s || '').replace(/\D/g, '');
function contratosDe(w) {
  const doc = soloDigitos(w.d.documento);
  if (!doc) return [w];
  return S.ws.filter(x => x.d && soloDigitos(x.d.documento) === doc)
    .sort((a, b) => (a.d.fechaIngreso || '9999').localeCompare(b.d.fechaIngreso || '9999') || a.id.localeCompare(b.id));
}
function numeroContratoAuto(w) {
  const doc = soloDigitos(w.d.documento); if (!doc) return '';

}
const numeroContrato = w => (w.d.numeroContrato || numeroContratoAuto(w));

/* ---------- Primas de servicios ---------- */

function calcPrimas(w) {
  if (w.tipo !== 'laboral') return null;
  const ing = ingresoDe(w);
  const claves = Object.keys(w.det.primas).sort();
  let desde = ing;
  let estimado = false;
  if (!desde && claves.length) { const [y, s] = claves[0].split('-').map(Number); desde = new Date(y, s === 1 ? 0 : 6, 1); estimado = true; }
  if (!desde) return { sinFecha: true, celdas: [] };
  const retiro = retiroDe(w), H = hoy(), celdas = [];
  for (let y = desde.getFullYear(); y <= H.getFullYear(); y++) {
    for (const s of [1, 2]) {
      const iniS = new Date(y, s === 1 ? 0 : 6, 1), finS = new Date(y, s === 1 ? 5 : 11, s === 1 ? 30 : 31);
      if (finS < desde || iniS > H || (retiro && iniS > retiro)) continue;
      const key = y + '-' + s, vence = s === 1 ? new Date(y, 5, 30) : new Date(y, 11, 20);
      const archivos = w.det.primas[key] || [], man = manual(w, 'primas', key);
      let estado = estadoCelda({ archivos, man, vence, retiro, okManual: 'ok' });
      if (estado === 'liqx') estado = liquidado(w) ? 'liq' : 'pend';
      celdas.push({ key, anio: y, s, titulo: (s === 1 ? 'Primer' : 'Segundo') + ' semestre ' + y, vence: iso(vence), estado, archivos, man });
    }
  }
  return { celdas, estimado, desde: iso(desde) };
}

/* ---------- Dotación (art. 230 CST: 30 abr, 31 ago, 20 dic) ---------- */

const CORTES_DOT = [{ s: 1, mes: 3, dia: 30, nombre: 'Abril' }, { s: 2, mes: 7, dia: 31, nombre: 'Agosto' }, { s: 3, mes: 11, dia: 20, nombre: 'Diciembre' }];

function aplicaDotacion(w, anio) {
  const sal = Number(w.d.salario) || 0;
  const smmlv = Number((ajustes().smmlv || {})[anio]) || 0;
  return !(sal && smmlv && sal > 2 * smmlv);
}

function calcDotacion(w) {
  if (w.tipo !== 'laboral') return null;
  const ing = ingresoDe(w);
  const claves = Object.keys(w.det.dotacion).sort();
  let desde = ing ? sumarMeses(ing, 3) : null, estimado = false;
  if (!desde && claves.length) { const [y, s] = claves[0].split('-').map(Number); desde = new Date(y, CORTES_DOT[s - 1].mes, 1); estimado = true; }
  if (!desde) return { sinFecha: true, celdas: [] };
  const retiro = retiroDe(w), H = hoy(), celdas = [];
  for (let y = desde.getFullYear(); y <= H.getFullYear(); y++) {
    for (const c of CORTES_DOT) {
      const vence = new Date(y, c.mes, c.dia);
      if (vence < desde && !(w.det.dotacion[y + '-' + c.s])) continue;
      if (retiro && vence > retiro) continue;
      const key = y + '-' + c.s, archivos = w.det.dotacion[key] || [], man = manual(w, 'dotacion', key);
      let estado = estadoCelda({ archivos, man, vence, retiro: null, okManual: 'ok' });
      if (estado !== 'ok' && !aplicaDotacion(w, y)) estado = 'na';
      celdas.push({ key, anio: y, s: c.s, titulo: 'Dotación ' + c.nombre.toLowerCase() + ' ' + y, vence: iso(vence), estado, archivos, man });
    }
  }
  return { celdas, estimado };
}

/* ---------- Cesantías e intereses (intereses: 31 ene; consignación: 14 feb) ---------- */

function calcCesantias(w) {
  if (w.tipo !== 'laboral') return null;
  const ing = ingresoDe(w);
  const anios = Object.keys(w.det.intereses).map(Number).sort();
  let desdeY = ing ? ing.getFullYear() : anios[0], estimado = !ing;
  if (!desdeY) return { sinFecha: true, filas: [] };
  const retiro = retiroDe(w), H = hoy(), filas = [];
  const hastaY = retiro ? Math.min(retiro.getFullYear(), H.getFullYear()) : H.getFullYear();
  for (let y = desdeY; y <= hastaY; y++) {
    const venceInt = new Date(y + 1, 0, 31), venceCons = new Date(y + 1, 1, 14);
    const enLiquidacion = retiro && retiro.getFullYear() === y;
    const man = manual(w, 'cesantias', String(y)) || {};
    const archInt = w.det.intereses[y] || [], archCons = w.det.consignacion[y] || [];
    let int = archInt.length ? 'ok' : man.intereses === 'ok' ? 'reg' : man.intereses === 'na' ? 'na' : enLiquidacion ? (liquidado(w) ? 'liq' : 'pend') : venceInt < H ? 'pend' : 'prox';
    let cons = archCons.length ? 'ok' : man.consignacion === 'ok' ? 'reg' : man.consignacion === 'na' ? 'na' : enLiquidacion ? (liquidado(w) ? 'liq' : 'sin') : venceCons < H ? 'sin' : 'prox';    filas.push({ key: String(y), anio: y, int, cons, archInt, archCons, man, venceInt: iso(venceInt), venceCons: iso(venceCons) });
  }
  return { filas, estimado };
}

/* ---------- Vacaciones: 15 días hábiles por cada 360 días laborados ---------- */

const redondear = n => Math.round(n * 100) / 100;
const esFinFebrero = d => d.getMonth() === 1 && sumarDias(d, 1).getMonth() === 2;

/* Días entre dos fechas (inclusive) con año comercial: meses de 30 días, como se liquida la nómina. */
function dias360(a, b) {
  if (!a || !b || b < a) return 0;
  let d1 = a.getDate(), d2 = b.getDate();
  if (d1 === 31) d1 = 30;
  if (d2 === 31 || esFinFebrero(b)) d2 = 30;
  return (b.getFullYear() - a.getFullYear()) * 360 + (b.getMonth() - a.getMonth()) * 30 + (d2 - d1) + 1;
}

/* Festivos de Colombia (fijos, Ley Emiliani y los que dependen de la Pascua). */
function pascua(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  return new Date(y, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1);
}
const _festivos = {};
function festivos(y) {
  if (_festivos[y]) return _festivos[y];
  const lunes = d => sumarDias(d, (8 - d.getDay()) % 7);
  const P = pascua(y);
  const lista = [
    new Date(y, 0, 1), new Date(y, 4, 1), new Date(y, 6, 20), new Date(y, 7, 7), new Date(y, 11, 8), new Date(y, 11, 25),
    lunes(new Date(y, 0, 6)), lunes(new Date(y, 2, 19)), lunes(new Date(y, 5, 29)), lunes(new Date(y, 7, 15)),
    lunes(new Date(y, 9, 12)), lunes(new Date(y, 10, 1)), lunes(new Date(y, 10, 11)),
    sumarDias(P, -3), sumarDias(P, -2), sumarDias(P, 43), sumarDias(P, 64), sumarDias(P, 71),
  ];
  return (_festivos[y] = new Set(lista.map(iso)));
}
function esHabil(d) {
  const dia = d.getDay();
  if (dia === 0) return false;
  if (dia === 6 && ajustes().sabadoHabil === false) return false;
  return !festivos(d.getFullYear()).has(iso(d));
}
function diasHabiles(desde, hasta) {
  let n = 0;
  for (let d = new Date(desde); d <= hasta && n < 400; d = sumarDias(d, 1)) if (esHabil(d)) n++;
  return n;
}
/* Último día de vacaciones a partir de la fecha de inicio y los días hábiles a disfrutar. */
function finVacaciones(desde, dias) {
  let d = new Date(desde), n = 0;
  for (let i = 0; i < 400; i++, d = sumarDias(d, 1)) { if (esHabil(d)) n++; if (n >= dias) return d; }
  return d;
}
function diaRegreso(hasta) { let d = sumarDias(hasta, 1); while (!esHabil(d)) d = sumarDias(d, 1); return d; }

/* Días calendario de licencias no remuneradas o suspensiones dentro de un rango: no cuentan como laborados. */
function diasNoLaborados(w, a, b) {
  return (w.d.novedades || []).reduce((t, n) => {
    const i = maxFecha(fecha(n.desde), a), f = fecha(n.hasta) < b ? fecha(n.hasta) : b;
    return t + (i && f && f >= i ? Math.round((f - i) / 86400000) + 1 : 0);
  }, 0);
}

/* Vacaciones compensadas en dinero: se registran con el valor y la fecha de pago, sin días. Un registro así compensa lo
   que le quede al periodo (lo causado menos lo disfrutado y lo compensado con días); si hay varios, lo toma el primero.
   Los registros antiguos que traen días siguen contando esos días. */
const sinDias = r => r.tipo === 'Compensadas en dinero' && (r.dias === undefined || r.dias === null || r.dias === '');
function compensarSaldo(rs, causados, disfrutados, diasComp) {
  const comp = rs.filter(r => r.tipo === 'Compensadas en dinero');
  const conDias = comp.filter(r => !sinDias(r)).reduce((t, r) => t + (Number(r.dias) || 0), 0);
  const auto = comp.filter(sinDias), resto = auto.length ? Math.max(0, redondear(causados - disfrutados - conDias)) : 0;
  auto.forEach((r, i) => diasComp.set(r.id, i === 0 ? resto : 0));
  return conDias + resto;
}
/* Días de un registro de vacaciones (en los compensados sin días, los que compensa del periodo). */
function diasReg(w, r) {
  if (!sinDias(r)) return Number(r.dias) || 0;
  const v = w.c && w.c.vacaciones;
  return (v && v.diasComp && v.diasComp.get(r.id)) || 0;
}

/* Nombre del periodo como rango de años ("Periodo 2024-2025") y sus fechas exactas. */
function nombrePeriodo(p) {
  const a = String(p.ini).slice(0, 4), b = String(p.fin).slice(0, 4);
  return 'Periodo ' + (a === b ? a : a + '-' + b);
}
function rangoPeriodo(p) { return 'del ' + fechaCorta(p.ini) + ' al ' + fechaCorta(p.fin); }

function calcVacaciones(w) {
  if (w.tipo !== 'laboral') return null;
  const ing = ingresoDe(w), retiro = retiroDe(w), H = hoy(), limite = retiro && retiro < H ? retiro : H;
  const regs = w.d.vacaciones || [];
  const saldoInicial = Number(w.d.vacSaldoInicial) || 0;
  const aniosSop = Object.keys(w.det.vacaciones).map(Number).sort();
  const diasComp = new Map(); // días que compensa cada registro compensado sin días (ver compensarSaldo)

  if (!ing) {
    // Sin fecha de ingreso: estimación por año calendario desde el primer soporte.
    if (!aniosSop.length && !regs.length) return { modo: 'sinFecha', periodos: [], pendientes: 0, diasPend: 0, disponibles: 0 };
    const primero = Math.min(...aniosSop.concat(regs.map(r => +r.anio || 9999)));
    const periodos = [];
    for (let y = primero; y <= limite.getFullYear() - 1; y++) {
      const rs = regs.filter(r => +r.anio === y), archivos = w.det.vacaciones[y] || [];
      const disfrutados = rs.filter(r => r.tipo !== 'Compensadas en dinero').reduce((t, r) => t + (Number(r.dias) || 0), 0) || (archivos.length ? 15 : 0);
      const compensados = compensarSaldo(rs, 15, disfrutados, diasComp);
      const na = rs.some(r => r.tipo === 'No aplica');
      const saldo = na ? 0 : Math.max(0, 15 - disfrutados - compensados);
      periodos.push({ k: y, anio: y, ini: y + '-01-01', fin: y + '-12-31', causado: true, laborados: 360, causados: 15, disfrutados, compensados, saldo, regs: rs, archivos, porConfirmar: archivos.length && !rs.length, estado: na ? 'na' : saldo <= 0 ? 'ok' : (disfrutados + compensados) ? 'parcial' : 'pend' });
    }
    const disponibles = periodos.reduce((t, p) => t + p.saldo, 0) + saldoInicial;
    return { modo: 'calendario', diasComp, periodos, estimado: true, pendientes: periodos.filter(p => p.saldo > 0).length, diasPend: disponibles, disponibles, causadosTot: periodos.length * 15, disfrutadosTot: periodos.reduce((t, p) => t + p.disfrutados, 0), compensadosTot: periodos.reduce((t, p) => t + p.compensados, 0), saldoInicial, vencidas: 0 };
  }

  // 1. Periodos de 360 días laborados desde el ingreso (las licencias no remuneradas corren el final del periodo).
  const periodos = [];
  let ini = ing;
  for (let k = 1; k < 80 && ini <= limite; k++) {
    const base = sumarDias(sumarAnios(ini, 1), -1);
    let fin = base;
    for (let i = 0; i < 6; i++) { const f2 = sumarDias(base, diasNoLaborados(w, ini, fin)); if (+f2 === +fin) break; fin = f2; }
    const causado = fin <= limite;
    const hasta = causado ? fin : limite;
    const noLab = diasNoLaborados(w, ini, hasta);
    const laborados = causado ? 360 : Math.max(0, dias360(ini, hasta) - noLab);
    periodos.push({ k, ini: iso(ini), fin: iso(fin), causado, laborados, noLaborados: noLab, causados: causado ? 15 : redondear(laborados * 15 / 360), regs: regs.filter(r => +r.periodo === k), archivos: [] });
    ini = sumarDias(fin, 1);
  }

  // 2. Soportes de la carpeta que no están amarrados a un registro: se asignan al primer periodo sin registros (15 días por confirmar).
  const usadas = new Set(regs.map(r => r.soporte).filter(Boolean));
  const libres = aniosSop.filter(y => !w.det.vacaciones[y].every(a => usadas.has(a.ruta)));
  const asignados = new Set();
  for (const p of periodos) {
    if (p.regs.length) { p.archivos = w.archivos.filter(a => p.regs.some(r => r.soporte === a.ruta)); continue; }
    const y = libres.find(y => !asignados.has(y) && y >= +p.ini.slice(0, 4));
    if (y && (p.causado || y <= H.getFullYear())) { asignados.add(y); p.archivos = w.det.vacaciones[y].filter(a => !usadas.has(a.ruta)); p.anioSoporte = y; p.porConfirmar = true; }
  }

  // 3. Disfrutados, compensados y saldo de cada periodo.
  for (const p of periodos) {
    const suma = tipo => p.regs.filter(r => r.tipo === tipo).reduce((t, r) => t + (Number(r.dias) || 0), 0);
    p.disfrutados = suma('Disfrutadas') + (p.porConfirmar ? 15 : 0);
    p.compensados = compensarSaldo(p.regs, p.causados, p.disfrutados, diasComp);
    const na = p.regs.some(r => r.tipo === 'No aplica');
    p.saldo = na ? 0 : redondear(p.causados - p.disfrutados - p.compensados);
    if (na) p.estado = 'na';
    else if (!p.causado) p.estado = p.saldo < 0 ? 'anticipadas' : 'curso';
    else if (p.saldo <= 0) p.estado = 'ok';
    else if (p.disfrutados + p.compensados > 0) p.estado = 'parcial';
    else p.estado = 'pend';
    p.vencida = p.causado && p.saldo > 0 && sumarAnios(fecha(p.fin), 1) < H;
  }

  const cuenta = periodos.filter(p => p.estado !== 'na');
  const sum = k => redondear(cuenta.reduce((t, p) => t + (p[k] || 0), 0));
  const cumplidos = periodos.filter(p => p.causado && p.saldo > 0);
  const actual = periodos.find(p => !p.causado);
  const disponibles = redondear(sum('saldo') + saldoInicial);
  return {
    modo: 'periodos', diasComp, periodos, saldoInicial,
    causadosTot: sum('causados'), disfrutadosTot: sum('disfrutados'), compensadosTot: sum('compensados'), disponibles,
    diasPend: redondear(cumplidos.reduce((t, p) => t + p.saldo, 0) + saldoInicial),
    pendientes: cumplidos.length, vencidas: cumplidos.filter(p => p.vencida).length,
    proporcional: actual ? actual.causados : 0, laboradosActual: actual ? actual.laborados : 0,
    valorEstimado: Number(w.d.salario) ? Math.round(Number(w.d.salario) / 30 * Math.max(0, disponibles)) : 0,
  };
}

/* ---------- Afiliaciones ---------- */

const SISTEMAS = [
  { k: 'eps', nombre: 'Salud (EPS)', corto: 'EPS' },
  { k: 'afp', nombre: 'Pensión (AFP)', corto: 'Pensión' },
  { k: 'arl', nombre: 'Riesgos laborales (ARL)', corto: 'ARL' },
  { k: 'ccf', nombre: 'Caja de compensación', corto: 'Caja' },
  { k: 'ces', nombre: 'Fondo de cesantías', corto: 'Cesantías' },
];
const SISTEMAS_REQ = { laboral: ['eps', 'afp', 'arl', 'ccf', 'ces'], sena: ['eps', 'arl'], servicio: ['eps', 'afp', 'arl'] };

function calcAfiliaciones(w) {
  const req = SISTEMAS_REQ[w.tipo] || [];
  const af = w.d.afiliaciones || {};
  return SISTEMAS.map(s => {
    const archivos = w.det.afil[s.k] || [];
    const reg = af[s.k] || {};
    let estado;
    if (!req.includes(s.k) && !archivos.length && !reg.entidad) estado = 'na';
    else if (archivos.length) estado = 'ok';
    else if (reg.estado === 'na') estado = 'na';
    else if (w.det.afil.general.length) estado = 'gen';
    else if (reg.entidad) estado = 'reg';
    else estado = 'pend';
    return { ...s, requerido: req.includes(s.k), archivos, general: w.det.afil.general, reg, estado };
  });
}

/* ---------- Planillas de contratistas (prestación de servicios) ---------- */

function calcPlanillas(w) {
  if (w.tipo !== 'servicio') return null;
  const ini = ingresoDe(w) || (w.det.contratos[0] && fecha(w.det.contratos[0].fecha));
  if (!ini) return { sinFecha: true, meses: [] };
  const retiro = retiroDe(w), H = hoy();
  const conocidos = Object.keys(w.det.planillas).sort();
  let fin = retiro || (w.estado === 'Activo' ? H : null);
  if (!fin && conocidos.length) { const [y, m] = conocidos[conocidos.length - 1].split('-').map(Number); fin = new Date(y, m - 1, 1); }
  if (!fin) fin = ini;
  const meses = [];
  for (let d = new Date(ini.getFullYear(), ini.getMonth(), 1); d <= fin && meses.length < 120; d = sumarMeses(d, 1)) {
    const key = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    const archivos = w.det.planillas[key] || [], man = manual(w, 'planillas', key);
    const finMes = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    const estado = archivos.length ? 'ok' : man && man.estado === 'ok' ? 'reg' : man && man.estado === 'na' ? 'na' : finMes < H ? 'pend' : 'prox';
    meses.push({ key, titulo: MESES[d.getMonth()] + ' ' + d.getFullYear(), estado, archivos, man });
  }
  return { meses };
}

/* ---------- Préstamos y descuentos ----------
   Cada uno tiene valor total (vacío: descuento recurrente sin tope), frecuencia (quincenal: los días 15 y último del mes;
   mensual: el último día del mes), cuotas fijas (con su calendario) o variables, y los descuentos ya hechos (pagos). */
const finDeMes = (y, m) => new Date(y, m + 1, 0);
/* Las n fechas de descuento desde «desde» (incluida). */
function fechasDescuento(desde, frecuencia, n) {
  const out = []; let y = desde.getFullYear(), m = desde.getMonth();
  while (out.length < n) {
    const q15 = new Date(y, m, 15), fm = finDeMes(y, m);
    if (frecuencia === 'Quincenal' && q15 >= desde) out.push(q15);
    if (fm >= desde) out.push(fm);
    if (++m > 11) { m = 0; y++; }
  }
  return out.slice(0, n);
}
function calcPrestamo(p) {
  const pagos = p.pagos || [], pagado = pagos.reduce((t, x) => t + (Number(x.valor) || 0), 0);
  const monto = Number(p.monto) || 0, conTope = monto > 0, cuota = Number(p.cuota) || 0, fija = p.modalidad !== 'Variable' && cuota > 0;
  const saldo = conTope ? Math.max(0, monto - pagado) : 0, H = hoy(), inicio = fecha(p.inicio) || fecha(p.fecha) || H;
  const siguiente = () => fechasDescuento(new Date(Math.max(+H, +inicio)), p.frecuencia, 1)[0];
  let plan = [], atraso = 0, proxima = null;
  if (fija) {
    const n = conTope ? Math.ceil(monto / cuota) : 0;
    if (conTope) plan = fechasDescuento(inicio, p.frecuencia, n).map((f, i) => ({ fecha: f, valor: i < n - 1 ? cuota : monto - cuota * (n - 1) }));
    const esperado = conTope ? plan.filter(c => c.fecha <= H).reduce((t, c) => t + c.valor, 0)
      : (inicio <= H ? fechasDescuento(inicio, p.frecuencia, 600).filter(f => f <= H).length : 0) * cuota;
    atraso = Math.max(0, esperado - pagado);
    if (conTope) { let acum = 0; for (const c of plan) { acum += c.valor; if (acum > pagado) { proxima = { fecha: c.fecha, valor: Math.min(c.valor, acum - pagado) }; break; } } }
    else proxima = { fecha: siguiente(), valor: cuota };
  } else if (!conTope || saldo > 0) proxima = { fecha: siguiente(), valor: null };
  const terminado = conTope && saldo <= 0;
  const estado = terminado ? 'ok' : atraso > 0 ? 'pend' : 'reg';
  const etq = terminado ? 'Pagado' : atraso > 0 ? 'Atrasado' : !conTope ? 'Recurrente' : fija ? 'Al día' : 'En curso';
  const desc = `${fija ? 'Cuota fija de ' + dinero(cuota) : 'Cuotas variables'}, ${String(p.frecuencia || 'Mensual').toLowerCase()}${fija && conTope ? ` · ${plan.length} cuota(s)` : ''}`;
  /* Lo que falta descontar de las cuotas fijas que vencen hasta «lim» (incluye las atrasadas). */
  const aDescontarHasta = lim => !fija ? 0 : Math.max(0, (conTope ? plan.filter(c => c.fecha <= lim).reduce((t, c) => t + c.valor, 0)
    : (inicio <= lim ? fechasDescuento(inicio, p.frecuencia, 600).filter(f => f <= lim).length : 0) * cuota) - pagado);

function estadoPrestamo(w, x) {

}

/* ---------- Llamados de atención y descargos ----------
   Cada seguimiento es un llamado de atención directo o un proceso de descargos (citación, diligencia y decisión).
   Sus anexos (citación, acta, pruebas, decisión…) son los archivos de su subcarpeta dentro de «Llamados de atención». */
const ANEXOS_DISC = ['Llamado de atención', 'Citación a descargos', 'Acta de descargos', 'Pruebas', 'Decisión', 'Otro anexo'];
const DECISIONES_DISC = ['Archivo sin sanción', 'Llamado de atención escrito', 'Suspensión', 'Terminación del contrato con justa causa', 'Otra'];
const diasEntre = (a, b) => Math.round((b - a) / 86400000);

const fechaDisc = c => c.fecha || c.fechaHechos || '';
function anexosDisc(w, c) {
  if (!c.carpeta) return [];
  return w.archivos.filter(a => padreDe(a.ruta.slice(w.id.length + 1)) === c.carpeta).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
}
function calcCasoDisc(w, c) {
  const H = hoy(), anexos = anexosDisc(w, c), proceso = c.tipo === 'Proceso de descargos', citado = fecha(c.fechaDescargos);
  let estado, etq, alerta = null;
  if (!proceso) {
    estado = anexos.length ? 'ok' : 'pend'; etq = anexos.length ? 'Notificado' : 'Falta soporte firmado';
    if (!anexos.length) alerta = ['baja', `Llamado de atención del ${fechaLarga(fechaDisc(c))} sin soporte firmado`];
  } else if (c.decision) {
    estado = 'ok'; etq = 'Cerrado';
  } else if (citado && citado <= H) {
    // Ya pasó la fecha de la diligencia: falta registrar cómo fue o decidir
    const dias = diasEntre(citado, H);
    estado = 'pend'; etq = c.asistencia ? 'Por decidir' : 'Registrar la diligencia';
    alerta = c.asistencia ? [dias > 15 ? 'alta' : 'media', `Proceso de descargos del ${fechaLarga(fechaDisc(c))}: falta la decisión (descargos hace ${dias} día(s))`]
      : ['media', `Proceso de descargos: registre cómo fue la diligencia del ${fechaLarga(citado)}`];
  } else if (citado) {
    estado = 'reg'; etq = 'Citado a descargos';
  } else {
    const hechos = fecha(c.fechaHechos) || fecha(c.fecha), dias = hechos ? Math.max(0, diasEntre(hechos, H)) : 0;

    alerta = [dias > 15 ? 'alta' : 'media', `Proceso de descargos por hechos del ${fechaLarga(c.fechaHechos || c.fecha)}: falta citar a descargos${dias ? ` (hace ${dias} día(s))` : ''}`];

  const lista = (w.d.disciplinarios || []).map(c => calcCasoDisc(w, c)).sort((a, b) => String(fechaDisc(b.c)).localeCompare(String(fechaDisc(a.c))));
  // Archivos de «Llamados de atención» que no son anexo de ningún seguimiento, agrupados por carpeta
  const usadas = new Set(lista.filter(x => x.c.carpeta).map(x => x.c.carpeta)), grupos = new Map();
  for (const a of w.archivos.filter(a => a.cat === 'llamados')) {

/* Escribe la copia de esta hora, "Expediente <Compañía> AAAA-MM-DD HHh.json", con los datos y pasa a «Documentos» solo
   los documentos nuevos; luego borra las copias de los días viejos y los documentos que ya nadie usa. */
async function escribirCopiaDelDia() {
  clearTimeout(tCopia);

  }

    const r = await escribirCopia(nombre, { datos: JSON.parse(JSON.stringify(S.datos)), carpetas: S.idx.carpetas.slice(), archivos: S.idx.archivos.slice() }, (i, n) => {
      S.copiando = { hechos: i, total: n };

    });
    if (r.faltan) aviso(`${r.faltan} documento(s) del expediente no están ni en este navegador ni en la carpeta «${CARPETA_DOCS}».`, true);

}

/* ---------- Deshacer y rehacer ----------
   Cada cambio guarda un punto del historial: hojas de vida, ajustes e índice de documentos (sin los documentos, que siguen
   en el navegador mientras algún punto los use). Se conservan los últimos puntos de la copia abierta, también si se cierra
   la pestaña; al abrir otra copia el historial empieza de nuevo. */

const PASOS_DESHACER = 40;
const HIST = { estados: [], pos: -1, seq: 0, fotos: new Map(), cola: Promise.resolve(), ocupado: false }; // estados: [{ seq, desc, fecha }]
const TECLA = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl+';
const fotoEstado = () => JSON.stringify({ datos: S.datos, idx: S.idx });
const claveHist = seq => 'h:' + seq;
/* Las escrituras del historial van en orden, una tras otra. */
function histEncolar(fn) { HIST.cola = HIST.cola.then(fn).catch(err => console.error('Historial:', err)); return HIST.cola; }
const histMeta = () => valorEscribir('historial', { sesion: S.meta.cargada, estados: HIST.estados, pos: HIST.pos, seq: HIST.seq });

function histRegistrar(desc) {
  if (HIST.pos < 0) return;
  const foto = fotoEstado();
  const quitados = HIST.estados.splice(HIST.pos + 1); // un cambio nuevo descarta lo que se había deshecho
  const e = { seq: ++HIST.seq, desc, fecha: new Date().toISOString() };
  HIST.estados.push(e);
  quitados.push(...HIST.estados.splice(0, Math.max(0, HIST.estados.length - PASOS_DESHACER - 1)));
  HIST.pos = HIST.estados.length - 1;
  HIST.fotos.set(e.seq, foto);
  quitados.forEach(x => HIST.fotos.delete(x.seq));
  histEncolar(async () => {
    await valorEscribir(claveHist(e.seq), foto);
    for (const x of quitados) await valorBorrar(claveHist(x.seq));
    await histMeta();
  });
  actualizarBotonesHist();
}
async function histLeer(seq) {
  await HIST.cola;
  if (HIST.fotos.has(seq)) return HIST.fotos.get(seq);
  const f = await valorLeer(claveHist(seq)).catch(() => null);
  if (f) HIST.fotos.set(seq, f);
  return f;
}

/* Al abrir: continuar sigue con el historial guardado de esta misma copia; si no, empieza uno nuevo desde el estado actual. */
async function histIniciar(continuar) {
  await HIST.cola;
  Object.assign(HIST, { estados: [], pos: -1, fotos: new Map() });
  if (!S.meta.cargada) { S.meta.cargada = new Date().toISOString(); await guardarSesion(); } // sesiones de versiones anteriores de la página
  const meta = continuar ? await valorLeer('historial').catch(() => null) : null;
  if (meta && meta.sesion === S.meta.cargada && meta.estados && meta.estados[meta.pos]) {
    Object.assign(HIST, { estados: meta.estados, pos: meta.pos, seq: meta.seq });
    if (await histLeer(HIST.estados[HIST.pos].seq) !== fotoEstado()) histRegistrar('Cambios recuperados al abrir');
  } else {
    await histBorrarTodo().catch(() => {});
    const foto = fotoEstado();
    Object.assign(HIST, { estados: [{ seq: 1, desc: 'Copia abierta', fecha: new Date().toISOString() }], pos: 0, seq: 1 });
    HIST.fotos.set(1, foto);
    histEncolar(async () => { await valorEscribir(claveHist(1), foto); await histMeta(); });
  }
  if (continuar) await limpiarHuerfanos();
